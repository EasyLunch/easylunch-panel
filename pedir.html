<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Lunch · Pedí tu plato</title>
<meta name="theme-color" content="#32952E">
<link rel="icon" type="image/png" sizes="192x192" href="gourmet-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="gourmet-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F5;--ink:rgba(0,0,0,.87);--muted:#757575;--line:rgba(0,0,0,.12);--green:#32952E;--green-2:#2A7F27;--orange:#F28A0B;--danger:#E53935;--navy:#2B3B4B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;max-width:100%;overflow-x:hidden}
h1,h2,h3{font-family:Montserrat,sans-serif;font-weight:600;margin:0}
input,button{font:inherit;color:inherit}
button{cursor:pointer}
header{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:20}
.hin{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.hin img{height:36px}
.hin .emp{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.hin .emp b{display:block;color:var(--ink);font-size:14px}
.banner{height:150px;background:#2b2b2b url(gourmet-assets/banner.jpg) center/cover;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 16px}
.banner::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42)}
.banner h1{position:relative;font-size:24px;font-weight:500;line-height:1.3}
main{max-width:960px;margin:0 auto;padding:18px 16px 130px}
.step{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px;margin-bottom:16px}
.step h2{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step h2 i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px}
.step h2 small{font-family:Roboto;font-weight:400;font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.input{width:100%;border:1px solid rgba(0,0,0,.25);border-radius:6px;padding:12px;font-size:16px;background:#fff;outline:none}
.input:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(50,149,46,.15)}
.dates{display:flex;gap:10px;overflow-x:auto;padding:10px 8px 8px 2px;scrollbar-width:thin}
.date{flex:0 0 auto;width:74px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 4px;text-align:center;line-height:1.15}
.date small{display:block;font-size:11px;color:var(--muted)}
.date b{display:block;font-size:22px;font-family:Montserrat;font-weight:600;margin:2px 0}
.date span{font-size:11px;color:var(--muted)}
.date.on{border:2px solid var(--green);background:#EEF7EE}
.date.on b{color:var(--green-2)}
.date{position:relative}
.date.has{background:#F4FAF3}
.date .dn{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{border:2px solid transparent;border-radius:10px;background:#FAFAFA;overflow:hidden;text-align:left;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.1);position:relative;transition:border-color .15s}
.card .ph{aspect-ratio:4/3;background:#e9e9e9 center/cover;display:flex;align-items:center;justify-content:center;color:#aaa;font-family:Montserrat}
.card .cb{padding:10px 12px 12px}
.card h3{font-size:15px;font-weight:600;line-height:1.3}
.card .sub{color:var(--green-2);font-size:13px;margin-top:2px}
.card p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.card.on{border-color:var(--green);background:#fff}
.card .tick{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:none;align-items:center;justify-content:center;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.card.on .tick{display:flex}
.guar{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.guar h3{font-size:15px;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px 6px 6px;text-align:left}
.opt i{flex:0 0 60px;width:60px;height:60px;border-radius:8px;background:#ddd center/cover}
.opt b{font-weight:500;font-size:14px;display:block}
.opt small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.opt.on{border-color:var(--green);background:#EEF7EE}
.nopost{margin-top:12px;border:1px dashed rgba(0,0,0,.3);background:#fff;border-radius:8px;padding:10px 14px;font-size:14px}
.nopost.on{border-style:solid;border-color:var(--green);background:#EEF7EE;color:var(--green-2);font-weight:500}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.12);z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-in{max-width:960px;margin:0 auto;display:flex;gap:14px;align-items:center}
.sum{flex:1;font-size:13px;color:var(--muted);line-height:1.35;min-width:0}
.sum b{color:var(--ink)}
.btn{border:0;background:var(--green);color:#fff;border-radius:6px;padding:14px 22px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#E0E0E0;color:var(--ink)}
.err{background:#FDECEA;color:#B71C1C;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.center{text-align:center;padding:60px 16px;color:var(--muted)}
.ok{max-width:560px;margin:30px auto;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:28px 22px;text-align:center}
.ok .big{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.ok h2{font-size:22px;margin-bottom:6px}
.ok ul{list-style:none;padding:0;margin:18px 0;text-align:left;border-top:1px solid var(--line)}
.ok li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.ok li i{flex:0 0 52px;height:52px;border-radius:8px;background:#ddd center/cover}

.pl{border:2px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;margin-bottom:12px}
.pl.on{border-color:var(--green)}
.pl-h{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;padding:10px;text-align:left}
.pl-h .ph{flex:0 0 132px;width:132px;height:99px;border-radius:8px;background:#e9e9e9 center/cover}
.pl-h h3{font-size:16px;line-height:1.3}
.pl-h .sub{color:var(--green-2);font-size:13px}
.pl-h p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.pl-h .tot{margin-left:auto;flex:0 0 auto;min-width:34px;height:34px;border-radius:17px;padding:0 10px;background:#EEE;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.pl.on .tot{background:var(--green);color:#fff}
.pl-h .chev{flex:0 0 auto;color:var(--muted);font-size:13px;white-space:nowrap}
.gl{border-top:1px dashed var(--line);padding:6px 10px 10px}
.gl .lbl{font-size:13px;color:var(--muted);margin:4px 2px 6px}
.gr{display:flex;align-items:center;gap:10px;padding:6px 2px}
.gr+.gr{border-top:1px solid #F0F0F0}
.gr i{flex:0 0 52px;width:52px;height:52px;border-radius:8px;background:#ddd center/cover}
.gr .t{flex:1;min-width:0}
.gr .t b{font-weight:500;font-size:14px;display:block}
.gr .t small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.st{display:flex;align-items:center;border:1px solid rgba(0,0,0,.2);border-radius:22px;overflow:hidden;flex:0 0 auto;background:#fff}
.st button{width:38px;height:38px;border:0;background:#fff;font-size:20px;line-height:1;color:var(--green-2)}
.st button:disabled{color:#ccc}
.st span{min-width:26px;text-align:center;font-weight:700}
.st.on{border-color:var(--green);background:#EEF7EE}.st.on button{background:#EEF7EE}
.card .st{margin:8px auto 0;width:max-content}
.card .qb{position:absolute;top:10px;right:10px;min-width:30px;height:30px;border-radius:15px;padding:0 8px;background:var(--green);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.who .w{display:flex;flex-direction:column}
.who .w span{font-size:12.5px;color:var(--ink);margin-bottom:3px}
.who .w span small{color:var(--muted)}
.who .input{padding:9px 10px}
@media (max-width:600px){.pl-h .ph{flex-basis:92px;width:92px;height:80px}.pl-h h3{font-size:14.5px}.pl-h p{display:none}.who{grid-template-columns:1fr}.pl-h .chev{display:none}}
@media (max-width:600px){
  .banner{height:120px}.banner h1{font-size:19px}
  .row2{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card h3{font-size:13.5px}.card p{display:none}.card .sub{font-size:12px}
  .opts{grid-template-columns:1fr}
  .btn{padding:13px 16px}
  .hin img{height:30px}
}
</style>
</head>
<body>
<header><div class="hin">
  <img alt="Easy Lunch" src="https://app.easylunch.com.ar/assets/img/upload/XOn7H9LwQB.webp" onerror="this.onerror=null;this.src='gourmet-assets/logo-easylunch-color.png'">
  <div class="emp" id="emp"></div>
</div></header>
<div class="banner"><h1 id="titulo">Elegí tu plato</h1></div>
<main id="main"><div class="center">Cargando menú…</div></main>
<div class="bar" id="bar" hidden><div class="bar-in">
  <div class="sum" id="sum"></div>
  <button class="btn" id="send">Enviar pedido</button>
</div></div>

<script>
/* Pedido sin usuario: el link (?e=TOKEN) ya está asociado a una empresa. */
const SB = 'https://xlwcozznliafhouhqjzl.supabase.co/rest/v1/rpc/';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsd2NvenpubGlhZmhvdWhxanpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTkwMzAsImV4cCI6MjA5NjUzNTAzMH0.i-GTNnGK_5GMUum_tmUKIiX4NUkmEiJovK_M7BwGFfg';
const TOKEN = new URLSearchParams(location.search).get('e') || '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fLarga = s => { const d = pd(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const S = { menu:null, nombre:'', apellido:'', fecha:null, sel:{}, open:{}, err:'' };
// sel[fecha] = { q: { 'plato|guarnicion': cantidad }, paras: { 'plato|guarnicion': ['nombre', ...] } }

async function rpc(fn, body){
  const r = await fetch(SB + fn, { method:'POST', headers:{ apikey:KEY, Authorization:'Bearer '+KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || 'No se pudo conectar. Probá de nuevo.');
  return j;
}

async function cargar(){
  if (!TOKEN) return fatal('Este link no es válido. Pedile a quien te lo envió que te lo pase de nuevo.');
  try { S.menu = await rpc('gourmet_link_menu', { p_token: TOKEN }); }
  catch(e){ return fatal(e.message); }
  $('#emp').innerHTML = `Pedido para<b>${esc(S.menu.empresa)}</b>`;
  if (!S.menu.fechas.length) return fatal('Por el momento no hay fechas disponibles para pedir.');
  S.fecha = S.menu.fechas[0].fecha;
  render();
}
function fatal(msg){ $('#main').innerHTML = `<div class="center"><h3 style="color:#333;margin-bottom:6px">No se puede pedir</h3>${esc(msg)}</div>`; $('#bar').hidden = true; }

const MAXQ = 20;
const principales = () => S.menu.platos.filter(p => p.tipo !== 'postre');
const postres = () => S.menu.platos.filter(p => p.tipo === 'postre');
const byId = id => S.menu.platos.find(p => p.id === id);
const fCorta = s => { const d = pd(s); return `${DIAS[d.getDay()]} ${d.getDate()}`; };
const cur = () => (S.sel[S.fecha] = S.sel[S.fecha] || { q:{}, paras:{} });
const qOf = (f, k) => (S.sel[f] && S.sel[f].q[k]) || 0;
const totPlato = (f, pid) => Object.entries((S.sel[f] || {q:{}}).q).filter(([k]) => k.split('|')[0] === pid).reduce((a, [, n]) => a + n, 0);
const lineas = f => Object.entries((S.sel[f] || {q:{}}).q).filter(([, n]) => n > 0).map(([k, n]) => { const [pid, gid] = k.split('|'); return { k, pid, gid:gid || null, n }; })
  .sort((a, b) => S.menu.platos.indexOf(byId(a.pid)) - S.menu.platos.indexOf(byId(b.pid)));
const unidades = f => lineas(f).reduce((a, l) => a + l.n, 0);
const tiene = f => unidades(f) > 0;
const diasConPedido = () => S.menu.fechas.map(f => f.fecha).filter(tiene);
const nombreLinea = l => { const p = byId(l.pid), g = l.gid && p && p.guarniciones.find(x => x.id === l.gid); return (p ? p.nombre : '') + (g ? ' con ' + g.nombre : ''); };
function textoDia(f){
  const ls = lineas(f), pr = ls.filter(l => byId(l.pid)?.tipo !== 'postre').reduce((a, l) => a + l.n, 0), po = ls.filter(l => byId(l.pid)?.tipo === 'postre').reduce((a, l) => a + l.n, 0);
  return [pr ? `${pr} plato${pr > 1 ? 's' : ''}` : '', po ? `${po} postre${po > 1 ? 's' : ''}` : ''].filter(Boolean).join(' y ');
}
function setQ(k, n){
  const c = cur(); n = Math.max(0, Math.min(MAXQ, n));
  if (n) c.q[k] = n; else delete c.q[k];
  const ps = (c.paras[k] || []).slice(0, n); while (ps.length < n) ps.push(''); c.paras[k] = ps;
  if (!n) delete c.paras[k];
}
const stepper = (k, n) => `<div class="st ${n?'on':''}" data-k="${k}"><button type="button" data-d="-1" ${n?'':'disabled'} aria-label="Menos">−</button><span>${n}</span><button type="button" data-d="1" ${n>=MAXQ?'disabled':''} aria-label="Más">+</button></div>`;

function render(){
  const m = S.menu, ps = principales(), qs = postres(), dia = fCorta(S.fecha), f = S.fecha, ls = lineas(f);
  $('#main').innerHTML = `
    ${S.err ? `<div class="err">${S.err}</div>` : ''}
    <section class="step"><h2><i>1</i>Tus datos</h2>
      <div class="row2">
        <div><label for="nom">Nombre</label><input class="input" id="nom" autocomplete="given-name" value="${esc(S.nombre)}"></div>
        <div><label for="ape">Apellido</label><input class="input" id="ape" autocomplete="family-name" value="${esc(S.apellido)}"></div>
      </div></section>

    <section class="step"><h2><i>2</i>¿Para qué día?</h2>
      <div class="dates">${m.fechas.map(x => { const d = pd(x.fecha), u = unidades(x.fecha); return `<button type="button" class="date ${x.fecha===f?'on':''} ${u?'has':''}" data-f="${x.fecha}">${u?`<em class="dn">${u}</em>`:''}<small>${MESES[d.getMonth()].slice(0,3)}</small><b>${d.getDate()}</b><span>${DIAS[d.getDay()]}</span></button>`; }).join('')}</div>
      <div class="hint">Podés pedir para uno o varios días: elegí el día, armá el pedido y, si querés, pasá a otro día. Se puede pedir hasta las ${esc(m.hora_corte)} hs del día anterior a la entrega.</div></section>

    ${ps.length ? `<section class="step" id="secPlato"><h2><i>3</i>Platos para el ${esc(dia)}</h2>
      <div class="hint" style="margin:-4px 0 12px">Tocá un plato y poné cuántos querés de cada guarnición.</div>
      ${ps.map(p => { const t = totPlato(f, p.id), abierto = S.open[p.id] || t > 0, gs = p.guarniciones;
        return `<div class="pl ${t?'on':''}">
          <button type="button" class="pl-h" data-p="${p.id}"><span class="ph" style="${p.foto_url?`background-image:url('${esc(p.foto_url)}')`:''}"></span>
            <span style="flex:1;min-width:0"><h3>${esc(p.nombre)}</h3>${p.subtitulo?`<div class="sub">${esc(p.subtitulo)}</div>`:''}${p.descripcion?`<p>${esc(p.descripcion)}</p>`:''}</span>
            ${!abierto ? '<span class="chev">Elegir ▾</span>' : ''}<span class="tot">${t}</span></button>
          ${abierto ? `<div class="gl">${gs.length ? `<div class="lbl">¿Con qué guarnición? Poné la cantidad de cada una:</div>` + gs.map(g => { const k = p.id + '|' + g.id; return `<div class="gr"><i style="${g.foto_url?`background-image:url('${esc(g.foto_url)}')`:''}"></i><div class="t"><b>${esc(g.nombre)}</b>${g.descripcion?`<small>${esc(g.descripcion)}</small>`:''}</div>${stepper(k, qOf(f, k))}</div>`; }).join('')
              : `<div class="gr"><div class="t"><b>Cantidad</b></div>${stepper(p.id + '|', qOf(f, p.id + '|'))}</div>`}</div>` : ''}
        </div>`; }).join('')}
    </section>` : ''}

    ${qs.length ? `<section class="step"><h2><i>${ps.length?4:3}</i>Postres para el ${esc(dia)} <small>(opcional)</small></h2>
      <div class="grid" id="gPostres">${qs.map(p => { const k = p.id + '|', n = qOf(f, k); return `<div class="card ${n?'on':''}">
        <div class="ph" style="${p.foto_url?`background-image:url('${esc(p.foto_url)}')`:''}">${p.foto_url?'':'Easy Lunch'}</div>${n?`<span class="qb">${n}</span>`:''}
        <div class="cb"><h3>${esc(p.nombre)}</h3>${p.descripcion?`<p>${esc(p.descripcion)}</p>`:''}${stepper(k, n)}</div></div>`; }).join('')}</div>
    </section>` : ''}

    ${ls.length ? `<section class="step"><h2><i>${(ps.length?1:0)+(qs.length?1:0)+3}</i>¿Para quién es cada uno? <small>(opcional)</small></h2>
      <div class="hint" style="margin:-4px 0 12px">Si lo dejás vacío, va a tu nombre.</div>
      <div class="who">${ls.flatMap(l => Array.from({ length:l.n }, (_, i) => `<label class="w"><span>${esc(nombreLinea(l))}${l.n > 1 ? ` <small>(${i+1} de ${l.n})</small>` : ''}</span><input class="input para" data-k="${l.k}" data-i="${i}" placeholder="${esc((S.nombre + ' ' + S.apellido).trim() || 'Nombre')}" value="${esc((cur().paras[l.k] || [])[i] || '')}"></label>`)).join('')}</div>
      <div style="text-align:center;margin-top:14px"><button type="button" class="nopost" id="borrarDia">Vaciar el pedido del ${esc(dia)}</button></div>
    </section>` : ''}`;

  $('#nom').oninput = e => { S.nombre = e.target.value; resumen(); };
  $('#ape').oninput = e => { S.apellido = e.target.value; resumen(); };
  document.querySelectorAll('.date').forEach(b => b.onclick = () => { S.fecha = b.dataset.f; S.err = ''; render(); $('#secPlato')?.scrollIntoView({ behavior:'smooth', block:'start' }); });
  document.querySelectorAll('.pl-h').forEach(b => b.onclick = () => { const id = b.dataset.p; if (totPlato(S.fecha, id)) return; S.open[id] = !S.open[id]; render(); });
  document.querySelectorAll('.st button').forEach(b => b.onclick = e => { e.stopPropagation(); const k = b.parentElement.dataset.k; setQ(k, qOf(S.fecha, k) + Number(b.dataset.d)); const y = window.scrollY; render(); window.scrollTo(0, y); });
  document.querySelectorAll('.para').forEach(inp => inp.oninput = () => { const c = cur(); (c.paras[inp.dataset.k] = c.paras[inp.dataset.k] || [])[+inp.dataset.i] = inp.value; });
  if ($('#borrarDia')) $('#borrarDia').onclick = () => { delete S.sel[S.fecha]; render(); };
  $('#bar').hidden = false;
  resumen();
}

function faltante(){
  if (S.nombre.trim().length < 2) return 'Completá tu nombre';
  if (S.apellido.trim().length < 2) return 'Completá tu apellido';
  if (!diasConPedido().length) return principales().length ? 'Elegí al menos un plato' : 'Elegí al menos un postre';
  return '';
}
function resumen(){
  const dias = diasConPedido(), f = faltante();
  $('#sum').innerHTML = (dias.length ? dias.map(d => `<b>${esc(fCorta(d))}:</b> ${esc(textoDia(d))}`).join('<br>') : 'Todavía no elegiste nada')
    + (f ? `<br><span style="color:var(--orange)">${esc(f)}</span>` : '');
  $('#send').disabled = !!f;
  $('#send').textContent = dias.length > 1 ? `Enviar ${dias.length} pedidos` : 'Enviar pedido';
}

/** Ítems de un día: agrupa por plato + guarnición + para quién. */
function itemsDia(f){
  const x = S.sel[f], m = new Map();
  lineas(f).forEach(l => (x.paras[l.k] || []).slice(0, l.n).concat(Array(Math.max(0, l.n - (x.paras[l.k] || []).length)).fill('')).forEach(n => {
    const para = String(n || '').trim(), key = l.k + '|' + para.toLowerCase();
    const it = m.get(key) || { plato_id:l.pid, guarnicion_id:l.gid, cantidad:0, para_quien:para };
    it.cantidad++; m.set(key, it);
  }));
  return [...m.values()];
}

$('#send').onclick = async () => {
  if (faltante()) return;
  const btn = $('#send'); btn.disabled = true; btn.textContent = 'Enviando…';
  const ok = [];
  for (const f of diasConPedido()) {
    try {
      const det = lineas(f).map(l => ({ txt:nombreLinea(l), n:l.n, pid:l.pid }));
      const r = await rpc('gourmet_link_pedido', { p_token:TOKEN, p_nombre:S.nombre, p_apellido:S.apellido, p_fecha:f, p_items:itemsDia(f) });
      ok.push({ fecha:f, numero:r.numero, det });
      delete S.sel[f];
    } catch(e) {
      S.err = (ok.length ? `<b>${ok.length === 1 ? 'Se envió 1 pedido' : 'Se enviaron ' + ok.length + ' pedidos'}</b> (${ok.map(o => esc(fCorta(o.fecha))).join(', ')}). ` : '')
        + `<b>No se pudo enviar el del ${esc(fCorta(f))}:</b> ${esc(e.message)}`;
      if (/fecha/i.test(e.message)) { try { S.menu.fechas = (await rpc('gourmet_link_menu', { p_token:TOKEN })).fechas; } catch(_){} }
      if (!S.menu.fechas.some(y => y.fecha === S.fecha)) S.fecha = S.menu.fechas[0]?.fecha || null;
      render(); window.scrollTo({ top:0, behavior:'smooth' });
      return;
    }
  }
  listo(ok);
};

function listo(ok){
  $('#bar').hidden = true; window.scrollTo({ top:0 });
  const foto = id => { const p = byId(id); return p && p.foto_url ? `background-image:url('${esc(p.foto_url)}')` : ''; };
  $('#main').innerHTML = `<div class="ok"><div class="big">✓</div>
    <h2>${ok.length > 1 ? '¡Pedidos recibidos!' : '¡Pedido recibido!'}</h2>
    <div style="color:var(--muted)">Gracias, ${esc(S.nombre.trim())}. Esto es lo que vas a recibir:</div>
    ${ok.map(o => `<div style="text-align:left;margin-top:16px;font-weight:600">${esc(fLarga(o.fecha))} <small style="color:var(--muted);font-weight:400">· pedido #${esc(o.numero)}</small></div>
      <ul style="margin:6px 0 0">${o.det.map(d => `<li><i style="${foto(d.pid)}"></i><span><b>${d.n} ×</b> ${esc(d.txt)}</span></li>`).join('')}</ul>`).join('')}
    <div style="font-size:13px;color:var(--muted);margin:18px 0">Si necesitás cambiar o cancelar algo, avisale a ${esc(S.menu.empresa)}.</div>
    <button class="btn" id="otro">Hacer otro pedido</button></div>`;
  $('#otro').onclick = () => { Object.assign(S, { nombre:'', apellido:'', sel:{}, open:{}, err:'' }); S.fecha = S.menu.fechas[0]?.fecha || null; render(); };
}

cargar();
</script>
</body>
</html>
