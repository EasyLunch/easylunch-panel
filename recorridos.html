<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Easy Lunch — Recorridos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF2EE; --panel:#FFFFFF; --panel2:#F5F8F5; --ink:#17231C; --muted:#5B6B61; --line:#D5DED7;
  --accent:#1F5A3D; --accent-ink:#FFFFFF; --accent-soft:#DCEBE1; --gold:#C98A0B;
  --land:#E6EBE3; --water:#C7DCE6; --road:#B9C2B7; --roadlabel:#7C877F;
  --warn-bg:#FFF3D6; --warn-ink:#7A5200; --bad-bg:#FBE3DF; --bad-ink:#9B2C1C; --ok-ink:#1F6B42;
  --shadow:0 1px 2px rgba(20,40,28,.06),0 6px 18px rgba(20,40,28,.08);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#101713; --panel:#17211B; --panel2:#1C2821; --ink:#E6EEE8; --muted:#9AAAA0; --line:#2B3A31;
  --accent:#5BC08A; --accent-ink:#0C1A12; --accent-soft:#1E3A2A; --gold:#E7B447;
  --land:#1A231E; --water:#1B2E38; --road:#3A4A40; --roadlabel:#8C9A91;
  --warn-bg:#3A2E10; --warn-ink:#F2CF7A; --bad-bg:#3D1C17; --bad-ink:#F4A395; --ok-ink:#7FD3A4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101713; --panel:#17211B; --panel2:#1C2821; --ink:#E6EEE8; --muted:#9AAAA0; --line:#2B3A31;
  --accent:#5BC08A; --accent-ink:#0C1A12; --accent-soft:#1E3A2A; --gold:#E7B447;
  --land:#1A231E; --water:#1B2E38; --road:#3A4A40; --roadlabel:#8C9A91;
  --warn-bg:#3A2E10; --warn-ink:#F2CF7A; --bad-bg:#3D1C17; --bad-ink:#F4A395; --ok-ink:#7FD3A4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
:root{color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92em}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0}
.brand span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
.tab:hover{color:var(--ink);background:var(--panel2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.days{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.day{border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);min-width:44px}
.day[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.day small{display:block;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted)}
main.split{flex:1;display:grid;grid-template-columns:minmax(360px,440px) 1fr;min-height:0}
.panel>*{flex-shrink:0}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;height:100%;min-height:0}
.mapwrap{position:relative;height:100%;min-height:0}
#map{position:absolute;inset:0;background:var(--land)}
.leaflet-container{background:var(--land);font-family:var(--body)}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.mapctl{position:absolute;right:12px;top:12px;z-index:500;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mapnote{position:absolute;left:12px;bottom:10px;z-index:500;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 8px;border-radius:6px}
.vchip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;background:var(--panel)}
.vchip.on{background:var(--accent-soft);border-color:var(--accent)}
.vchip input{margin:0}
.vchip small{color:var(--muted)}
.vtimes{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.vtimes .swatch{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:middle}
.vsel{font-weight:700;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--panel)}
.sheets{position:absolute;inset:0;overflow:auto;background:#d9ddd8;padding:20px 16px;z-index:700}
.sheets .empty{background:#fff;max-width:600px;margin:40px auto}
.sheet{width:210mm;min-height:297mm;margin:0 auto 20px;background:#fff;color:#1b1b1b;padding:12mm 12mm 14mm;box-shadow:0 2px 10px rgba(0,0,0,.18);font-family:var(--body);font-size:10.5pt;line-height:1.35;display:flex;flex-direction:column;gap:5mm}
.sheet.half{min-height:auto}
.sh-head{display:flex;align-items:center;gap:6mm;border-bottom:2px solid #1F5A3D;padding-bottom:4mm}
.sh-head img{height:16mm;width:auto}
.sh-head .brand2{font-family:var(--display);font-weight:800;font-size:18pt;color:#1F5A3D}
.sh-title{margin-left:auto;text-align:right}
.sh-title b{display:block;font-family:var(--display);font-size:15pt;color:#1b1b1b}
.sh-title span{font-size:10pt;color:#555}
.sh-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;font-size:9.5pt}
.sh-meta div{border:1px solid #cfd6d0;border-radius:2mm;padding:2mm 3mm}
.sh-meta small{display:block;color:#666;font-size:8pt;text-transform:uppercase;letter-spacing:.04em}
.sh-meta b{font-size:11pt}
table.sh{width:100%;border-collapse:collapse;font-size:9.5pt}
table.sh th{background:#1F5A3D;color:#fff;text-align:left;padding:2mm;font-weight:600;font-size:8.5pt;text-transform:uppercase;letter-spacing:.03em}
table.sh td{border-bottom:1px solid #cfd6d0;padding:2.4mm 2mm;vertical-align:top}
table.sh tr{page-break-inside:avoid;break-inside:avoid}
table.sh td.n{width:7mm;font-weight:700;color:#1F5A3D}
table.sh td.q{width:14mm;text-align:center;font-weight:700;font-size:11pt}
table.sh td.h{width:13mm;white-space:nowrap}
table.sh td.ins{width:44mm}
table.sh td.ins .pre{color:#333}
table.sh td.ins .lines{border-bottom:1px dotted #999;height:6mm}
table.sh td.f{width:24mm}
table.sh tfoot td{font-weight:700;border-bottom:0;padding-top:3mm}
.sh-foot{margin-top:auto;display:flex;justify-content:space-between;font-size:8.5pt;color:#666;border-top:1px solid #cfd6d0;padding-top:2mm}
.remito{border:1.5px solid #1F5A3D;border-radius:3mm;padding:6mm;display:flex;flex-direction:column;gap:4mm;height:128mm;page-break-inside:avoid;break-inside:avoid}
.remito .rm-grid{display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm}
.remito .rm-grid div small{display:block;color:#666;font-size:8pt;text-transform:uppercase;letter-spacing:.04em}
.remito .rm-grid div b{font-size:11.5pt}
.remito .rm-q{font-family:var(--display);font-size:24pt;font-weight:800;color:#1F5A3D}
.remito .rm-ins{border:1px solid #cfd6d0;border-radius:2mm;padding:3mm;min-height:22mm;flex:1}
.remito .rm-ins small{display:block;color:#666;font-size:8pt;text-transform:uppercase;letter-spacing:.04em;margin-bottom:1mm}
.remito .rm-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm;font-size:8.5pt;color:#555}
.remito .rm-sign div{border-top:1px solid #777;padding-top:1.5mm;margin-top:10mm}
.cut{border-top:1px dashed #aaa;margin:4mm 0}
.pcheck{display:flex;flex-wrap:wrap;gap:6px}
#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto!important;background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot .sheet{box-shadow:none;margin:0;page-break-after:always;break-after:page}
  #printRoot .sheet:last-child{page-break-after:auto;break-after:auto}
}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{margin:0}
.crow .q span.tchip{min-width:auto;padding:2px 6px;font-family:var(--body);font-weight:700;margin-right:4px}
.crow .q span.t-moto{background:#DCE7F7;color:#2F4F86}
.crow .q span.t-indistinto{background:var(--warn-bg);color:var(--warn-ink)}
.tripfilter{position:absolute;left:56px;top:12px;z-index:550;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:13px;max-width:min(280px,calc(100% - 180px));max-height:calc(100% - 90px);overflow:auto}
.tripfilter b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.tripfilter .tf{display:flex;align-items:center;gap:6px;padding:3px 0}
.tripfilter .tf label{display:flex;align-items:center;gap:6px;cursor:pointer;flex:1;min-width:0}
.tripfilter .tf .swatch{width:12px;height:12px}
.tripfilter .tf small{color:var(--muted)}
.tripfilter .solo{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:12px;cursor:pointer;padding:2px 4px}
.tripfilter .all{border-bottom:1px solid var(--line);margin-bottom:3px;padding-bottom:5px}
.trip.dim{opacity:.5}
.tools summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}
.tools summary::-webkit-details-marker{display:none}
.tools summary::before{content:"▸";color:var(--muted)}
.tools[open] summary::before{content:"▾"}
.tools[open]{gap:12px}
.pending{border:1.5px solid var(--gold);border-radius:12px;padding:10px;background:var(--warn-bg);display:flex;flex-direction:column;gap:8px}
.pending h3{color:var(--warn-ink)}
.ped .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.pedt{width:100%;border-collapse:collapse;font-size:13px}
table.pedt th{background:var(--panel2);text-align:left;padding:6px 8px;font-size:12px;color:var(--muted)}
table.pedt td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:middle}
table.pedt td.num{text-align:center}
table.pedt tr.unm td{background:var(--warn-bg)}
table.pedt select{max-width:190px;width:100%;margin-top:4px;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--panel)}
table.pedt tfoot td{font-weight:700}
.syncline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:13px}
.day .dd{font-family:var(--mono);font-size:10px;font-weight:500}
.legend{position:absolute;left:12px;bottom:34px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:4px;vertical-align:middle}
.pickbanner{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:600;background:var(--gold);color:#1a1200;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow)}
@media (max-width:900px){
  .app{height:auto;min-height:100%}
  main.split{grid-template-columns:1fr}
  .mapwrap{height:52vh;order:-1}
  .panel{height:auto;border-right:0}
}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 8px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{width:28px;height:28px;padding:0;justify-content:center;border-radius:6px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-size:20px;font-weight:800;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
.note{padding:10px 12px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.note.warn{background:var(--warn-bg);color:var(--warn-ink)}
.note.bad{background:var(--bad-bg);color:var(--bad-ink)}
.note.info{background:var(--accent-soft);color:var(--ink)}
.trip{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.trip-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);flex-wrap:wrap}
.swatch{width:14px;height:14px;border-radius:4px;flex:none}
.trip-h .t{font-weight:700}
.trip-h .m{color:var(--muted);font-size:12px}
.load{height:6px;border-radius:999px;background:var(--line);overflow:hidden;flex-basis:100%}
.load i{display:block;height:100%}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:8px 10px 8px 12px;border-top:1px solid var(--line);cursor:grab;background:var(--panel)}
.stop.dragover{box-shadow:inset 0 3px 0 var(--gold)}
.stop.dragging{opacity:.4}
.stop .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.stop .nm{font-weight:600;overflow-wrap:anywhere}
.stop .ad{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.stop .meta{display:flex;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stop .acts{display:flex;gap:2px;align-items:center}
.stop select{font-size:12px;padding:3px 4px;border-radius:6px;border:1px solid var(--line);background:var(--panel);max-width:110px}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;background:var(--panel2);color:var(--muted)}
.chip.late{background:var(--bad-bg);color:var(--bad-ink)}
.chip.aprox{background:var(--warn-bg);color:var(--warn-ink)}
.chip.ok{background:var(--accent-soft);color:var(--ok-ink)}
.depot-row{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dropend{padding:6px 12px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.dropend.dragover{background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:90px;font-family:var(--mono);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qty5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qty5 .field input{text-align:center;padding:6px 4px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px}
.hint{font-size:12px;color:var(--muted)}
.clist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.crow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;background:var(--panel)}
.crow:first-child{border-top:0}
.crow:hover{background:var(--panel2)}
.crow.sel{background:var(--accent-soft)}
.crow .q{display:flex;gap:3px}
.crow .q span{font-family:var(--mono);font-size:11px;min-width:24px;text-align:center;padding:2px 0;border-radius:4px;background:var(--panel2);color:var(--muted)}
.crow .q span.on{background:var(--accent);color:var(--accent-ink)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.addrwrap{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:1500;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;cursor:pointer;border-top:1px solid var(--line)}
.sugg button:first-child{border-top:0}
.sugg button:hover,.sugg button.act{background:var(--accent-soft)}
.sugg b{font-weight:600}.sugg small{display:block;color:var(--muted);font-size:12px}
.locstate{font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.locstate.ok{color:var(--ok-ink)}.locstate.no{color:var(--warn-ink)}
.search{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);width:100%}
.lbl-barrio{font-size:11px;color:var(--roadlabel);font-weight:600;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
.lbl-road{font-size:10px;color:var(--roadlabel);white-space:nowrap;font-style:italic}
.mk{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;font-size:11px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.mk.depot{border-radius:6px;background:#17231C;font-size:13px}
.leaflet-tooltip{font-family:var(--body);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:2000;font-weight:600;box-shadow:var(--shadow)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><a href="index.html" class="btn small ghost" title="Volver al panel">← Panel</a><h1>Recorridos</h1><span id="syncState">Easy Lunch · logística</span></div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" data-tab="rutas" id="tab-rutas">Recorridos</button>
      <button class="tab" role="tab" data-tab="clientes" id="tab-clientes">Clientes</button>
      <button class="tab" role="tab" data-tab="hojas" id="tab-hojas">Hojas de ruta</button>
      <button class="tab" role="tab" data-tab="config" id="tab-config">Base y camionetas</button>
    </nav>
    <div class="days" id="days" role="tablist" aria-label="Día de la semana"></div>
  </header>
  <main class="split">
    <section class="panel" id="panel"></section>
    <section class="mapwrap">
      <div id="map" aria-label="Mapa de recorridos"></div>
      <div class="mapctl">
        <button class="btn small" id="fitBtn" type="button">Encuadrar</button>
        <button class="btn small" id="fitClientsBtn" type="button">Solo clientes</button>
      </div>

const uid=()=>"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- geometry ---------- */
function hav(a,b){const R=6371,r=Math.PI/180;const dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
const km=(a,b)=>hav(a,b)*ROAD_FACTOR;
const depot=()=>({lat:+S.config.depotLat,lng:+S.config.depotLng});
const hasLoc=c=>c&&isFinite(c.lat)&&isFinite(c.lng)&&c.lat!==null&&c.lng!==null&&c.lat!==""&&c.lng!=="";
const qty=(c,day)=>Math.max(0,+((c.qty||{})[day])||0);
function parseLoc(txt){
  if(!txt)return null;txt=String(txt).trim();
  let m=txt.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||txt.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||txt.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||txt.match(/(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/);
  if(!m)return null;const lat=+m[1],lng=+m[2];
  if(lat<-56||lat>-21||lng<-74||lng>-53)return null;return {lat,lng};
}

/* ---------- route math (calles reales vía OSRM) ---------- */
const OSRM="https://router.project-osrm.org";
let MAT=null;                 // {idx:{key:i}, coords:{key:"lat,lng"}, dur:[[s]], dist:[[m]]}
const LEGS={};                // firma del recorrido -> [{s,m}] tramos reales
const DK="__depot";
function P(key){return key===DK?depot():S.clients[key];}
function cstr(o){return (+o.lat).toFixed(5)+","+(+o.lng).toFixed(5);}
function fallbackLeg(a,b){const m=hav(a,b)*ROAD_FACTOR*1000;return {s:m/1000/Math.max(5,+S.config.speed||30)*3600,m};}
function leg(ka,kb){const a=P(ka),b=P(kb);
  if(MAT){const i=MAT.idx[ka],j=MAT.idx[kb];
    if(i!==undefined&&j!==undefined&&MAT.coords[ka]===cstr(a)&&MAT.coords[kb]===cstr(b)&&MAT.dur[i][j]!=null)return {s:MAT.dur[i][j],m:MAT.dist[i][j]};}
  return fallbackLeg(a,b);}
async function ensureMatrix(ids){
  const keys=[DK,...ids];
  if(MAT&&keys.every(k=>MAT.idx[k]!==undefined&&MAT.coords[k]===cstr(P(k))))return true;
  if(keys.length>100){setSync("Muchos clientes: distancias aproximadas");return false;}
  try{setSync("Calculando calles…");
    const r=await fetch(OSRM+"/table/v1/driving/"+keys.map(k=>{const o=P(k);return (+o.lng).toFixed(6)+","+(+o.lat).toFixed(6);}).join(";")+"?annotations=duration,distance");
    const j=await r.json();if(j.code!=="Ok")throw new Error(j.code);
    const idx={},coords={};keys.forEach((k,i)=>{idx[k]=i;coords[k]=cstr(P(k));});
    MAT={idx,coords,dur:j.durations,dist:j.distances};setSync("Sincronizado");return true;
  }catch(e){console.error(e);toast("No pude calcular por calles; uso distancias aproximadas");return false;}
}
function stopsSig(stops){return cstr(depot())+"|"+stops.map(id=>id+"@"+cstr(S.clients[id])).join(";")+"|"+(S.config.returnToBase?1:0);}
function seqCost(seq){if(!seq.length)return 0;let d=leg(DK,seq[0]).s;for(let i=1;i<seq.length;i++)d+=leg(seq[i-1],seq[i]).s;if(S.config.returnToBase)d+=leg(seq[seq.length-1],DK).s;return d;}
function twoOpt(seq){
  if(seq.length<2)return seq.slice();let best=seq.slice(),bc=seqCost(best),imp=true,guard=0;
  while(imp&&guard++<200){imp=false;
    for(let i=0;i<best.length-1;i++)for(let k=i+1;k<best.length;k++){
      const cand=best.slice(0,i).concat(best.slice(i,k+1).reverse(),best.slice(k+1));const cc=seqCost(cand);
      if(cc<bc-1e-9){best=cand;bc=cc;imp=true;}}
    for(let i=0;i<best.length;i++)for(let j=0;j<best.length;j++){if(i===j)continue;
      const cand=best.slice();const [x]=cand.splice(i,1);cand.splice(j,0,x);const cc=seqCost(cand);
      if(cc<bc-1e-9){best=cand;bc=cc;imp=true;}}
  }return best;}
function bestInsert(seq,id){let bi=seq.length,bc=Infinity;for(let i=0;i<=seq.length;i++){const c=seq.slice();c.splice(i,0,id);const v=seqCost(c);if(v<bc){bc=v;bi=i;}}const r=seq.slice();r.splice(bi,0,id);return r;}
function tripStats(stops,day,startMin){
  const C=S.clients,cfg=S.config,tf=1+(Math.max(0,+cfg.traffic||0)/100);
  const sg=stopsSig(stops),g=GOOG[sg];let tfx=tf;let real=LEGS[sg];if(g&&g.legs.length>=stops.length+(cfg.returnToBase?1:0)){real=g.legs;tfx=1;}
  const t0=(startMin!=null?startMin:hm2min(cfg.startTime));let t=t0,dist=0,load=0,prev=DK;const etas=[];let exact=!!real;
  stops.forEach((id,i)=>{const l=real?real[i]:leg(prev,id);dist+=l.m;t+=l.s/60*tfx;etas.push(t);t+=+cfg.serviceMin||0;load+=qty(C[id],day);prev=id;});
  if(cfg.returnToBase&&stops.length){const l=real?real[stops.length]:leg(prev,DK);if(l){dist+=l.m;t+=l.s/60*tfx;}}
  return {km:dist/1000,load,etas,start:t0,end:t,dur:t-t0,exact,google:tfx===1&&!!g,gAt:g?g.at:null,traffic:g?g.traffic:null};
}
function planStats(r,day){
  const out=[],vEnd={};if(!r)return out;
  const order=r.trips.map((t,i)=>i).sort((a,b)=>(r.trips[a].van-r.trips[b].van)||((r.trips[a].trip||1)-(r.trips[b].trip||1))||(a-b));
  for(const i of order){const t=r.trips[i];const start=vEnd[t.van]!=null?vEnd[t.van]:hm2min(S.config.startTime);const st=tripStats(t.stops,day,start);out[i]=st;if(t.stops.length)vEnd[t.van]=st.end;}
  return out;}
function vehTotals(r,day){const ps=planStats(r,day),tot={};r.trips.forEach((t,i)=>{if(!t.stops.length)return;const x=tot[t.van]||(tot[t.van]={min:0,km:0,load:0,trips:0});x.min+=ps[i].dur;x.km+=ps[i].km;x.load+=ps[i].load;x.trips++;});return tot;}
function normalizeTrips(r){const cnt={};r.trips.forEach(t=>{cnt[t.van]=(cnt[t.van]||0)+1;t.trip=cnt[t.van];});return r;}
/* geometría por calles de cada viaje */
const GEO={};let geoBusy=false;
async function fetchTripRoute(stops){
  const sig=stopsSig(stops);if(GEO[sig]&&LEGS[sig])return;
  const keys=[DK,...stops];if(S.config.returnToBase)keys.push(DK);
  const r=await fetch(OSRM+"/route/v1/driving/"+keys.map(k=>{const o=P(k);return (+o.lng).toFixed(6)+","+(+o.lat).toFixed(6);}).join(";")+"?overview=full&geometries=geojson&continue_straight=false");
  const j=await r.json();if(j.code!=="Ok")throw new Error(j.code);
  const rt=j.routes[0];GEO[sig]=rt.geometry.coordinates.map(([x,y])=>[+y.toFixed(5),+x.toFixed(5)]);
  LEGS[sig]=rt.legs.map(l=>({s:l.duration,m:l.distance}));
}
async function ensureGeometry(day){
  if(geoBusy)return;const r=currentRoute(day);if(!r)return;
  const ids=Object.keys(S.clients).filter(id=>qty(S.clients[id],day)>0&&hasLoc(S.clients[id]));
  const needM=!(MAT&&[DK,...ids].every(k=>MAT.idx[k]!==undefined&&MAT.coords[k]===cstr(P(k))));
  if(needM){geoBusy=true;await ensureMatrix(ids);geoBusy=false;}
  const todo=r.trips.filter(t=>t.stops.length&&!(GEO[stopsSig(t.stops)]&&LEGS[stopsSig(t.stops)]));if(!todo.length)return;
  geoBusy=true;setSync("Trazando por calles…");
  try{for(const t of todo)await fetchTripRoute(t.stops);setSync("Sincronizado");}catch(e){console.error(e);setSync("Sin datos de calles");}
  geoBusy=false;if(S.day===day&&S.tab==="rutas")render();
}
function tripGeo(t){const sg=stopsSig(t.stops);return (GOOG[sg]&&GOOG[sg].geo)||GEO[sg]||null;}
/* ---------- Google Routes con tránsito (vía /api/ruta-google) ---------- */
const GOOG={};let googleMissing=false;
function decodePoly(str){if(!str)return null;let i=0,lat=0,lng=0;const out=[];
  while(i<str.length){let b,sh=0,res=0;do{b=str.charCodeAt(i++)-63;res|=(b&31)<<sh;sh+=5;}while(b>=32);lat+=(res&1)?~(res>>1):(res>>1);
    sh=0;res=0;do{b=str.charCodeAt(i++)-63;res|=(b&31)<<sh;sh+=5;}while(b>=32);lng+=(res&1)?~(res>>1):(res>>1);out.push([lat/1e5,lng/1e5]);}
  return out;}
function nextDeparture(day){const wd={lun:1,mar:2,mie:3,jue:4,vie:5}[day]||1;const [h,m]=String(S.config.startTime||"08:30").split(":").map(Number);
  const d=new Date();d.setHours(h||0,m||0,0,0);let add=(wd-d.getDay()+7)%7;d.setDate(d.getDate()+add);if(d.getTime()<Date.now()+60000)d.setDate(d.getDate()+7);return d;}
function loadGoogleFromRoute(r){(r&&r.trips||[]).forEach(t=>{if(t.g&&t.g.sig&&t.g.legs)GOOG[t.g.sig]={legs:t.g.legs,geo:decodePoly(t.g.poly),at:t.g.at,traffic:t.g.traffic||null};});}
async function googleTrip(t,day,startMin){
  const C=S.clients;const dep=nextDeparture(day);if(startMin!=null)dep.setMinutes(dep.getMinutes()+Math.round(startMin-hm2min(S.config.startTime)));
  const r=await fetch("/api/ruta-google",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    origin:depot(),stops:t.stops.map(id=>({lat:C[id].lat,lng:C[id].lng})),returnToBase:!!S.config.returnToBase,departureTime:dep.toISOString(),moto:veh(t.van).type==="moto"})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.message||j.error||"google");e.code=j.error;throw e;}
  const stops=j.order.map(i=>t.stops[i]);t.stops=stops;const sig=stopsSig(stops);const at=new Date().toISOString();
  const traffic=Array.isArray(j.traffic)?j.traffic:null;
  GOOG[sig]={legs:j.legs,geo:decodePoly(j.polyline),at,traffic};t.g={sig,legs:j.legs,poly:j.polyline,at,traffic};
}
async function googleDay(day,only){
  if(S.config.useGoogle===false)return false;
  const r=currentRoute(day);if(!r)return false;let ok=0;
  setSync("Consultando tránsito en Google…");
  for(let i=0;i<r.trips.length;i++){if(only!==undefined&&i!==only)continue;const t=r.trips[i];if(!t.stops.length)continue;
    if(t.stops.length>25){toast(vanName(t.van)+": más de 25 paradas, Google no puede ordenarlo");continue;}
    try{const ps=planStats(r,day);await googleTrip(t,day,ps[i]?ps[i].start:null);ok++;}catch(e){console.error(e);
      if(e.code==="sin_clave"){googleMissing=true;setSync("Sincronizado");render();return false;}
      toast("Google no respondió: "+e.message);}}
  S.routes[day]=r;saveRoute(day);setSync("Sincronizado");render();return ok>0;
}
function hm2min(s){const m=String(s||"").match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:630;}
function min2hm(m){m=Math.round(m);const h=Math.floor(m/60)%24,mm=m%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");}
function durTxt(m){m=Math.round(m);const h=Math.floor(m/60);return h?h+" h "+String(m%60).padStart(2,"0")+" min":m+" min";}

async function optimize(day){
  const C=S.clients,V=dayVehicles(day);const strat=S.config.strategy==="balance"?"balance":"min";
  const ids=Object.keys(C).filter(id=>qty(C[id],day)>0&&hasLoc(C[id]));
  const load=id=>qty(C[id],day);await ensureMatrix(ids);
  const sd=(a,b)=>(leg(a,b).s+leg(b,a).s)/2;const rl=r=>r.reduce((s,id)=>s+load(id),0);
  const svc=(+S.config.serviceMin||0)*60;const rtime=seq=>seq.length?seqCost(seq)+svc*seq.length:0;
  // qué tipo de vehículo pide cada cliente (si ese día no sale ninguno de ese tipo, se ignora la preferencia)
  const types=new Set(V.map(v=>v.type));const reqWarn=new Set();
  const req=id=>{const t=ctrans(C[id]);if(t==="indistinto")return null;if(!types.has(t)){reqWarn.add(t);return null;}return t;};
  const rreq=r=>{let q=null;for(const id of r){const x=req(id);if(x){if(q&&q!==x)return "X";q=x;}}return q;};
  const capFor=q=>Math.max(...V.filter(v=>!q||v.type===q).map(v=>v.cap));
  const capMax=Math.max(...V.map(v=>v.cap));
  // 1) agrupar (ahorros de Clarke-Wright) respetando el tipo de vehículo y su capacidad
  let routes=ids.map(id=>[id]);const rOf={};routes.forEach(r=>rOf[r[0]]=r);
  const sav=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=ids[i],b=ids[j];sav.push([sd(DK,a)+sd(DK,b)-sd(a,b),a,b]);}
  sav.sort((x,y)=>y[0]-x[0]);
  for(const [sv,a,b] of sav){const ra=rOf[a],rb=rOf[b];if(ra===rb)continue;const q=rreq(ra.concat(rb));if(q==="X")continue;if(rl(ra)+rl(rb)>capFor(q))continue;
    let m=null;const aS=ra[0]===a,aE=ra[ra.length-1]===a,bS=rb[0]===b,bE=rb[rb.length-1]===b;
    if(aE&&bS)m=ra.concat(rb);else if(bE&&aS)m=rb.concat(ra);else if(aS&&bS)m=ra.slice().reverse().concat(rb);else if(aE&&bE)m=ra.concat(rb.slice().reverse());
    if(!m)continue;routes=routes.filter(r=>r!==ra&&r!==rb);routes.push(m);m.forEach(id=>rOf[id]=m);}
  routes=routes.map(r=>twoOpt(r)).sort((a,b)=>rl(b)-rl(a));
  // 2) asignar a vehículos: el grupo grande al vehículo grande, lo que sobra al más chico que alcance
  const trips=[];const used=new Set();const vtime={};
  for(const r of routes){const L=rl(r);const q=rreq(r);const VV=V.filter(v=>!q||v.type===q);
    let cand=VV.filter(v=>!used.has(v.idx)&&v.cap>=L).sort((a,b)=>a.cap-b.cap);
    let v=cand[0];
    if(!v){const fits=VV.filter(v=>v.cap>=L).sort((a,b)=>(vtime[a.idx]||0)-(vtime[b.idx]||0));v=fits[0];}
    if(!v){v=(VV.length?VV:V).slice().sort((a,b)=>b.cap-a.cap)[0];}
    used.add(v.idx);vtime[v.idx]=(vtime[v.idx]||0)+rtime(r);trips.push({van:v.idx,stops:r});}
  // 3) modo "tiempos parejos": todos los vehículos del día salen y se reparten paradas hasta igualar tiempos
  if(strat==="balance"){
    V.forEach(v=>{if(!trips.some(t=>t.van===v.idx))trips.push({van:v.idx,stops:[]});});
    const capOf=t=>veh(t.van).cap;
    const obj=()=>{const tot={};trips.forEach(t=>{tot[t.van]=(tot[t.van]||0)+rtime(t.stops);});const vals=V.map(v=>tot[v.idx]||0);return [Math.max(...vals),vals.reduce((a,b)=>a+b,0)];};
    let cur=obj(),guard=0;
    while(guard++<400){let best=null;
      const tot={};trips.forEach(t=>{tot[t.van]=(tot[t.van]||0)+rtime(t.stops);});
      const vmax=V.reduce((a,b)=>(tot[b.idx]||0)>(tot[a.idx]||0)?b:a).idx;
      trips.forEach((src,si)=>{if(src.van!==vmax)return;src.stops.forEach((id,k)=>{
        trips.forEach((dst,di)=>{if(di===si)return;if(rl(dst.stops)+load(id)>capOf(dst))return;const q=req(id);if(q&&veh(dst.van).type!==q)return;
          const oldS=src.stops,oldD=dst.stops;const ns=oldS.filter((_,x)=>x!==k),nd=bestInsert(oldD,id);
          src.stops=ns;dst.stops=nd;const o=obj();src.stops=oldS;dst.stops=oldD;
          if(o[0]<cur[0]-1||(Math.abs(o[0]-cur[0])<=1&&o[1]<cur[1]-1)){if(!best||o[0]<best.o[0]-1||(Math.abs(o[0]-best.o[0])<=1&&o[1]<best.o[1]))best={o,si,di,ns,nd};}
        });});});
      if(!best)break;trips[best.si].stops=best.ns;trips[best.di].stops=twoOpt(best.nd);trips[best.si].stops=twoOpt(trips[best.si].stops);cur=obj();}
  }
  const out=trips.filter(t=>t.stops.length).map(t=>({van:t.van,stops:twoOpt(t.stops)}));
  out.sort((a,b)=>a.van-b.van);
  if(reqWarn.size)toast("Hay clientes que piden "+[...reqWarn].map(t=>TRANS[t].toLowerCase()).join(" y ")+" pero ese día no sale ninguna: se asignaron a otro vehículo");
  return normalizeTrips({trips:out,generatedAt:new Date().toISOString(),edited:false,strategy:strat});
}

/* ---------- data layer ---------- */
function currentRoute(day){

  const trips=(r.trips||[]).map(t=>({van:t.van|0,trip:t.trip|0||1,g:t.g||null,stops:(t.stops||[]).filter(id=>C[id]&&hasLoc(C[id])&&qty(C[id],day)>0)}));
  return {...r,trips};
}

  if(ch){H[day]=hd;S.config.habit=H;saveConfig();}}
function saveRoute(day){
  try{updateHabit(day);}catch(_){}
  S.dirty[day]=true;clearTimeout(saveRoute["_"+day]);
  saveRoute["_"+day]=setTimeout(async()=>{
    const r=S.routes[day];
    if(S.db&&r){try{await sbUpsert("rutas_recorridos",{dia:day,data:r,updated_at:now()});setSync("Guardado");}catch(e){onWriteErr(e);}}
    S.dirty[day]=false;},500);
}

/* ---------- geocoding (Photon + Nominatim) ---------- */
function photonLabel(p){
  const street=p.street?(p.street+(p.housenumber?" "+p.housenumber:"")):(p.name||"");
  const city=(p.city||"").replace(/Ciudad Autónoma de Buenos Aires/i,"CABA");const place=[p.district||p.locality,city&&city!==p.district?city:null].filter(Boolean).join(", ");
  const title=(p.street&&p.name&&p.name!==p.street&&p.type!=="house")?p.name:street;
  const sub=(title===street?"":street+" · ")+place;
  return {title:title||place,sub:sub||p.state||""};
}
async function suggest(q){
  const qq=/buenos aires|caba|capital|provincia|argentina/i.test(q)?q:q+", Buenos Aires";
  const u="https://photon.komoot.io/api/?limit=5&lat=-34.555&lon=-58.46&bbox=-59.2,-35.0,-57.9,-34.2&q="+encodeURIComponent(qq);
  const r=await fetch(u);if(!r.ok)throw new Error("geo");const j=await r.json();
  return (j.features||[]).map(f=>{const p=f.properties||{};const l=photonLabel(p);
    return {lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],title:l.title,sub:l.sub,exact:!!p.housenumber};})
    .filter(x=>x.lat<-34.0&&x.lat>-35.3&&x.lng<-57.8&&x.lng>-59.4)
    .map((x,i)=>({...x,_d:hav(x,{lat:-34.555,lng:-58.46})+i*0.5}))
    .sort((a,b)=>(b.exact-a.exact)||(a._d-b._d));
}
let lastGeo=0;
async function nominatim(address){
  const wait=Math.max(0,lastGeo+1100-Date.now());if(wait)await new Promise(r=>setTimeout(r,wait));lastGeo=Date.now();
  const q=/buenos aires|caba|capital|provincia|argentina/i.test(address)?address:address+", Buenos Aires";
  const u="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ar&accept-language=es&viewbox=-59.2,-34.2,-57.9,-35.0&bounded=1&q="+encodeURIComponent(q);
  const r=await fetch(u,{headers:{Accept:"application/json"}});if(!r.ok)throw new Error("geo");
  const j=await r.json();if(!j.length)throw new Error("No encontrada");return {lat:+j[0].lat,lng:+j[0].lon};
}
async function aiLocate(address){
  try{const s=await suggest(address);if(s.length)return {lat:s[0].lat,lng:s[0].lng,conf:s[0].exact?"alta":"media"};}catch(_){}
  const n=await nominatim(address);return {...n,conf:"media"};
}

function mkIcon(label,color,size=24,extra=""){return L.divIcon({className:"",html:`<div class="mk ${extra}" style="width:${size}px;height:${size}px;background:${color}">${esc(label)}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});}
function vehicles(){const c=S.config,V=[];const nv=Math.max(0,Math.min(8,parseInt(c.vans,10)||0)),nm=Math.max(0,Math.min(12,parseInt(c.motos,10)||0));
  for(let i=0;i<nv;i++)V.push({idx:i,type:"camioneta",name:"Camioneta "+(i+1),cap:Math.max(1,+c.capacity||1)});
  for(let i=0;i<nm;i++)V.push({idx:nv+i,type:"moto",name:"Moto "+(i+1),cap:Math.max(1,+c.motoCapacity||15)});
  if(!V.length)V.push({idx:0,type:"camioneta",name:"Camioneta 1",cap:Math.max(1,+c.capacity||1)});return V;}
function veh(i){return vehicles()[i]||{idx:i,type:"camioneta",name:"Vehículo "+(i+1),cap:Math.max(1,+S.config.capacity||1)};}
function dayVehicles(day){const all=vehicles();const sel=(S.config.dayVeh||{})[day];const f=Array.isArray(sel)?all.filter(v=>sel.includes(v.idx)):all;return f.length?f:all;}
function vanName(i){return veh(i).name;}
const TRANS={camioneta:"Camioneta",moto:"Moto",indistinto:"Indistinto"};
const HIDE=new Set();const tkey=(day,t)=>day+":"+t.van+":"+(t.trip||1);const tripVisible=(day,t)=>!HIDE.has(tkey(day,t));
function ctrans(c){return (c&&TRANS[c.transport])?c.transport:"camioneta";}
function transOk(c,v){const t=ctrans(c);return t==="indistinto"||t===v.type;}
function tripColor(t){return COLORS[t.van%COLORS.length];}
function renderMap(){

    const ps=planStats(r,day);let anyTraffic=false;renderTripFilter(r,day);const filtered=r&&r.trips.some(t=>!tripVisible(day,t));
    if(r)r.trips.forEach((t,ti)=>{t.stops.forEach(id=>inTrip.add(id));if(!tripVisible(day,t))return;const col=tripColor(t);const st=ps[ti];
      const pts=[[S.config.depotLat,S.config.depotLng]].concat(t.stops.map(id=>[C[id].lat,C[id].lng]));if(S.config.returnToBase&&t.stops.length)pts.push([S.config.depotLat,S.config.depotLng]);

      else L.polyline(pts,{color:col,weight:2,opacity:.5,dashArray:"2 6"}).addTo(dyn);
      t.stops.forEach((id,i)=>{inTrip.add(id);const c=C[id];L.marker([c.lat,c.lng],{icon:mkIcon(i+1,col),zIndexOffset:500}).bindTooltip(`<b>${esc(c.name)}</b><br>${esc(c.address||"")}<br>${qty(c,day)} viandas · llega ~${min2hm(st.etas[i])}<br>${vanName(t.van)}${t.trip>1?" · viaje "+t.trip:""}`).addTo(dyn);});});

  }else{

    Object.values(C).forEach(c=>{if(!hasLoc(c))return;const sel=c.id===S.sel;
      L.marker([c.lat,c.lng],{icon:mkIcon("",sel?css("--gold")||"#C98A0B":"#1F7A4D",sel?20:14),zIndexOffset:sel?900:0}).bindTooltip(`<b>${esc(c.name)}</b><br>${esc(c.address||"")}`).on("click",()=>{S.sel=c.id;S.tab="clientes";render();}).addTo(dyn);});
  }

function renderTripFilter(r,day){const box=$("#tripFilter");
  const trips=r?r.trips.filter(t=>t.stops.length):[];if(trips.length<2){box.hidden=true;return;}

  box.innerHTML=`<b>Ver recorridos</b><div class="tf all"><label><input type="checkbox" id="tfAll" ${allOn?"checked":""}>Todos</label></div>`+
    trips.map(t=>{const k=tkey(day,t);return `<div class="tf"><label><input type="checkbox" data-tk="${k}" ${tripVisible(day,t)?"checked":""}><span class="swatch" style="background:${tripColor(t)}"></span>${esc(vanName(t.van))}${t.trip>1?` <small>v${t.trip}</small>`:""} <small class="num">${t.stops.length}</small></label><button class="solo" data-solo="${k}" title="Ver solo este">solo</button></div>`;}).join("");

function gmapsLinks(t){
  const C=S.clients,D=`${S.config.depotLat},${S.config.depotLng}`;const pts=t.stops.map(id=>`${C[id].lat},${C[id].lng}`);
  const all=[D].concat(pts);if(S.config.returnToBase)all.push(D);
  const links=[];const CH=11;
  for(let i=0;i<all.length-1;i+=CH-1){const seg=all.slice(i,i+CH);if(seg.length<2)break;
    const u=new URL("https://www.google.com/maps/dir/");u.searchParams.set("api","1");u.searchParams.set("origin",seg[0]);u.searchParams.set("destination",seg[seg.length-1]);
    if(seg.length>2)u.searchParams.set("waypoints",seg.slice(1,-1).join("|"));u.searchParams.set("travelmode","driving");links.push(u.toString());}
  return links;
}
function tripText(t,day,st){
  const C=S.clients;st=st||tripStats(t.stops,day);const dn=DAYS.find(d=>d[0]===day)[2];
  let s=`*Recorrido ${dn} — ${vanName(t.van)}${t.trip>1?" (viaje "+t.trip+")":""}*\nSalida ${min2hm(st.start)} desde ${S.config.depotName}\n`;
  t.stops.forEach((id,i)=>{const c=C[id];s+=`${i+1}. ${c.name} — ${c.address||""} — ${qty(c,day)} viandas — ~${min2hm(st.etas[i])}${c.notes?" ("+c.notes+")":""}\n`;});
  s+=`Total: ${st.load} viandas · ${st.km.toFixed(1)} km\n`;gmapsLinks(t).forEach((l,i,a)=>s+=`Mapa${a.length>1?" tramo "+(i+1):""}: ${l}\n`);return s;
}

function applyStructure(srcTrips,day,label){

}
async function savePlan(day,name){const r=currentRoute(day);if(!r)return;const id="g_"+Date.now().toString(36);

async function deletePlan(id){const n={...(S.saved||{})};delete n[id];S.saved=n;render();try{await sbDel("rutas_recorridos","dia=eq."+encodeURIComponent(id));toast("Guardado eliminado");}catch(e){onWriteErr(e);}}
function snapshotDay(day){const r=S.routes[day];return r?JSON.parse(JSON.stringify(r)):null;}
function restoreDay(day,snap){if(snap){S.routes[day]=snap;saveRoute(day);}else{delete S.routes[day];sbDel("rutas_recorridos","dia=eq."+day).catch(()=>{});}render();}
function mutate(fn){const r=currentRoute(S.day);if(!r)return;fn(r);normalizeTrips(r);r.edited=true;S.routes[S.day]=r;saveRoute(S.day);render();clearTimeout(mutate._t);const d=S.day;mutate._t=setTimeout(()=>ensureGeometry(d),700);}
function bindRutas(){

  const ob=$("#optBtn");if(ob)ob.onclick=async()=>{ob.disabled=true;ob.textContent="Calculando por calles…";const r=await optimize(day);S.routes[day]=r;saveRoute(day);render();fitClients();

  P.querySelectorAll("[data-dayveh]").forEach(cb=>cb.onchange=()=>{const cur=new Set(dayVehicles(day).map(v=>v.idx));const i=+cb.dataset.dayveh;if(cb.checked)cur.add(i);else cur.delete(i);

    S.config.dayVeh={...(S.config.dayVeh||{}),[day]:[...cur].sort((a,b)=>a-b)};saveConfig();render();});

    Object.values(C).filter(c=>qty(c,day)>0&&hasLoc(c)&&!inT.has(c.id)).forEach(c=>{if(!r.trips.length)r.trips.push({van:0,trip:1,stops:[]});
      let best=null;r.trips.forEach((t,i)=>{const n=bestInsert(t.stops,c.id,C);const add=seqCost(n,C)-seqCost(t.stops,C);const over=tripStats(n,day).load>veh(t.van).cap;const score=add+(over?1e6:0)+(transOk(c,veh(t.van))?0:5e5);if(!best||score<best[0])best=[score,i,n];});

  P.onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;

      mutate(r=>r.trips[t].stops.splice(i,1));toast(nm+" quedó en “Sin recorrido”","Deshacer",()=>restoreDay(day,snap));}
    else if(d.loadplan){const g=(S.saved||{})[d.loadplan];if(!g)return;const snap=snapshotDay(day);applyStructure(g.trips,day,g.name);render();ensureGeometry(day);toast("Cargado “"+g.name+"” en el "+DAYS.find(x=>x[0]===day)[2].toLowerCase(),"Deshacer",()=>restoreDay(day,snap));}

      const src=currentRoute(day);const snaps={};targets.forEach(k=>{snaps[k]=snapshotDay(k);applyStructure(src.trips,k,"Copia del "+DAYS.find(x=>x[0]===day)[2].toLowerCase());});
      render();toast("Copiado a "+targets.map(k=>DAYS.find(x=>x[0]===k)[1]).join(", "),"Deshacer",()=>{targets.forEach(k=>restoreDay(k,snaps[k]));});}

  };
  P.onchange=e=>{const s=e.target;if(s.dataset.veh!==undefined){const ti=+s.dataset.veh,v=+s.value;mutate(r=>{r.trips[ti].van=v;r.trips[ti].g=null;normalizeTrips(r);});return;}

      mutate(r=>{const [id]=r.trips[t].stops.splice(i,1);r.trips[to].stops=bestInsert(r.trips[to].stops,id,C);});}
    else if(s.dataset.assign!==undefined&&s.value!==""){const id=s.dataset.assign,to=+s.value;mutate(r=>{r.trips[to].stops=bestInsert(r.trips[to].stops,id,C);});}};

    li.addEventListener("drop",e=>{e.preventDefault();li.classList.remove("dragover");if(!drag)return;const t=+li.dataset.t,i=+li.dataset.i,src=drag;drag=null;

  });

  document.querySelectorAll("[data-cid]").forEach(r=>r.onclick=()=>{S.sel=r.dataset.cid;S.confirmDel=false;render();const c=C[S.sel];if(hasLoc(c))map.setView([c.lat,c.lng],Math.max(map.getZoom(),15));$("#panel").scrollTop=0;});
  if($("#impX"))$("#impX").onclick=()=>{S.importOpen=false;render();};
  if($("#impGo"))$("#impGo").onclick=async()=>{const rows=$("#impTxt").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let n=0;
    for(const l of rows){const p=l.split(/\t|;/).map(x=>x.trim());if(!p[0]||/^nombre$/i.test(p[0]))continue;
      const c={id:uid(),name:p[0],address:p[1]||"",qty:{},before:"",notes:"",geo:null,lat:null,lng:null};
      DAYS.forEach(([k],i)=>{const v=parseInt(p[2+i],10);if(v>0)c.qty[k]=v;});
      const loc=parseLoc(p.slice(7).join(","));if(loc){c.lat=loc.lat;c.lng=loc.lng;c.geo="manual";}
      else if(c.address){$("#impGo").textContent=`Ubicando ${n+1}…`;try{const g=await aiLocate(c.address);c.lat=g.lat;c.lng=g.lng;c.geo="auto";}catch(_){}}
      await saveClient(c);n++;}
    S.importOpen=false;render();toast(`${n} cliente${n!==1?"s":""} importado${n!==1?"s":""}`);};
  if($("#aiAll"))$("#aiAll").onclick=async e=>{const b=e.target;b.disabled=true;const pend=Object.values(C).filter(c=>!hasLoc(c)&&c.address);let ok=0;
    for(const c of pend){b.textContent=`Ubicando ${ok+1}/${pend.length}…`;try{const r=await aiLocate(c.address);await saveClient({...c,lat:r.lat,lng:r.lng,geo:"ia"});ok++;}catch(err){}}
    toast(`${ok} de ${pend.length} ubicado${ok!==1?"s":""} — revisalos en el mapa`);render();};
  const f=$("#cform");if(!f)return;
  $("#closeForm").onclick=()=>{S.sel=null;clearPreview();render();};
  const addr=$("#f-addr"),box=$("#addrSugg"),locIn=$("#f-loc");let sugg=[],act=-1,tmr=null,seq=0,chosen=!!locIn.value;
  const gm=()=>{$("#gmSearch").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr.value);};
  const hide=()=>{box.hidden=true;act=-1;addr.setAttribute("aria-expanded","false");};
  const choose=i=>{const x=sugg[i];if(!x)return;locIn.value=x.lat.toFixed(6)+", "+x.lng.toFixed(6);locIn.dataset.geo="auto";chosen=true;
    if(!/\d/.test(addr.value)||addr.value.length<x.title.length)addr.value=x.title+(x.sub?", "+x.sub.replace(/^.*· /,""):"");
    hide();setPreview(x.lat,x.lng,true);locState(true,x.exact?"✓ Ubicado en el mapa":"✓ Ubicado (aproximado: revisá la estrella en el mapa)");gm();};
  const show=()=>{if(!sugg.length){box.innerHTML=`<div class="hint" style="padding:9px 12px">No encuentro esa dirección. Probá con calle y altura, o marcala en el mapa.</div>`;box.hidden=false;return;}
    box.innerHTML=sugg.map((x,i)=>`<button type="button" role="option" data-i="${i}" class="${i===act?"act":""}"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></button>`).join("");box.hidden=false;addr.setAttribute("aria-expanded","true");};
  box.onmousedown=e=>{const b=e.target.closest("button[data-i]");if(!b)return;e.preventDefault();choose(+b.dataset.i);};
  addr.oninput=()=>{gm();chosen=false;locIn.value="";clearPreview();locState(false,"Buscando…");clearTimeout(tmr);const q=addr.value.trim();
    if(q.length<5){hide();locState(false,"Escribí la dirección y elegila de la lista");return;}
    tmr=setTimeout(async()=>{const my=++seq;try{const r=await suggest(q);if(my!==seq)return;sugg=r;act=r.length?0:-1;show();locState(false,r.length?"Elegí la dirección correcta de la lista":"No encontrada");}catch(_){locState(false,"No pude buscar. Revisá la conexión.");}},450);};
  addr.onkeydown=e=>{if(box.hidden)return;if(e.key==="ArrowDown"){e.preventDefault();act=Math.min(sugg.length-1,act+1);show();}
    else if(e.key==="ArrowUp"){e.preventDefault();act=Math.max(0,act-1);show();}
    else if(e.key==="Enter"){if(act>=0){e.preventDefault();choose(act);}}else if(e.key==="Escape")hide();};
  addr.onblur=()=>setTimeout(()=>{if(!box.hidden&&!chosen&&sugg.length)choose(0);else hide();},150);
  if(locIn.value){const l=parseLoc(locIn.value);if(l)setPreview(l.lat,l.lng,false);}
  locIn.onchange=()=>{const l=parseLoc(locIn.value);if(l){locIn.dataset.geo="manual";setPreview(l.lat,l.lng,true);locState(true,"✓ Ubicado en el mapa");}};
  document.querySelectorAll('input[name="f-trans"]').forEach(rb=>rb.onchange=()=>{document.querySelectorAll('input[name="f-trans"]').forEach(x=>x.closest("label").classList.toggle("on",x.checked));});
  $("#copyMon").onclick=()=>{const v=$("#f-q-lun").value;DAYS.forEach(([k])=>$("#f-q-"+k).value=v);};
  $("#pickMap").onclick=()=>{S.pick=ll=>{$("#f-loc").value=ll.lat.toFixed(6)+", "+ll.lng.toFixed(6);$("#f-loc").dataset.geo="manual";setPreview(ll.lat,ll.lng,false);locState(true,"✓ Marcado en el mapa");};$("#pickBanner").hidden=false;if(matchMedia("(max-width:900px)").matches)window.scrollTo({top:0,behavior:"smooth"});};
  const del=$("#delBtn");if(del)del.onclick=()=>{if(!S.confirmDel){S.confirmDel=true;del.textContent="¿Seguro? Eliminar";return;}const id=S.sel;S.sel=null;S.confirmDel=false;deleteClient(id);toast("Cliente eliminado");};
  f.onsubmit=async e=>{e.preventDefault();const old=S.sel==="new"?null:C[S.sel];const id=old?old.id:uid();
    const locTxt=$("#f-loc").value.trim();let loc=parseLoc(locTxt);if(locTxt&&!loc){toast("No entiendo esa ubicación. Pegá coordenadas o un link de Google Maps.");return;}
    const adr=$("#f-addr").value.trim();if(!loc&&adr){try{const g=await aiLocate(adr);loc={lat:g.lat,lng:g.lng};$("#f-loc").dataset.geo="auto";}catch(_){toast("Guardado sin ubicación: no encontré la dirección");}}
    const qd={};DAYS.forEach(([k])=>{const v=parseInt($("#f-q-"+k).value,10);if(v>0)qd[k]=v;});
    let geo=old?old.geo:null;if(loc&&(!old||!hasLoc(old)||Math.abs(old.lat-loc.lat)>1e-6||Math.abs(old.lng-loc.lng)>1e-6))geo=$("#f-loc").dataset.geo||"manual";if(!loc)geo=null;
    const c={id,name:$("#f-name").value.trim()||"Sin nombre",address:$("#f-addr").value.trim(),lat:loc?loc.lat:null,lng:loc?loc.lng:null,geo,qty:qd,before:$("#f-before").value,notes:$("#f-notes").value.trim(),transport:(document.querySelector('input[name="f-trans"]:checked')||{}).value||"camioneta"};
    S.sel=id;await saveClient(c);toast("Cliente guardado");};
}

/* ---------- hojas de ruta / remitos ---------- */
const P0={days:null,veh:null,format:"hoja",week:null,eta:true,sign:true};
function mondayOf(d){const x=new Date(d);x.setHours(12,0,0,0);const wd=x.getDay();if(wd===6)x.setDate(x.getDate()+2);else if(wd===0)x.setDate(x.getDate()+1);else x.setDate(x.getDate()-(wd-1));return x;}
function isoDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayDate(day){const base=new Date((S.print.week||isoDate(mondayOf(new Date())))+"T12:00:00");const off={lun:0,mar:1,mie:2,jue:3,vie:4}[day]||0;base.setDate(base.getDate()+off);return base;}
function fmtDate(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
let LOGO=null;
async function ensureLogo(){if(LOGO!==null)return LOGO;try{const r=await fetch("https://easy-lunch-eight.vercel.app/logo.png");const b=await r.blob();LOGO=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});}catch(_){LOGO="";}return LOGO;}
function sheetHead(title,sub){return `<div class="sh-head">${LOGO?`<img src="${LOGO}" alt="Easy Lunch">`:`<span class="brand2">Easy Lunch</span>`}<div class="sh-title"><b>${esc(title)}</b><span>${esc(sub)}</span></div></div>`;}
function buildSheets(){
  const pr=S.print,C=S.clients,ALL=vehicles();const days=pr.days||DAYS.map(d=>d[0]);const vsel=new Set(pr.veh||ALL.map(v=>v.idx));
  const pages=[];const missing=[];
  DAYS.forEach(([k,,dn])=>{if(!days.includes(k))return;const r=currentRoute(k);if(!r){missing.push(dn);return;}const ps=planStats(r,k);const date=fmtDate(dayDate(k));
    r.trips.forEach((t,ti)=>{if(!vsel.has(t.van)||!t.stops.length)return;const st=ps[ti];const V=veh(t.van);const vname=V.name+(t.trip>1?" · viaje "+t.trip:"");
      if(pr.format==="remito"){
        const items=t.stops.map((id,i)=>{const c=C[id];return `<div class="remito">${sheetHead("Remito de entrega",dn+" "+date)}
          <div class="rm-grid"><div><small>Cliente</small><b>${esc(c.name)}</b></div><div><small>Fecha</small><b>${date}</b></div>
          <div><small>Dirección</small><b>${esc(c.address||"")}</b></div><div><small>Cantidad de viandas</small><span class="rm-q">${qty(c,k)}</span></div>
          <div><small>Transporte</small><b>${esc(vname)}</b></div><div><small>Parada</small><b>${i+1} de ${t.stops.length}${pr.eta?" · ~"+min2hm(st.etas[i]):""}</b></div></div>
          <div class="rm-ins"><small>Aclaraciones / instrucciones de entrega</small>${esc(c.notes||"")}</div>
          <div class="rm-sign"><div>Recibí conforme (firma)</div><div>Aclaración</div><div>Hora de entrega</div></div></div>`;});
        for(let i=0;i<items.length;i+=2)pages.push(`<section class="sheet half">${items[i]}${items[i+1]?`<div class="cut"></div>${items[i+1]}`:""}</section>`);
      }else{
        const rows=t.stops.map((id,i)=>{const c=C[id];return `<tr><td class="n">${i+1}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.address||"")}</td><td class="q">${qty(c,k)}</td>${pr.eta?`<td class="h">~${min2hm(st.etas[i])}</td>`:""}<td class="ins"><div class="pre">${esc(c.notes||"")}</div>${c.notes?"":`<div class="lines"></div>`}</td>${pr.sign?`<td class="f"></td>`:""}</tr>`;}).join("");
        pages.push(`<section class="sheet">${sheetHead("Hoja de ruta",dn+" "+date)}
          <div class="sh-meta"><div><small>Fecha</small><b>${dn} ${date}</b></div><div><small>Transporte</small><b>${esc(vname)}</b></div><div><small>Salida</small><b>${min2hm(st.start)} · ${esc(S.config.depotName)}</b></div><div><small>Total</small><b>${st.load} viandas · ${t.stops.length} entregas</b></div></div>
          <table class="sh"><thead><tr><th>#</th><th>Cliente</th><th>Dirección</th><th>Viandas</th>${pr.eta?"<th>Hora aprox.</th>":""}<th>Aclaraciones / instrucciones</th>${pr.sign?"<th>Firma recibí</th>":""}</tr></thead>
          <tbody>${rows}</tbody><tfoot><tr><td></td><td colspan="2">Total</td><td class="q">${st.load}</td>${pr.eta?"<td></td>":""}<td></td>${pr.sign?"<td></td>":""}</tr></tfoot></table>
          <div class="sh-foot"><span>Chofer: ______________________</span><span>Easy Lunch · ${esc(S.config.depotName)}</span></div></section>`);
      }});});
  return {pages,missing};
}
function renderHojas(){

  if(!pr.week)pr.week=S.week||defaultWeek();
  const days=pr.days||DAYS.map(d=>d[0]);const vs=new Set(pr.veh||ALL.map(v=>v.idx));
  $("#panel").innerHTML=`<h2>Hojas de ruta</h2>

    <div class="field"><label for="p-week">Semana del lunes</label><input id="p-week" type="date" value="${pr.week}"></div>
    <div class="field"><label>Días</label><div class="pcheck">
      <label class="vchip ${days.length===5?"on":""}"><input type="checkbox" id="p-alldays" ${days.length===5?"checked":""}>Todos</label>
      ${DAYS.map(([k,s])=>`<label class="vchip ${days.includes(k)?"on":""}"><input type="checkbox" data-pday="${k}" ${days.includes(k)?"checked":""}>${s} <small class="num">${fmtDate(dayDate(k)).slice(0,5)}</small></label>`).join("")}</div></div>

      ${ALL.map(v=>`<label class="vchip ${vs.has(v.idx)?"on":""}"><input type="checkbox" data-pveh="${v.idx}" ${vs.has(v.idx)?"checked":""}><span class="swatch" style="background:${COLORS[v.idx%COLORS.length]}"></span>${esc(v.name)}</label>`).join("")}</div></div>
    <div class="field"><label for="p-format">Formato</label><select id="p-format">
      <option value="hoja" ${pr.format!=="remito"?"selected":""}>Hoja de ruta (una hoja por vehículo y día)</option>
      <option value="remito" ${pr.format==="remito"?"selected":""}>Remitos (uno por cliente, 2 por hoja)</option></select></div>
    <label class="check"><input type="checkbox" id="p-eta" ${pr.eta?"checked":""}><span>Mostrar hora aproximada de llegada</span></label>
    ${pr.format!=="remito"?`<label class="check"><input type="checkbox" id="p-sign" ${pr.sign?"checked":""}><span>Columna de firma del cliente</span></label>`:""}
    <div class="row"><button class="btn primary" id="p-print">Imprimir</button><button class="btn" id="p-pdf">Descargar PDF</button></div>
    <p class="hint" style="margin:0">Las aclaraciones salen del campo “Instrucciones de entrega” de cada cliente (pestaña Clientes). Si está vacío, queda un renglón para escribir a mano.</p>
  </div>${pr.week!==(S.week||defaultWeek())?`<div class="note warn">Ojo: elegiste una semana distinta a la de los pedidos cargados (${weekDays(S.week||defaultWeek())[0][1].split("-").reverse().slice(0,2).join("/")}). Las cantidades salen de la semana activa; cambiala en Recorridos para usar los pedidos de esta.</div>`:""}<div id="p-info"></div>`;
  const P=$("#panel");
  const set=(k,v)=>{pr[k]=v;renderHojas();};
  $("#p-week").onchange=e=>{const d=e.target.value?mondayOf(new Date(e.target.value+"T12:00:00")):mondayOf(new Date());set("week",isoDate(d));};
  $("#p-alldays").onchange=e=>set("days",e.target.checked?DAYS.map(d=>d[0]):[]);
  P.querySelectorAll("[data-pday]").forEach(cb=>cb.onchange=()=>{const cur=new Set(days);cb.checked?cur.add(cb.dataset.pday):cur.delete(cb.dataset.pday);set("days",DAYS.map(d=>d[0]).filter(k=>cur.has(k)));});
  $("#p-allveh").onchange=e=>set("veh",e.target.checked?ALL.map(v=>v.idx):[]);
  P.querySelectorAll("[data-pveh]").forEach(cb=>cb.onchange=()=>{const cur=new Set(vs);const i=+cb.dataset.pveh;cb.checked?cur.add(i):cur.delete(i);set("veh",[...cur]);});
  $("#p-format").onchange=e=>set("format",e.target.value);
  $("#p-eta").onchange=e=>set("eta",e.target.checked);
  if($("#p-sign"))$("#p-sign").onchange=e=>set("sign",e.target.checked);
  const draw=()=>{const {pages,missing}=buildSheets();
    $("#sheets").innerHTML=pages.length?`<div id="sheetsInner">${pages.join("")}</div>`:`<div class="empty">No hay recorridos para lo que elegiste. Revisá días y transporte, o armá los recorridos en la pestaña Recorridos.</div>`;
    $("#p-info").innerHTML=(pages.length?`<div class="note info">${pages.length} hoja${pages.length>1?"s":""} lista${pages.length>1?"s":""} para imprimir.</div>`:"")+(missing.length?`<div class="note warn">Sin recorrido armado: ${missing.join(", ")}.</div>`:"");
    $("#p-print").disabled=$("#p-pdf").disabled=!pages.length;return pages;};
  draw();ensureLogo().then(l=>{if(l&&S.tab==="hojas")draw();});
  $("#p-print").onclick=async()=>{await ensureLogo();const pages=draw();$("#printRoot").innerHTML=pages.join("");setTimeout(()=>window.print(),150);};
  $("#p-pdf").onclick=async e=>{const b=e.target;if(!window.html2pdf){toast("El generador de PDF todavía está cargando, probá en unos segundos");return;}
    b.disabled=true;b.textContent="Generando PDF…";await ensureLogo();draw();
    const sel=(pr.days||DAYS.map(d=>d[0]));const name=`${pr.format==="remito"?"Remitos":"Hojas de ruta"} Easy Lunch ${fmtDate(dayDate(sel[0]||"lun")).slice(0,5).replace("/","-")}${sel.length>1?" a "+fmtDate(dayDate(sel[sel.length-1])).slice(0,5).replace("/","-"):""}.pdf`;
    const holder=document.createElement("div");holder.style.cssText="width:210mm;background:#fff";holder.innerHTML=buildSheets().pages.join("");
    holder.querySelectorAll(".sheet").forEach((s,i,a)=>{s.style.boxShadow="none";s.style.margin="0";s.style.height="296.8mm";s.style.minHeight="0";s.style.overflow="hidden";if(i<a.length-1){s.style.pageBreakAfter="always";s.style.breakAfter="page";}});
    try{await window.html2pdf().set({margin:0,filename:name,image:{type:"jpeg",quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(holder).save();toast("PDF descargado");}
    catch(err){console.error(err);toast("No se pudo generar el PDF. Probá con Imprimir → Guardar como PDF.");}
    holder.remove();b.disabled=false;b.textContent="Descargar PDF";};
}
window.addEventListener("afterprint",()=>{$("#printRoot").innerHTML="";});
/* ---------- sincronización automática de pedidos ---------- */
function defaultWeek(){const t=new Date();const m=mondayOf(t);if(t.getDay()===5)m.setDate(m.getDate()+7);return isoDate(m);}
function weekDays(w){const m=new Date(w+"T12:00:00");return DAYS.map(([k],i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return [k,isoDate(d)];});}
const SYNC={at:null,busy:false,unmatched:[],err:null,total:null,week:null,last:null};
function habitFor(day,id){const H=S.config.habit||{};if(H[day]&&H[day][id])return H[day][id];for(const [k] of DAYS){if(H[k]&&H[k][id])return H[k][id];}return null;}
function insertHabitual(r,day,id){const c=S.clients[id];const h=habitFor(day,id);if(!h)return false;
  let t=r.trips.find(x=>x.van===h.v);
  if(!t){let best=null;r.trips.forEach(tt=>{if(!transOk(c,veh(tt.van)))return;const n=bestInsert(tt.stops,id);const add=seqCost(n)-seqCost(tt.stops);if(!best||add<best[0])best=[add,tt,n];});if(!best)return false;best[1].stops=best[2];best[1].g=null;return true;}
  for(const p of h.p||[]){const i=t.stops.indexOf(p);if(i>=0){t.stops.splice(i+1,0,id);t.g=null;return true;}}
  for(const n of h.n||[]){const i=t.stops.indexOf(n);if(i>=0){t.stops.splice(i,0,id);t.g=null;return true;}}
  t.stops=bestInsert(t.stops,id);t.g=null;return true;}
async function syncPedidos(opts={}){
  if(!S.db||SYNC.busy)return;if(S.config.autoPedidos===false&&!opts.force)return;
  S.week=S.week||defaultWeek();const days=weekDays(S.week);SYNC.busy=true;SYNC.err=null;if(opts.force)render();
  try{
    const r=await fetch(`/api/pedidos?desde=${days[0][1]}&hasta=${days[4][1]}`);const j=await r.json();if(!r.ok)throw new Error(j.message||"sin respuesta");
    const filas=j.filas||[];SYNC.total=filas.reduce((a,f)=>a+f.viandas,0);SYNC.week=S.week;
    const groups={};filas.forEach(f=>{const g=groups[f.id_empresa]||(groups[f.id_empresa]={id:f.id_empresa,name:f.empresa,q:{}});const dk=(days.find(d=>d[1]===f.fecha)||[])[0];if(dk)g.q[dk]=(g.q[dk]||0)+f.viandas;});
    const per={};const unmatched=[];const empMap={...(S.config.empMap||{})};let mapCh=false;
    Object.values(groups).forEach(g=>{let m=empMap[g.id];if(m==="_ign")return;if(!m||!S.clients[m]){m=guessClient(g.name);if(m){empMap[g.id]=m;mapCh=true;}}
      if(!m){unmatched.push(g);return;}const q=per[m]||(per[m]={});DAYS.forEach(([k])=>{if(g.q[k])q[k]=(q[k]||0)+g.q[k];});});
    SYNC.unmatched=unmatched;
    const summary={changed:0,added:0,pending:0,removed:0};
    if(SYNC.total>0){
      const before={};Object.values(S.clients).forEach(c=>before[c.id]={...(c.qty||{})});
      for(const c of Object.values(S.clients)){const nq={};DAYS.forEach(([k])=>{const v=per[c.id]&&per[c.id][k];if(v)nq[k]=v;});
        if(JSON.stringify(c.qty||{})!==JSON.stringify(nq)){S.clients[c.id]={...c,qty:nq};summary.changed++;sbUpsert("rutas_clientes",{id:c.id,data:S.clients[c.id],updated_at:now()}).catch(onWriteErr);}}
      // pedidos nuevos de clientes habituales: van a su recorrido y posición de siempre
      DAYS.forEach(([k])=>{const cur=currentRoute(k);if(!cur)return;const inT=new Set();cur.trips.forEach(t=>t.stops.forEach(x=>inT.add(x)));let ch=false;
        Object.values(S.clients).forEach(c=>{if(qty(c,k)>0&&hasLoc(c)&&!inT.has(c.id)){if(insertHabitual(cur,k,c.id)){summary.added++;ch=true;}else summary.pending++;}
          if(!(qty(c,k)>0)&&(before[c.id]||{})[k]>0&&(S.routes[k].trips||[]).some(t=>(t.stops||[]).includes(c.id)))summary.removed++;});
        if(ch){S.routes[k]={...S.routes[k],trips:normalizeTrips(cur).trips};saveRoute(k);}});
    }
    if(mapCh){S.config.empMap=empMap;saveConfig();}
    SYNC.last=summary;SYNC.at=Date.now();
    if(summary.changed&&(summary.added||summary.pending||summary.removed))toast(`Pedidos actualizados: ${summary.added?summary.added+" agregado"+(summary.added>1?"s":"")+" a su recorrido de siempre":""}${summary.added&&summary.pending?" · ":""}${summary.pending?summary.pending+" para asignar a mano":""}${(summary.added||summary.pending)&&summary.removed?" · ":""}${summary.removed?summary.removed+" sin pedido (fuera del recorrido)":""}`);
  }catch(e){SYNC.err=e.message;}
  SYNC.busy=false;render();
}
function syncLine(){const days=weekDays(S.week||defaultWeek());const f=d=>d.slice(8)+"/"+d.slice(5,7);
  let h=`<div class="syncline"><span>Pedidos · semana <b>${f(days[0][1])} al ${f(days[4][1])}</b></span>
    <button class="btn ghost icon" data-wk="-7" aria-label="Semana anterior">‹</button><button class="btn ghost icon" data-wk="7" aria-label="Semana siguiente">›</button>
    <span class="spacer"></span><span class="hint">${SYNC.busy?"Actualizando…":SYNC.err?"Error al traer pedidos":SYNC.at?"actualizado "+new Date(SYNC.at).toTimeString().slice(0,5):""}</span>
    <button class="btn small" id="syncBtn" ${SYNC.busy?"disabled":""}>Actualizar</button></div>`;
  if(SYNC.err)h+=`<div class="note bad">No pude traer los pedidos del sistema: ${esc(SYNC.err)}</div>`;
  else if(SYNC.at&&SYNC.total===0)h+=`<div class="note warn">Todavía no hay pedidos cargados en el sistema para esta semana. Se muestran las últimas cantidades guardadas.</div>`;
  if(SYNC.unmatched.length)h+=`<div class="note warn"><span>${SYNC.unmatched.length} empresa${SYNC.unmatched.length>1?"s":""} con pedidos sin asignar a un cliente: <b>${SYNC.unmatched.map(g=>esc(g.name)).join(", ")}</b></span><button class="btn small" id="goMap">Asignar</button></div>`;
  return h;}
function bindSyncLine(){const P=$("#panel");
  P.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{const d=new Date((S.week||defaultWeek())+"T12:00:00");d.setDate(d.getDate()+ +b.dataset.wk);S.week=isoDate(d);SYNC.at=null;SYNC.unmatched=[];syncPedidos({force:true});});
  const sb=$("#syncBtn");if(sb)sb.onclick=()=>syncPedidos({force:true});
  const gm=$("#goMap");if(gm)gm.onclick=()=>{S.tab="clientes";S.pedOpen=true;PED.week=S.week;PED.data=null;render();setTimeout(()=>{const g=$("#pedGo");if(g)g.click();},50);};}

/* ---------- pedidos del sistema Easy Lunch ---------- */
const PED={week:null,data:null,loading:false,err:null,sel:{},zero:true};
const normName=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function guessClient(emp){const toks=normName(emp).split(" ").filter(t=>t.length>=3);if(!toks.length)return null;let best=null,bs=0,tie=false;
  Object.values(S.clients).forEach(c=>{const hay=" "+normName(c.name+" "+(c.address||""))+" ";const nm=" "+normName(c.name)+" ";if(nm.trim()===normName(emp)){best=c.id;bs=99;tie=false;return;}
    let sc=0;toks.forEach(t=>{if(hay.includes(" "+t+" ")||hay.includes(" "+t))sc++;});if(!toks.some(t=>nm.includes(t)))sc=0;
    const etk=new Set(normName(emp).split(" "));const ctk=normName(c.name).split(" ").filter(t=>t.length>=3);if(ctk.length&&ctk.every(t=>etk.has(t)))sc=Math.max(sc,toks.length);
    if(sc>bs){bs=sc;best=c.id;tie=false;}else if(sc===bs&&sc>0&&bs<99)tie=true;});
  return bs>=Math.max(1,Math.ceil(toks.length*.6))&&!tie?best:null;}
function pedWeekDays(){const m=new Date((PED.week||isoDate(mondayOf(new Date())))+"T12:00:00");return DAYS.map(([k],i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return [k,isoDate(d)];});}
function pedGroups(){const days=pedWeekDays();const g={};(PED.data||[]).forEach(f=>{const x=g[f.id_empresa]||(g[f.id_empresa]={id:f.id_empresa,name:f.empresa,q:{}});const dk=(days.find(d=>d[1]===f.fecha)||[])[0];if(dk)x.q[dk]=(x.q[dk]||0)+f.viandas;});return Object.values(g).sort((a,b)=>a.name.localeCompare(b.name,"es"));}
function pedChoice(g){if(PED.sel[g.id]!==undefined)return PED.sel[g.id];const m=(S.config.empMap||{})[g.id];if(m&&(m==="_ign"||S.clients[m]))return m;return guessClient(g.name)||"";}
function pedidosCard(){
  if(!PED.week){PED.week=S.week||defaultWeek();}
  const days=pedWeekDays();const groups=pedGroups();const opts=Object.values(S.clients).sort((a,b)=>String(a.name).localeCompare(String(b.name),"es"));
  const chosen=new Set(groups.map(pedChoice).filter(x=>x&&x!=="_ign"&&x!=="_new"));const noOrder=opts.filter(c=>!chosen.has(c.id));
  let h=`<div class="card ped"><div class="row"><h3>Pedidos del sistema Easy Lunch</h3><span class="spacer"></span><button class="btn ghost small" id="pedClose">Cerrar</button></div>
    <div class="row"><div class="field" style="flex:1;min-width:150px"><label for="pedWeek">Semana del lunes</label><input id="pedWeek" type="date" value="${PED.week}"></div>
      <button class="btn small" data-pedwk="0">Esta semana</button><button class="btn small" data-pedwk="7">Próxima</button>
      <button class="btn primary small" id="pedGo" ${PED.loading?"disabled":""}>${PED.loading?"Buscando…":"Buscar pedidos"}</button></div>`;
  if(PED.err)h+=`<div class="note bad">${esc(PED.err)}</div>`;
  if(PED.data){
    if(!groups.length)h+=`<div class="note warn">No hay pedidos cargados en el sistema para la semana del ${fmtDate(new Date(days[0][1]+"T12:00:00")).slice(0,5)} al ${fmtDate(new Date(days[4][1]+"T12:00:00")).slice(0,5)}.</div>`;
    else{
      const tot=DAYS.map(([k])=>groups.reduce((a,g)=>a+(g.q[k]||0),0));
      h+=`<div class="tblwrap"><table class="pedt"><thead><tr><th>Empresa → cliente</th>${DAYS.map(([k,sn],i)=>`<th>${sn}<br><small>${days[i][1].slice(8)}/${days[i][1].slice(5,7)}</small></th>`).join("")}</tr></thead><tbody>`+
        groups.map(g=>{const ch=pedChoice(g);return `<tr class="${ch?"":"unm"}"><td><b>${esc(g.name)}</b><br><select data-pedmap="${esc(g.id)}"><option value="">— Elegí —</option><option value="_new" ${ch==="_new"?"selected":""}>+ Crear cliente nuevo</option><option value="_ign" ${ch==="_ign"?"selected":""}>No entregar / ignorar</option>${opts.map(c=>`<option value="${c.id}" ${ch===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></td>${DAYS.map(([k])=>`<td class="num">${g.q[k]||"·"}</td>`).join("")}</tr>`;}).join("")+
        `</tbody><tfoot><tr><td>Total</td>${tot.map(t=>`<td class="num">${t}</td>`).join("")}</tr></tfoot></table></div>`;
      const unm=groups.filter(g=>!pedChoice(g)).length;
      if(unm)h+=`<div class="note warn">${unm} empresa${unm>1?"s":""} sin cliente asignado (en amarillo). Elegí a qué cliente corresponde${unm>1?"n":""}, creala${unm>1?"s":""} o ignorala${unm>1?"s":""}. Se recuerda para las próximas veces.</div>`;
      h+=`<label class="check"><input type="checkbox" id="pedZero" ${PED.zero?"checked":""}><span>Poner en 0 esa semana a los clientes sin pedidos (${noOrder.length})</span></label>
        <div class="row"><button class="btn primary" id="pedApply" ${unm?"disabled":""}>Cargar estas viandas</button><span class="hint">Reemplaza las viandas de lunes a viernes de cada cliente. Después recalculá o cargá un recorrido guardado.</span></div>`;
    }}
  return h+`</div>`;}
function bindPedidos(){
  const P=$("#panel");$("#pedClose").onclick=()=>{S.pedOpen=false;render();};
  $("#pedWeek").onchange=e=>{PED.week=isoDate(mondayOf(new Date(e.target.value+"T12:00:00")));PED.data=null;render();};
  P.querySelectorAll("[data-pedwk]").forEach(b=>b.onclick=()=>{const d=mondayOf(new Date());d.setDate(d.getDate()+ +b.dataset.pedwk);PED.week=isoDate(d);PED.data=null;render();});
  $("#pedGo").onclick=async()=>{const days=pedWeekDays();PED.loading=true;PED.err=null;render();
    try{const r=await fetch(`/api/pedidos?desde=${days[0][1]}&hasta=${days[4][1]}`);const j=await r.json();if(!r.ok)throw new Error(j.message||"No se pudo leer el sistema");PED.data=j.filas;PED.sel={};}
    catch(e){PED.err="No pude traer los pedidos: "+e.message;}PED.loading=false;render();};
  P.querySelectorAll("[data-pedmap]").forEach(sel=>sel.onchange=()=>{PED.sel[sel.dataset.pedmap]=sel.value;render();});
  const z=$("#pedZero");if(z)z.onchange=()=>{PED.zero=z.checked;};
  const ap=$("#pedApply");if(ap)ap.onclick=async()=>{ap.disabled=true;ap.textContent="Cargando…";
    const groups=pedGroups();const perClient={};const empMap={...(S.config.empMap||{})};const created=[];
    for(const g of groups){let ch=pedChoice(g);if(ch==="_ign"){empMap[g.id]="_ign";continue;}
      if(ch==="_new"){const c={id:uid(),name:g.name,address:"",lat:null,lng:null,geo:null,qty:{},before:"",notes:"",transport:"camioneta"};S.clients[c.id]=c;created.push(c);ch=c.id;}
      empMap[g.id]=ch;const q=perClient[ch]||(perClient[ch]={});DAYS.forEach(([k])=>{if(g.q[k])q[k]=(q[k]||0)+g.q[k];});}
    let n=0;for(const c of Object.values(S.clients)){const q=perClient[c.id];if(!q&&!PED.zero)continue;const nq={};DAYS.forEach(([k])=>{if(q&&q[k])nq[k]=q[k];});
      const same=JSON.stringify(c.qty||{})===JSON.stringify(nq);if(same&&!created.includes(c))continue;await saveClient({...c,qty:nq});n++;}
    S.config.empMap=empMap;saveConfig();PED.sel={};
    toast(`Listo: ${n} cliente${n!==1?"s":""} actualizado${n!==1?"s":""}${created.length?` (${created.length} nuevo${created.length>1?"s":""}: cargales la dirección)`:""}. Ahora recalculá los recorridos o cargá uno guardado.`);
    render();};
}
function locState(ok,t){const el=$("#locState");if(!el)return;el.className="locstate "+(ok?"ok":"no");el.textContent=t;}
function render(){if(S.tab!=="clientes"||S.sel===null)clearPreview();const P=$("#panel");if(S.tab!=="rutas"){P.onclick=null;P.onchange=null;}renderHeader();if(S.tab==="rutas")renderRutas();else if(S.tab==="clientes")renderClientes();else if(S.tab==="hojas")renderHojas();else renderConfig();
  const sh=S.tab==="hojas";$("#sheets").hidden=!sh;$("#map").style.visibility=sh?"hidden":"visible";document.querySelector(".mapctl").hidden=sh;document.querySelector(".mapnote").hidden=sh;if(sh){$("#trafficLegend").hidden=true;$("#tripFilter").hidden=true;}
  if(!sh)renderMap();}
function renderSafe(){const a=document.activeElement;if(a&&a.closest&&a.closest("#panel form")){renderHeader();renderMap();return;}render();}
render();setTimeout(()=>map.invalidateSize(),50);window.addEventListener("resize",()=>map.invalidateSize());
initDb();
})();
