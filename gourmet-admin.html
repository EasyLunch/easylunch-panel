<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gourmet · Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F5F5F5;--surface:#fff;--ink:#212121;--muted:#666;--line:#E0E0E0;--green:#32952E;--green-2:#2A7F27;--gold:#138E03;--gold-soft:#E7F4E4;--danger:#E53935;--ok:#138E03}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;font-weight:600;margin:0}
button{font:inherit;cursor:pointer} input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.btn{border:0;border-radius:7px;text-transform:uppercase;font-size:12px;letter-spacing:.5px;box-shadow:0 2px 5px rgba(0,0,0,.16);font-family:Montserrat,sans-serif;padding:9px 18px;background:var(--green);color:#fff;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--green-2)} .btn:disabled{opacity:.5}
.btn.ghost{background:#EEEEEE;color:#1E1E1E;border:1px solid var(--line);box-shadow:none;border-radius:4px} .btn.ghost:hover{border-color:var(--ink)}
.btn.gold{background:var(--gold)} .btn.small{padding:5px 12px;font-size:12px}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #E7C9C4}
.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;outline:none}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.input{resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field small{color:var(--muted);font-size:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url('https://app.easylunch.com.ar/assets/img/home/inicio-desktop.jpg') center/cover,url('gourmet-assets/fondo-login.jpg') center/cover,#333}
.lcard{background:#fff;border-radius:18px;padding:34px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.07)}
.lcard h1{font-size:24px;margin:6px 0 20px;font-weight:600}
.lcard .lhead{background:#F5F5F5;margin:-34px -34px 22px;padding:22px;border-radius:18px 18px 0 0;text-align:center}
.lcard .lhead .logo{height:46px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside.side{background:#fff;color:var(--ink);border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .brand{margin:-24px -14px 14px;padding:14px 18px;background:#F5F5F5;text-align:left;border-bottom:1px solid var(--line)}
.side .brand .logo{height:40px;display:block}
.side .brand span{display:block;font-family:Montserrat,sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#32952E;margin-top:4px}
.nav-g{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#999;font-family:Montserrat,sans-serif;font-weight:600;padding:14px 10px 6px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:#424242;font-weight:500;padding:8px 12px;border-radius:9px;margin-bottom:2px}
.nav:hover{background:#F1F5EF} .nav.on{background:#E8F4E7;color:#32952E;font-weight:600;box-shadow:inset 3px 0 0 #32952E}
.side .foot{margin-top:auto;font-size:12px;color:#888;padding:0 10px}
.side .foot button{background:none;border:0;color:#138E03;padding:0;font-weight:600}
main{padding:28px 32px 80px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-size:28px;line-height:1.15;font-weight:600}
.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.toolbar .field{margin:0}
.panel{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.05);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(0,0,0,.6);text-align:left;font-weight:600;font-family:Roboto,sans-serif;padding:11px 14px;background:#EEEEEE;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid #F0EBE2;vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:#F3F8F1}
.num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;border-radius:8px;padding:2px 9px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:#EEE9DF;color:var(--muted)}
.st.confirmado{background:#E5EEE8;color:var(--ok)} .st.en_produccion{background:var(--gold-soft);color:#0F7402}
.st.despachado,.st.entregado{background:#E4E9F0;color:#3A5373} .st.cancelado{background:#F3E2DF;color:var(--danger)}
.st.off{background:#F3E2DF;color:var(--danger)}
select.st-sel{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.kpi small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:Montserrat,sans-serif;font-size:28px;line-height:1.2;font-weight:700;color:#32952E}
.items{margin:0;padding:0;list-style:none;font-size:13px}
.items li{padding:2px 0}
.items small{color:var(--muted)}
.thumb{width:56px;height:42px;border-radius:8px;background:#EEE7DA center/cover;flex:0 0 auto}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.05);cursor:pointer}
.pcard .ph{aspect-ratio:16/10;background:#EEE7DA center/cover;display:flex;align-items:center;justify-content:center;color:#B9AE99;font-family:Montserrat,sans-serif;font-size:20px}
.pcard .b{padding:12px 14px} .pcard h3{font-size:16px;line-height:1.25}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px}
.ep-row{display:grid;grid-template-columns:24px 1fr 130px;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid #F0EBE2}
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--bg);border-radius:16px;width:100%;max-width:860px;padding:26px 28px}
.modal h2{font-size:24px;margin-bottom:16px}
.mfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.photo,.photo.field{display:flex;flex-direction:row;gap:14px;align-items:center}
.photo .ph{width:160px;height:110px;border-radius:10px;background:#EEE7DA center/cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#B9AE99}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:90}
.toast.bad{background:var(--danger)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.group{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.05);padding:16px 18px;margin-bottom:14px}
.group h3{font-size:19px}
@media (max-width:900px){.shell{grid-template-columns:1fr}aside.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:12px}.side .brand,.nav-g,.side .foot{display:none}.nav{width:auto}main{padding:20px 16px 80px}.panel{overflow-x:auto}}
@media print{aside.side,.toolbar,.noprint{display:none!important}.shell{display:block}main{padding:0}.panel,.group,.kpi{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>

<section id="login" hidden>
  <form class="lcard" id="lForm">
    <div class="lhead"><img class="logo" alt="Easy Lunch" src="https://app.easylunch.com.ar/assets/img/upload/XOn7H9LwQB.webp" onerror="this.onerror=null;this.src='gourmet-assets/logo-easylunch-color.png'"></div>
    <div class="eyebrow">Platos Gourmet</div>
    <h1>Administración</h1>
    <div class="field"><label>Email</label><input class="input" id="lEmail" type="email" required></div>
    <div class="field"><label>Contraseña</label><input class="input" id="lPass" type="password" required></div>
    <div class="err" id="lErr"></div>
    <button class="btn" style="width:100%">Entrar</button>
  </form>
</section>

<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="brand"><img class="logo" alt="Easy Lunch" src="https://app.easylunch.com.ar/assets/img/upload/XOn7H9LwQB.webp" onerror="this.onerror=null;this.src='gourmet-assets/logo-easylunch-color.png'"><span>Gourmet · Admin</span></div>
    <div class="nav-g">Operación</div>
    <button class="nav on" data-v="pedidos">Pedidos</button>
    <div class="nav-g">Catálogo</div>
    <button class="nav" data-v="platos">Platos principales</button>
    <button class="nav" data-v="guarniciones">Guarniciones</button>
    <button class="nav" data-v="postres">Postres</button>
    <div class="nav-g">Clientes</div>
    <button class="nav" data-v="empresas">Empresas</button>
    <button class="nav" data-v="usuarios">Usuarios</button>
    <button class="nav" data-v="ajustes">Ajustes</button>
    <div class="foot"><div id="me"></div><button id="logout">Salir</button></div>
  </aside>
  <main id="main"></main>
</div>

<div class="overlay" id="ov" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   CONFIGURACIÓN — mismos valores que usa el panel (recetario.html)
   ===================================================================== */
const SUPABASE_URL      = 'https://xlwcozznliafhouhqjzl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsd2NvenpubGlhZmhvdWhxanpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTkwMzAsImV4cCI6MjA5NjUzNTAzMH0.i-GTNnGK_5GMUum_tmUKIiX4NUkmEiJovK_M7BwGFfg';
const API_USUARIOS      = '/api/gourmet-usuario';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => n == null || n === '' ? '—' : '$ ' + Number(n).toLocaleString('es-AR', {maximumFractionDigits:0});
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'], DIAS_L=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ESTADOS = {confirmado:'Confirmado', en_produccion:'En producción', despachado:'Despachado', entregado:'Entregado', cancelado:'Cancelado'};
const PROTEINAS = ['vacuna','pollo','pescado','cerdo','cordero','vegetariano','otra'];
const D = { empresas:[], platos:[], guarniciones:[], pg:[], ep:[], usuarios:[], config:{} };
let VIEW = 'pedidos';

function toast(m, bad){ const t=$('#toast'); t.textContent=m; t.className='toast'+(bad?' bad':''); t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,3500); }
const hoyAR = () => new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const addDays = (s,n) => { const d=new Date(s+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const fF = s => { const d=new Date(s+'T12:00:00Z'); return `${DIAS[d.getUTCDay()]} ${d.getUTCDate()} ${MESES[d.getUTCMonth()]}`; };
const fFL = s => { const d=new Date(s+'T12:00:00Z'); return `${DIAS_L[d.getUTCDay()]} ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]}`; };
const nextDelivery = () => { let d=addDays(hoyAR(),1); const dias=D.config.dias_entrega||[1,2,3,4,5]; for(let i=0;i<10;i++){ const w=new Date(d+'T12:00:00Z').getUTCDay()||7; if(dias.includes(w)) return d; d=addDays(d,1);} return d; };
const lines = t => String(t||'').split(/\n+/).map(s=>s.replace(/^\s*(\d+[\.\)]|[-•])\s*/,'').trim()).filter(Boolean);
const norm = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const empName = id => D.empresas.find(e=>e.id===id)?.nombre || '—';
function csv(name, rows){
  const s = rows.map(r => r.map(v => { v = v==null ? '' : String(v); return /[";\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+s], {type:'text/csv;charset=utf-8'})); a.download = name; a.click();
}
async function q(promise, okMsg){ const { data, error } = await promise; if (error){ toast(error.message, true); throw error; } if (okMsg) toast(okMsg); return data; }

/* ---------------- MODAL ---------------- */
function openModal(html){ $('#modal').innerHTML = html; $('#ov').hidden=false; document.body.style.overflow='hidden'; }
function closeModal(){ $('#ov').hidden=true; document.body.style.overflow=''; }
$('#ov').addEventListener('mousedown', e => { if (e.target.id==='ov') closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
function confirmBtn(btn, fn){ if (btn.dataset.sure!=='1'){ const t=btn.textContent; btn.dataset.sure='1'; btn.textContent='¿Seguro? Tocá de nuevo'; setTimeout(()=>{btn.dataset.sure='';btn.textContent=t;},4000); return; } fn(); }

/* ---------------- AUTH ---------------- */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const ok = await sb.rpc('gourmet_es_admin');
  if (!ok.data){ await sb.auth.signOut(); showLogin('Este usuario no es administrador.'); return; }
  $('#login').hidden=true; $('#app').hidden=false; $('#me').textContent = session.user.email;
  await loadBase(); go(VIEW);
}
function showLogin(msg){ $('#login').hidden=false; $('#app').hidden=true; $('#lErr').textContent = msg||''; }
$('#lForm').onsubmit = async e => { e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email:$('#lEmail').value.trim(), password:$('#lPass').value });
  if (error) return $('#lErr').textContent='Email o contraseña incorrectos.'; init(); };
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function loadBase(){
  const [e,p,g,pg,ep,u,c] = await Promise.all([
    sb.from('gourmet_empresas').select('*').order('nombre'),
    sb.from('gourmet_platos').select('*').order('orden').order('nombre'),
    sb.from('gourmet_guarniciones').select('*').order('orden').order('nombre'),
    sb.from('gourmet_plato_guarniciones').select('*'),
    sb.from('gourmet_empresa_platos').select('*'),
    sb.from('gourmet_usuarios').select('*').order('nombre'),
    sb.from('gourmet_config').select('*'),
  ]);
  D.empresas=e.data||[]; D.platos=p.data||[]; D.guarniciones=g.data||[]; D.pg=pg.data||[]; D.ep=ep.data||[]; D.usuarios=u.data||[];
  D.config = Object.fromEntries((c.data||[]).map(r=>[r.clave, r.valor]));
}

function go(v){ VIEW=v; $$('.nav').forEach(n=>n.classList.toggle('on', n.dataset.v===v)); (VIEWS[v]||VIEWS.pedidos)(); window.scrollTo({top:0}); }
$$('.nav').forEach(n => n.onclick = () => go(n.dataset.v));

async function fetchPedidos({desde, hasta, empresa, estado, sinCancelados}){
  let qy = sb.from('gourmet_pedidos').select('*, gourmet_usuarios(nombre,email), gourmet_pedido_items(*)')
    .gte('fecha_entrega', desde).lte('fecha_entrega', hasta).order('fecha_entrega').order('numero');
  if (empresa) qy = qy.eq('empresa_id', empresa);
  if (estado) qy = qy.eq('estado', estado);
  if (sinCancelados) qy = qy.neq('estado', 'cancelado');
  return await q(qy);
}
const empOptions = (sel, todas='Todas las empresas') => `<option value="">${todas}</option>` + D.empresas.map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.nombre)}</option>`).join('');

/* =====================================================================
   VISTAS
   ===================================================================== */
const F = { desde:null, hasta:null, empresa:'', estado:'', fecha:null, mes:null };
const VIEWS = {};

/* ---------------- PEDIDOS ---------------- */
VIEWS.pedidos = async () => {
  F.desde ||= hoyAR(); F.hasta ||= addDays(hoyAR(), 7);
  $('#main').innerHTML = `
    <div class="head"><div><div class="eyebrow">Operación</div><h1>Pedidos</h1></div>
      <div style="display:flex;gap:8px"><button class="btn ghost" id="xCsv">Exportar CSV</button></div></div>
    <div class="toolbar">
      <div class="field"><label>Desde</label><input type="date" class="input" id="fDesde" value="${F.desde}"></div>
      <div class="field"><label>Hasta</label><input type="date" class="input" id="fHasta" value="${F.hasta}"></div>
      <div class="field"><label>Empresa</label><select class="input" id="fEmp">${empOptions(F.empresa)}</select></div>
      <div class="field"><label>Estado</label><select class="input" id="fEst"><option value="">Todos</option>${Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}" ${F.estado===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field" style="margin-left:auto"><label>Pasar los visibles a</label>
        <div style="display:flex;gap:6px"><select class="input" id="bulkEst">${Object.entries(ESTADOS).filter(([k])=>k!=='cancelado').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="btn ghost" id="bulkGo">Aplicar</button></div></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="panel" id="tbl"><div class="empty">Cargando…</div></div>`;
  const reload = async () => {
    F.desde=$('#fDesde').value; F.hasta=$('#fHasta').value; F.empresa=$('#fEmp').value; F.estado=$('#fEst').value;
    const rows = await fetchPedidos(F);
    const act = rows.filter(r=>r.estado!=='cancelado');
    $('#kpis').innerHTML = `
      <div class="kpi"><small>Pedidos</small><b>${act.length}</b></div>
      <div class="kpi"><small>Platos</small><b>${act.reduce((a,r)=>a+r.total_unidades,0)}</b></div>
      <div class="kpi"><small>Empresas</small><b>${new Set(act.map(r=>r.empresa_id)).size}</b></div>
      <div class="kpi"><small>Monto</small><b>${money(act.reduce((a,r)=>a+Number(r.total),0))}</b></div>`;
    if (!rows.length){ $('#tbl').innerHTML = '<div class="empty">No hay pedidos en este rango.</div>'; return; }
    $('#tbl').innerHTML = `<table><thead><tr><th>#</th><th>Entrega</th><th>Empresa</th><th>Detalle</th><th class="num">Platos</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody>
      ${rows.map(r => `<tr>
        <td>${r.numero}</td><td>${fF(r.fecha_entrega)}</td>
        <td><b>${esc(empName(r.empresa_id))}</b><br><small class="muted">${esc(r.gourmet_usuarios?.nombre||r.gourmet_usuarios?.email||'')}</small></td>
        <td><ul class="items">${r.gourmet_pedido_items.map(i=>`<li>${i.cantidad} × ${esc(i.plato_nombre)}${i.guarnicion_nombre?` <small>/ ${esc(i.guarnicion_nombre)}</small>`:''}${i.para_quien?` <small>· ${esc(i.para_quien)}</small>`:''}</li>`).join('')}</ul>${r.notas?`<small class="muted">Nota: ${esc(r.notas)}</small>`:''}</td>
        <td class="num">${r.total_unidades}</td><td class="num">${money(r.total)}${r.facturado?'<br><small class="muted">facturado</small>':''}</td>
        <td><select class="st-sel" data-id="${r.id}">${Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}" ${r.estado===k?'selected':''}>${v}</option>`).join('')}</select></td>
      </tr>`).join('')}</tbody></table>`;
    $$('.st-sel').forEach(s => s.onchange = async () => { await q(sb.from('gourmet_pedidos').update({estado:s.value, updated_at:new Date().toISOString()}).eq('id', s.dataset.id), 'Estado actualizado'); reload(); });

async function comprimir(file, max=1600){
  const img = await new Promise((ok, bad) => { const i=new Image(); i.onload=()=>ok(i); i.onerror=bad; i.src=URL.createObjectURL(file); });
  const k = Math.min(1, max/Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(ok => c.toBlob(ok, 'image/jpeg', .85));
}
async function subirFoto(file, carpeta){
  const blob = await comprimir(file);
  const path = `${carpeta}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  await q(sb.storage.from('gourmet').upload(path, blob, { contentType:'image/jpeg', upsert:true }));
  return sb.storage.from('gourmet').getPublicUrl(path).data.publicUrl;
}

async function api(body){
  const { data:{ session } } = await sb.auth.getSession();
  const r = await fetch(API_USUARIOS, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+session.access_token }, body:JSON.stringify(body) });

/* Empresas para elegir al crear/editar un usuario: las ya habilitadas en Gourmet + todas las activas del sistema.
   Si se elige una del sistema que todavía no está en Gourmet, se da de alta sola (con todos los platos activos). */
async function empSelectUsuario(sel, vacio){
  const sis = await empresasSistema();
  const vinc = new Set(D.empresas.map(e=>String(e.id_empresa_el||'')));
  const ya = D.empresas.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const nuevas = sis.filter(x=>x.activa && !vinc.has(String(x.id)));
  return `<option value="">${vacio}</option>`
    + (ya.length ? `<optgroup label="Ya habilitadas en Gourmet">${ya.map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.nombre)}</option>`).join('')}</optgroup>` : '')
    + (nuevas.length ? `<optgroup label="Otras empresas activas del sistema">${nuevas.map(x=>`<option value="sis:${esc(x.id)}">${esc(x.nombre)}</option>`).join('')}</optgroup>` : '');
}
async function resolverEmpresa(v){
  if (!v || !v.startsWith('sis:')) return v || null;
  const idSis = v.slice(4), es = (EMP_SIS||[]).find(x=>String(x.id)===idSis);
  if (!es) throw toast('No encontré esa empresa en el sistema', true);
  const ex = D.empresas.find(e=>String(e.id_empresa_el)===idSis);
  if (ex) return ex.id;
  const eid = (await q(sb.from('gourmet_empresas').insert({ nombre:es.nombre, id_empresa_el:es.id, activa:true, mostrar_precios:false }).select('id').single())).id;
  const pls = D.platos.filter(p=>p.activo && !/^PRUEBA/i.test(p.nombre)).map(p=>({ empresa_id:eid, plato_id:p.id, precio:null }));
  if (pls.length) await q(sb.from('gourmet_empresa_platos').insert(pls));
  return eid;
}

  $('#setP').onclick = async () => { await api({ accion:'clave', id, password:$('#u_pass').value }); toast('Contraseña cambiada'); };
  $('#uSave').onclick = async () => {
    await q(sb.from('gourmet_usuarios').update({ nombre:$('#u_nombre').value.trim()||null, telefono:$('#u_tel').value.trim()||null, empresa_id:await resolverEmpresa($('#u_empresa').value), rol:$('#u_rol').value, activo:$('#u_activo').value==='1' }).eq('id', id), 'Usuario guardado');
    closeModal(); await loadBase(); go('usuarios'); };
  $('#uDel').onclick = e => confirmBtn(e.target, async () => { await api({ accion:'eliminar', id }); toast('Usuario eliminado'); closeModal(); await loadBase(); go('usuarios'); });
}

/* ---------------- AJUSTES ---------------- */
VIEWS.ajustes = () => {
  const c = D.config, dias = c.dias_entrega || [1,2,3,4,5];
  const nom = ['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  $('#main').innerHTML = `
    <div class="head"><div><div class="eyebrow">Configuración</div><h1>Ajustes</h1></div></div>
    <div class="group" style="max-width:640px">
      <div class="row"><div class="field"><label>Hora de corte (día anterior)</label><input type="time" class="input" id="a_hora" value="${esc(c.hora_corte||'18:00')}"></div>
        <div class="field"><label>Fechas visibles para el cliente</label><input type="number" class="input" id="a_vis" value="${c.dias_visibles||12}"></div></div>
      <div class="field"><label>Días con entrega</label><div class="checks" style="max-height:none">${[1,2,3,4,5,6,7].map(d=>`<label><input type="checkbox" class="aDia" value="${d}" ${dias.includes(d)?'checked':''}> ${nom[d]}</label>`).join('')}</div></div>
      <div class="field"><label>Feriados / días sin entrega</label><textarea class="input" id="a_fer" rows="3" placeholder="2026-12-08&#10;2026-12-25">${(c.feriados||[]).join('\n')}</textarea><small>Una fecha por línea, formato AAAA-MM-DD.</small></div>
      <button class="btn" id="aSave">Guardar ajustes</button>
    </div>
    <div class="group" style="max-width:640px"><h3>Accesos</h3>
      <p class="muted">Link para clientes: <b>${location.origin}/gourmet.html</b></p></div>`;
  $('#aSave').onclick = async () => {
    const fer = $('#a_fer').value.split(/\s+/).map(s=>s.trim()).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s));
    await q(sb.from('gourmet_config').upsert([
      { clave:'hora_corte', valor:$('#a_hora').value || '18:00' },
      { clave:'dias_visibles', valor:Number($('#a_vis').value)||12 },
      { clave:'dias_entrega', valor:$$('.aDia:checked').map(c=>Number(c.value)) },
      { clave:'feriados', valor:fer } ]), 'Ajustes guardados');
    await loadBase(); };
};

init();
</script>
</body>
</html>
