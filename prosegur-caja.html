<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Caja · Local Prosegur · Easy Lunch</title>
    <link rel="icon" type="image/png" href="/icons/facturacion.png"><link rel="apple-touch-icon" href="/icons/facturacion.png">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        html,body{height:100%;}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#0f172a;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow:hidden;}
        button,input{font:inherit;color:inherit;}
        button{cursor:pointer;}
        .app{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto 1fr;height:100vh;height:100dvh;}
        /* barra superior */
        .top{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:#0f172a;color:white;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));}
        .top img{height:30px;filter:brightness(0) invert(1);}
        .top .tit{font-weight:700;font-size:15px;line-height:1.2;}
        .top .tit small{display:block;font-weight:500;color:#94a3b8;font-size:12px;}
        .top .sp{flex:1;}
        .top .reloj{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;}
        .top .quien{font-size:12px;color:#cbd5e1;text-align:right;line-height:1.3;}
        .top .ico{background:#1e293b;border:0;color:white;border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;}
        .top .ico:active{background:#334155;}
        /* zona de productos */
        .izq{display:flex;flex-direction:column;min-height:0;min-width:0;}
        .tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;background:white;border-bottom:1px solid #e2e8f0;flex:none;}
        .tabs::-webkit-scrollbar{display:none;}
        .tab{flex:none;border:2px solid #e2e8f0;background:white;border-radius:999px;height:48px;padding:0 20px;font-size:15px;font-weight:700;color:#334155;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;}
        .tab .n{background:#f1f5f9;color:#64748b;border-radius:999px;font-size:12px;padding:2px 8px;}
        .tab.on{background:#16a34a;border-color:#16a34a;color:white;}
        .tab.on .n{background:rgba(255,255,255,.25);color:white;}
        .tab.buscar{padding:0 16px;}
        .busq{display:none;padding:10px 16px;background:white;border-bottom:1px solid #e2e8f0;}
        .busq input{width:100%;height:48px;border:2px solid #e2e8f0;border-radius:12px;padding:0 16px;font-size:17px;outline:none;}
        .busq input:focus{border-color:#16a34a;}
        .grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;align-content:start;-webkit-overflow-scrolling:touch;}
        .prod{position:relative;background:white;border:2px solid transparent;border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(15,23,42,.08);user-select:none;-webkit-user-select:none;transition:transform .08s,border-color .15s;padding:0;}
        .prod:active{transform:scale(.97);}
        .prod.sel{border-color:#16a34a;}
        .prod .foto{aspect-ratio:4/3;width:100%;object-fit:cover;background:#e2e8f0;display:block;}
        .prod .ph{aspect-ratio:4/3;width:100%;display:flex;align-items:center;justify-content:center;font-size:46px;}
        .ph.vianda{background:linear-gradient(135deg,#fef3c7,#fde68a);} .ph.postre{background:linear-gradient(135deg,#fce7f3,#fbcfe8);}
        .ph.bebida{background:linear-gradient(135deg,#dbeafe,#bfdbfe);} .ph.cafeteria{background:linear-gradient(135deg,#f5e6d3,#e7c9a4);}
        .ph.kiosco{background:linear-gradient(135deg,#ede9fe,#ddd6fe);} .ph.otro{background:linear-gradient(135deg,#e2e8f0,#cbd5e1);}
        .prod .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
        .prod .nom{font-size:14px;font-weight:600;line-height:1.3;color:#1e293b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;}
        .prod .pre{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:auto;}
        .prod .pre b{font-size:19px;font-weight:800;}
        .prod .pre s{font-size:12px;color:#94a3b8;}
        .prod .off{position:absolute;top:8px;left:8px;background:#16a34a;color:white;font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px;}
        .prod .cant{position:absolute;top:8px;right:8px;background:#0f172a;color:white;font-size:15px;font-weight:800;border-radius:999px;min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);}
        .prod.nopre{opacity:.55;}
        .prod.nopre .pre b{font-size:13px;color:#b91c1c;}
        .vacio{grid-column:1/-1;text-align:center;color:#64748b;padding:50px 20px;font-size:15px;line-height:1.5;}
        /* ticket */
        .ticket{background:white;border-left:1px solid #e2e8f0;display:flex;flex-direction:column;min-height:0;}
        .t-cab{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f1f5f9;}
        .t-cab h2{font-size:17px;font-weight:800;}
        .t-cab button{background:none;border:0;color:#dc2626;font-weight:600;font-size:14px;padding:10px;}
        .t-cab .cerrar-hoja{display:none;color:#334155;font-size:22px;}
        .items{flex:1;overflow-y:auto;padding:4px 0;}
        .item{padding:10px 16px;border-bottom:1px solid #f8fafc;}
        .item .l1{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;line-height:1.3;}
        .item .l1 span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;}
        .item .l2{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;}
        .item .unit{font-size:12px;color:#64748b;}
        .item .unit .d{color:#15803d;font-weight:600;display:block;}
        .item.mal{background:#fef2f2;}
        .item.mal .unit{color:#b91c1c;}
        .qty{display:flex;align-items:center;gap:4px;}
        .qty button{width:44px;height:44px;border-radius:12px;border:2px solid #e2e8f0;background:white;font-size:22px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;}
        .qty button:active{background:#f1f5f9;}
        .qty .n{min-width:34px;text-align:center;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
        .t-vacio{color:#94a3b8;text-align:center;padding:50px 20px;font-size:14px;line-height:1.6;}
        .tot{padding:12px 16px 16px;border-top:1px solid #e2e8f0;padding-bottom:max(16px,env(safe-area-inset-bottom));}
        .tot .f{display:flex;justify-content:space-between;font-size:14px;color:#475569;margin-bottom:4px;font-variant-numeric:tabular-nums;}
        .tot .f.desc{color:#15803d;}
        .tot .f.total{font-size:26px;font-weight:800;color:#0f172a;margin:8px 0 12px;}
        .cobrar{width:100%;height:64px;border:0;border-radius:16px;background:#16a34a;color:white;font-size:20px;font-weight:800;}
        .cobrar:active{background:#15803d;}
        .cobrar:disabled{background:#cbd5e1;}
        /* barra inferior (vertical) */
        .barra-t{display:none;}
        /* modal */
        .fondo{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
        .modal{background:white;border-radius:20px;width:100%;max-width:520px;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto;}
        .modal h2{font-size:22px;font-weight:800;margin-bottom:4px;}
        .modal .big{font-size:40px;font-weight:800;margin:6px 0 18px;font-variant-numeric:tabular-nums;}
        .medios{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        .medio{height:88px;border-radius:16px;border:2px solid #e2e8f0;background:white;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
        .medio span{font-size:28px;}
        .medio:active{background:#f8fafc;}
        .nota{background:#fff7ed;color:#9a3412;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin-top:16px;display:none;}
        .pie{display:flex;gap:10px;margin-top:18px;}
        .pie button{flex:1;height:54px;border-radius:14px;border:2px solid #e2e8f0;background:white;font-size:16px;font-weight:700;}
        .pie button.ok{background:#16a34a;border-color:#16a34a;color:white;}
        .aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:white;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center;}
        .aviso.err{background:#b91c1c;}
        .carga{position:fixed;inset:0;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#334155;font-weight:600;z-index:70;text-align:center;padding:20px;}
        .spin{width:30px;height:30px;border:3px solid #e2e8f0;border-top-color:#16a34a;border-radius:50%;animation:g .8s linear infinite;}
        @keyframes g{to{transform:rotate(360deg)}}
        :focus-visible{outline:3px solid #16a34a;outline-offset:2px;}
        /* tablet vertical / pantallas angostas: el ticket pasa a una barra abajo que se abre */
        @media (max-width:900px){
            .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;}
            .top .quien{display:none;}
            .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding-bottom:20px;}
            .ticket{position:fixed;inset:0;z-index:40;transform:translateY(100%);transition:transform .25s;border-left:0;}
            .ticket.abierto{transform:none;}
            .t-cab .cerrar-hoja{display:block;}
            .barra-t{display:flex;align-items:center;gap:12px;background:white;border-top:1px solid #e2e8f0;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));}
            .barra-t .ver{flex:1;height:60px;border:2px solid #e2e8f0;border-radius:14px;background:white;text-align:left;padding:0 14px;display:flex;flex-direction:column;justify-content:center;}
            .barra-t .ver small{color:#64748b;font-size:12px;}
            .barra-t .ver b{font-size:20px;font-variant-numeric:tabular-nums;}
            .barra-t .cobrar{width:auto;flex:1;height:60px;}
            .aviso{bottom:100px;}
        }
    </style>
</head>
<body>
<div class="carga" id="carga"><div class="spin"></div><span>Cargando la caja…</span></div>

<div class="app" id="app" style="display:none">
    <header class="top">
        <img src="/icons/logo.png" alt="Easy Lunch">
        <div class="tit">Caja<small>Local Prosegur</small></div>
        <div class="sp"></div>
        <div class="reloj" id="reloj">--:--</div>
        <div class="quien" id="quien"></div>
        <button class="ico" id="btn-full" type="button" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
        <a class="ico" href="index.html" title="Volver al panel">Panel</a>
    </header>

    <section class="izq">
        <nav class="tabs" id="tabs" role="tablist" aria-label="Categorías"></nav>
        <div class="busq" id="busq"><input type="search" id="q" placeholder="Buscar producto…" aria-label="Buscar producto" autocomplete="off"></div>
        <div class="grid" id="grid"></div>
    </section>

    <aside class="ticket" id="ticket" aria-label="Ticket">
        <div class="t-cab">
            <button class="cerrar-hoja" id="cerrar-hoja" type="button" aria-label="Cerrar ticket">⌄</button>
            <h2>Ticket</h2>
            <button id="vaciar" type="button">Vaciar</button>
        </div>
        <div class="items" id="items"></div>
        <div class="tot">
            <div class="f"><span>Subtotal</span><span id="t-sub">$0</span></div>
            <div class="f desc" id="f-desc" style="display:none"><span>Descuentos</span><span id="t-desc">$0</span></div>
            <div class="f total"><span>Total</span><span id="t-total">$0</span></div>
            <button class="cobrar" id="cobrar" type="button" disabled>Cobrar</button>
        </div>
    </aside>

    <div class="barra-t">
        <button class="ver" id="ver-ticket" type="button"><small id="bt-cant">Ticket vacío</small><b id="bt-total">$0</b></button>
        <button class="cobrar" id="cobrar2" type="button" disabled>Cobrar</button>
    </div>
</div>

<!-- cobro -->
<div class="fondo" id="m-cobro" role="dialog" aria-modal="true" aria-labelledby="mc-tit">
    <div class="modal">
        <h2 id="mc-tit">Cobrar</h2>
        <div class="big" id="mc-total">$0</div>
        <div class="medios">
            <button class="medio" data-medio="qr" type="button"><span>▦</span>QR Mercado Pago</button>
            <button class="medio" data-medio="efectivo" type="button"><span>💵</span>Efectivo</button>
        </div>
        <div class="nota" id="mc-nota">El cobro con QR y la factura electrónica se conectan en el próximo paso. Por ahora esta pantalla sirve para probar la carga del ticket y los precios.</div>
        <div class="pie">
            <button id="mc-cancelar" type="button">Volver</button>
            <button class="ok" id="mc-nueva" type="button" style="display:none">Nueva venta</button>
        </div>
    </div>
</div>
<div class="aviso" id="aviso"></div>

<script src="/prosegur-comun.js"></script>
<script>
var S={token:null,yo:null,prod:[],desc:[],cat:null,q:'',ticket:[]};  // ticket: [{id, cant}]
var EMOJI={vianda:'🍽️',postre:'🍰',bebida:'🥤',cafeteria:'☕',kiosco:'🍫',otro:'🛒'};
var $=function(id){return document.getElementById(id);};
var esc=EL.esc,plata=EL.plata;

function aviso(msg,err){var a=$('aviso');a.textContent=msg;a.className='aviso'+(err?' err':'');a.style.display='block';clearTimeout(aviso.t);aviso.t=setTimeout(function(){a.style.display='none';},3500);}
function vendibles(){return S.prod.filter(EL.enCaja);}
function porId(id){for(var i=0;i<S.prod.length;i++)if(String(S.prod[i].id)===String(id))return S.prod[i];return null;}

// ─── carga del catálogo ───
function cargar(primera){
    return EL.rpc('caja_catalogo',{p_token:S.token}).then(function(c){
        S.yo=c.yo;S.prod=c.productos||[];S.desc=c.descuentos||[];
        $('quien').innerHTML='<b>'+esc(S.yo.nombre)+'</b><br>'+(S.yo.admin?'Administrador':S.yo.encargado?'Encargado':'Cajero');
        var cats=EL.ordenCategorias(vendibles());
        if(!S.cat||(S.cat!=='__buscar'&&cats.indexOf(S.cat)===-1))S.cat=cats[0]||null;
        pintarTabs();pintarGrid();pintarTicket();
        if(primera){$('carga').style.display='none';$('app').style.display='grid';}
    });
}
function iniciar(){
    S.token=EL.token();
    if(!S.token){location.href='index.html';return;}
    try{var t=JSON.parse(sessionStorage.getItem('caja_prosegur_ticket')||'[]');if(Array.isArray(t))S.ticket=t;}catch(e){}
    cargar(true).catch(function(err){
        if(/Sesión vencida/.test(err.message)){location.href='index.html';return;}
        $('carga').innerHTML='<b>No se pudo abrir la caja</b><span style="font-weight:400">'+esc(err.message)+'</span><button class="cobrar" style="max-width:260px;height:52px;font-size:16px" onclick="location.reload()">Reintentar</button>';
    });
}

// ─── solapas ───
function pintarTabs(){
    var v=vendibles(),cats=EL.ordenCategorias(v),cuenta={};
    v.forEach(function(p){var c=p.categoria||'Otros';cuenta[c]=(cuenta[c]||0)+1;});
    $('tabs').innerHTML='<button class="tab buscar'+(S.cat==='__buscar'?' on':'')+'" data-cat="__buscar" type="button" aria-label="Buscar">🔍</button>'+
        cats.map(function(c){return '<button class="tab'+(c===S.cat?' on':'')+'" data-cat="'+esc(c)+'" type="button" role="tab">'+esc(c)+'<span class="n">'+cuenta[c]+'</span></button>';}).join('');
    $('busq').style.display=S.cat==='__buscar'?'block':'none';
}
$('tabs').addEventListener('click',function(e){
    var b=e.target.closest('.tab');if(!b)return;
    S.cat=b.getAttribute('data-cat');pintarTabs();pintarGrid();
    $('grid').scrollTop=0;
    if(S.cat==='__buscar')setTimeout(function(){$('q').focus();},30);
});
$('q').addEventListener('input',function(){S.q=this.value;pintarGrid();});

// ─── botones de productos ───
function cantEnTicket(id){for(var i=0;i<S.ticket.length;i++)if(String(S.ticket[i].id)===String(id))return S.ticket[i].cant;return 0;}
function pintarGrid(){
    var v=vendibles(),ahora=new Date(),l;
    if(S.cat==='__buscar'){
        var q=S.q.trim().toLowerCase();
        l=q?v.filter(function(p){return (p.nombre+' '+p.categoria).toLowerCase().indexOf(q)!==-1;}):[];
        if(!q){$('grid').innerHTML='<div class="vacio">Escribí para buscar entre todos los productos.</div>';return;}
    }else l=v.filter(function(p){return (p.categoria||'Otros')===S.cat;});
    if(!l.length){$('grid').innerHTML='<div class="vacio">'+(S.prod.length?'No hay productos acá.':'Todavía no hay productos cargados.<br>Se cargan desde el panel, en "Local Prosegur · Productos y precios".')+'</div>';return;}
    l.sort(function(a,b){return (a.orden-b.orden)||a.nombre.localeCompare(b.nombre,'es');});
    $('grid').innerHTML=l.map(function(p){
        var pf=EL.precioFinal(p,S.desc,ahora),src=EL.foto(p),n=cantEnTicket(p.id);
        var ph='<div class="ph '+esc(p.tipo)+'"'+(src?' style="display:none"':'')+'>'+(EMOJI[p.tipo]||'🛒')+'</div>';
        var img=(src?'<img class="foto" src="'+esc(src)+'" alt="" loading="lazy" draggable="false" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">':'')+ph;
        var off='';
        if(pf.desc)off='<span class="off">'+(pf.desc.tipo==='porcentaje'?'−'+String(Number(pf.desc.valor)).replace('.',',')+'%':'−'+plata(pf.ahorro))+'</span>';
        var pre=pf.lista==null?'<b>Sin precio</b>':(pf.desc?'<s>'+plata(pf.lista)+'</s>':'')+'<b>'+plata(pf.final)+'</b>';
        return '<button class="prod'+(n?' sel':'')+(pf.lista==null?' nopre':'')+'" data-id="'+p.id+'" type="button" aria-label="'+esc(p.nombre)+', '+(pf.final==null?'sin precio':plata(pf.final))+'">'+img+off+(n?'<span class="cant">'+n+'</span>':'')+
            '<div class="info"><div class="nom">'+esc(p.nombre)+'</div><div class="pre">'+pre+'</div></div></button>';
    }).join('');
}
$('grid').addEventListener('click',function(e){
    var b=e.target.closest('.prod');if(!b)return;
    var p=porId(b.getAttribute('data-id'));if(!p)return;
    if(EL.precioLista(p)==null){aviso('Este producto no tiene precio. Pedile al encargado que lo cargue en el panel.',true);return;}
    sumar(p.id,1);
});

// ─── ticket ───
function guardarTicket(){try{sessionStorage.setItem('caja_prosegur_ticket',JSON.stringify(S.ticket));}catch(e){}}
function sumar(id,d){
    var it=null;for(var i=0;i<S.ticket.length;i++)if(String(S.ticket[i].id)===String(id))it=S.ticket[i];
    if(!it){if(d<=0)return;it={id:id,cant:0};S.ticket.push(it);}
    it.cant+=d;
    if(it.cant<=0)S.ticket=S.ticket.filter(function(x){return x!==it;});
    if(it.cant>99)it.cant=99;
    guardarTicket();pintarTicket();pintarGrid();
}
function calcular(){
    var ahora=new Date(),lineas=[],sub=0,desc=0,malas=0;
    S.ticket.forEach(function(it){
        var p=porId(it.id),ok=p&&EL.enCaja(p)&&EL.precioLista(p)!=null;
        if(!ok){malas++;lineas.push({it:it,p:p,mal:true});return;}
        var pf=EL.precioFinal(p,S.desc,ahora);
        var l={it:it,p:p,pf:pf,lista:pf.lista*it.cant,total:Math.round(pf.final*it.cant*100)/100};
        sub+=l.lista;desc+=l.lista-l.total;lineas.push(l);
    });
    return {lineas:lineas,sub:Math.round(sub*100)/100,desc:Math.round(desc*100)/100,total:Math.round((sub-desc)*100)/100,malas:malas,
            unidades:S.ticket.reduce(function(a,b){return a+b.cant;},0)};
}
function pintarTicket(){
    var c=calcular();
    if(!c.lineas.length)$('items').innerHTML='<div class="t-vacio">Tocá un producto para agregarlo al ticket.</div>';
    else $('items').innerHTML=c.lineas.map(function(l){
        var nombre=l.p?l.p.nombre:'Producto';
        if(l.mal)return '<div class="item mal"><div class="l1"><span>'+esc(nombre)+'</span><span>—</span></div><div class="l2"><span class="unit">Ya no está disponible: quitalo del ticket</span><div class="qty"><button type="button" data-id="'+esc(l.it.id)+'" data-d="-999" aria-label="Quitar">✕</button></div></div></div>';
        return '<div class="item"><div class="l1"><span>'+esc(nombre)+'</span><span>'+plata(l.total)+'</span></div>'+
            '<div class="l2"><span class="unit">'+plata(l.pf.final)+' c/u'+(l.pf.desc?'<span class="d">'+esc(l.pf.desc.nombre)+' −'+plata(l.pf.ahorro)+'</span>':'')+'</span>'+
            '<div class="qty"><button type="button" data-id="'+esc(l.it.id)+'" data-d="-1" aria-label="Uno menos">−</button><span class="n">'+l.it.cant+'</span><button type="button" data-id="'+esc(l.it.id)+'" data-d="1" aria-label="Uno más">+</button></div></div></div>';
    }).join('');
    $('t-sub').textContent=plata(c.sub);
    $('f-desc').style.display=c.desc>0?'flex':'none';$('t-desc').textContent='−'+plata(c.desc);
    $('t-total').textContent=plata(c.total);
    var puede=c.unidades>0&&!c.malas;
    $('cobrar').disabled=!puede;$('cobrar2').disabled=!puede;
    $('cobrar').textContent=puede?'Cobrar '+plata(c.total):(c.malas?'Revisá el ticket':'Cobrar');
    $('cobrar2').textContent=puede?'Cobrar':'Cobrar';
    $('bt-cant').textContent=c.unidades?(c.unidades+' producto'+(c.unidades>1?'s':'')+' · ver ticket'):'Ticket vacío';
    $('bt-total').textContent=plata(c.total);
}
$('items').addEventListener('click',function(e){
    var b=e.target.closest('button[data-d]');if(!b)return;
    var d=Number(b.getAttribute('data-d'));
    sumar(b.getAttribute('data-id'),d===-999?-999:d);
});
$('vaciar').onclick=function(){if(!S.ticket.length)return;if(!confirm('¿Vaciar el ticket?'))return;S.ticket=[];guardarTicket();pintarTicket();pintarGrid();};
$('ver-ticket').onclick=function(){$('ticket').classList.add('abierto');};
$('cerrar-hoja').onclick=function(){$('ticket').classList.remove('abierto');};

// ─── cobro (el QR de Mercado Pago y la factura se conectan en el próximo paso) ───
function abrirCobro(){
    var c=calcular();if(!c.unidades||c.malas)return;
    $('mc-total').textContent=plata(c.total);$('mc-nota').style.display='none';$('mc-nueva').style.display='none';
    $('m-cobro').style.display='flex';
}
$('cobrar').onclick=abrirCobro;$('cobrar2').onclick=abrirCobro;
$('mc-cancelar').onclick=function(){$('m-cobro').style.display='none';};
[].forEach.call(document.querySelectorAll('.medio'),function(b){b.onclick=function(){$('mc-nota').style.display='block';$('mc-nueva').style.display='block';};});
$('mc-nueva').onclick=function(){S.ticket=[];guardarTicket();pintarTicket();pintarGrid();$('m-cobro').style.display='none';$('ticket').classList.remove('abierto');};

// ─── varios ───
function reloj(){var d=new Date();$('reloj').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
reloj();setInterval(reloj,15000);
// cada minuto se recalculan precios (descuentos por horario) y cada 5 minutos se relee el catálogo
setInterval(function(){if($('app').style.display==='grid'){pintarGrid();pintarTicket();}},60000);
setInterval(function(){if($('app').style.display==='grid')cargar(false).catch(function(){});},300000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&$('app').style.display==='grid'){cargar(false).catch(function(){});pedirWakeLock();}});
$('btn-full').onclick=function(){
    var el=document.documentElement;
    if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
    else{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}
};
// que la tablet no apague la pantalla mientras la caja está abierta
var lock=null;
function pedirWakeLock(){try{if(navigator.wakeLock&&!lock)navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){lock=null;});}).catch(function(){});}catch(e){}}
pedirWakeLock();
document.addEventListener('keydown',function(e){if(e.key==='Escape'){$('m-cobro').style.display='none';$('ticket').classList.remove('abierto');}});
iniciar();
</script>
</body>
</html>
