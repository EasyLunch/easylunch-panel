<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambios de último momento · Easy Lunch</title>
<style>
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f3f6f1;color:#1b2433}
  .c{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#1f7a3d;font-weight:600;text-align:center;padding:0 16px}
  .s{width:26px;height:26px;border:3px solid #e3efe6;border-top-color:#1f7a3d;border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  a{color:#1f7a3d}
</style>
</head>
<body>
<div class="c"><div class="s"></div><span>Abriendo cambios de último momento…</span>
<small style="font-weight:400;color:#5b6472">Si no se abre solo, <a id="l" href="#">tocá acá</a>.</small></div>
<script>
// Botón "Cambios de último momento" del sistema → app de Apps Script "Cambios de último momento".
// Se pasa tal cual lo que venga en la URL (por ejemplo ?sso=...) para que la app pueda hacer el ingreso directo.
(function () {
  var APP = 'https://script.google.com/macros/s/AKfycbw6aB1nVKYgMYSsIOkAhtaXX61zGKc-UeeK_o9jmEm1ki01-Nd8daXGxzYrbiivHAge/exec';
  var destino = APP + (location.search || '');
  document.getElementById('l').href = destino;
  location.replace(destino);
})();
</script>
</body>
</html>
