<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Producción EL">
<link rel="manifest" href="produccion.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="produccion-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="produccion-icon-180.png">
<title>Producción · Easy Lunch</title>
<style>
:root{
  --verde:#059669; --verde-osc:#047857; --verde-cl:#d1fae5;
  --tinta:#1e293b; --gris:#64748b; --borde:#e2e8f0; --fondo:#f4f6f8; --blanco:#fff;
  --ambar:#b45309; --ambar-cl:#fef3c7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}

header.top{position:sticky;top:0;z-index:20;background:var(--verde);color:#fff;padding:10px 16px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.top-row{display:flex;align-items:center;gap:10px}
.top-row img{width:34px;height:34px;border-radius:8px;background:#fff;object-fit:contain}
.top-row h1{font-size:18px;margin:0;flex:1;line-height:1.1}
.top-row h1 small{display:block;font-size:12px;font-weight:400;opacity:.85}
.icon-btn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.search{margin-top:10px;position:relative}
.search input{width:100%;border:0;border-radius:12px;padding:12px 40px;font-size:16px;outline:none}
.search .lupa{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;padding:6px 10px;opacity:.5;cursor:pointer}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--borde);background:#fff;border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.chip .n{opacity:.6;font-size:12px;margin-left:3px}
.filtros{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;color:var(--gris);font-size:13px}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--verde)}

.lista{padding:4px 16px 40px;display:grid;gap:10px}
.card{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.card:active{transform:scale(.99)}
.card .em{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.card .tx{flex:1;min-width:0}
.card .nm{font-weight:600;font-size:15px;line-height:1.25}
.card .meta{font-size:12.5px;color:var(--gris);margin-top:3px}
.card .go{color:var(--gris);font-size:20px}
.vacio{text-align:center;color:var(--gris);padding:40px 20px}
.estado{margin:12px 16px 0;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--ambar-cl);color:var(--ambar)}

#detalle{position:fixed;inset:0;z-index:30;background:var(--fondo);overflow-y:auto;-webkit-overflow-scrolling:touch}
.det-head{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--borde);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.det-row{display:flex;gap:10px;align-items:flex-start}
.back{border:0;background:var(--fondo);border-radius:10px;width:40px;height:40px;font-size:20px;flex:0 0 40px;cursor:pointer}
.det-title{flex:1;min-width:0}
.det-title h2{font-size:17px;margin:2px 0 6px;line-height:1.25}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--fondo);color:var(--tinta);font-weight:500}
.badge.tray{background:var(--tinta);color:#fff}
.badge.tray.cl{background:#e0f2fe;color:#075985}
.badge.env{background:#f3e8ff;color:#7e22ce}
.porc{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.porc label{font-size:13px;color:var(--gris);font-weight:600}
.stepper{display:flex;align-items:center;border:1px solid var(--borde);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:var(--fondo);width:36px;height:38px;font-size:20px;cursor:pointer}
.stepper input{width:52px;border:0;text-align:center;font-size:18px;font-weight:700;height:40px;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick{display:flex;gap:6px}
.quick button{border:1px solid var(--borde);background:#fff;border-radius:9px;padding:7px 9px;font-size:13px;cursor:pointer}
.quick button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.tabs{display:flex;gap:4px;margin-top:10px;background:var(--fondo);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--gris);cursor:pointer}
.tabs button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.det-body{padding:14px 16px 60px;display:grid;gap:14px}
.box{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:14px}
.box h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.box h3 .sub{font-weight:400;color:var(--gris);font-size:12.5px;margin-left:auto;text-align:right}
.ilus svg{width:100%;height:auto;display:block}
.foto{margin:-14px -14px 12px;position:relative;background:#eee;border-radius:14px 14px 0 0;overflow:hidden;aspect-ratio:3/2}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .cap{position:absolute;left:8px;bottom:8px;right:8px;font-size:11.5px;color:#fff;background:rgba(15,23,42,.62);padding:4px 8px;border-radius:8px;line-height:1.3}
.emp img{width:100%;border-radius:12px;display:block}
.emp .vacia{border:2px dashed var(--borde);border-radius:12px;padding:22px 14px;text-align:center;color:var(--gris);font-size:14px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn.pri{background:var(--verde);color:#fff}
.btn.sec{background:var(--fondo);color:var(--tinta)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{flex:1}
.badge.cam{background:#dcfce7;color:#166534}
.escena{background:linear-gradient(180deg,#f7f3ec 0%,#ebe2d3 100%);border-radius:12px;padding:6px 4px}
.ref{display:grid;gap:6px;margin-top:10px}
.ref div{display:flex;align-items:center;gap:8px;font-size:14px}
.ref .pin{flex:0 0 22px;height:22px;border-radius:50%;background:var(--tinta);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.ref .nm{flex:1}
.ref .g{font-weight:700;color:var(--verde-osc);white-space:nowrap}
.nota{font-size:12.5px;color:var(--gris);margin-top:8px;line-height:1.4}
.pasos{margin:0;padding:0;list-style:none;counter-reset:p}
.pasos li{counter-increment:p;position:relative;padding:8px 0 8px 40px;border-top:1px solid var(--borde);line-height:1.4;font-size:15px}
.pasos li:first-child{border-top:0}
.pasos li::before{content:counter(p);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--verde);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.pasos b{white-space:nowrap}
.texto-receta{white-space:pre-wrap;line-height:1.5;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--fondo);border-radius:12px;padding:10px;text-align:center}
.kpi .v{font-size:18px;font-weight:700}
.kpi .l{font-size:11.5px;color:var(--gris);margin-top:2px}
.tabla{width:100%;border-collapse:collapse;font-size:14.5px}
.tabla th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--gris);text-align:right;font-weight:600;padding:4px 4px 6px;border-bottom:1px solid var(--borde)}
.tabla th:first-child{text-align:left}
.tabla td{padding:10px 4px;border-bottom:1px solid var(--borde);text-align:right;vertical-align:top}
.tabla td:first-child{text-align:left}
.tabla tr:last-child td{border-bottom:0}
.tabla .num{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.tabla .cat td{padding-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--gris);font-weight:700;text-align:left}
.prep{border:1px solid var(--borde);border-radius:12px;margin-top:10px;overflow:hidden}
.prep summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:10px;background:#fafbfc}
.prep summary::-webkit-details-marker{display:none}
.prep summary .pn{flex:1;font-weight:600;font-size:14.5px}
.prep summary .pn small{display:block;font-weight:400;color:var(--gris);font-size:12px}
.prep summary .pt{font-weight:700;color:var(--verde-osc);white-space:nowrap}
.prep summary .ar{color:var(--gris);transition:transform .15s}
.prep[open] summary .ar{transform:rotate(90deg)}
.prep .pb{padding:4px 12px 10px}
.envasado{text-align:center;padding:24px 14px}
.envasado .ic{font-size:54px}
.envasado .big{font-size:22px;font-weight:700;margin:6px 0}
.loading{display:grid;place-items:center;padding:60px 20px;color:var(--gris);gap:12px}
.spin{width:30px;height:30px;border:3px solid var(--borde);border-top-color:var(--verde);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (min-width:720px){ .lista{grid-template-columns:1fr 1fr} .det-body{max-width:760px;margin:0 auto} .det-head>*{max-width:728px;margin-left:auto;margin-right:auto} }
</style>
</head>
<body>

<!-- Filtros SVG compartidos por todas las ilustraciones (texturas de comida) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="fx-crumb" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="4" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="1.5" lighting-color="#fff" result="l"><feDistantLight azimuth="225" elevation="58"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceGraphic" operator="arithmetic" k1="1.2" result="m"/>
      <feComposite in="m" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="fx-bump" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".16" numOctaves="3" seed="9" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="2.2" lighting-color="#fff" result="l"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceGraphic" operator="arithmetic" k1="1.25" result="m"/>
      <feComposite in="m" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="fx-fine" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="1" seed="2" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="1.1" lighting-color="#fff" result="l"><feDistantLight azimuth="225" elevation="60"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceGraphic" operator="arithmetic" k1="1.14" result="m"/>
      <feComposite in="m" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="fx-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="fx-blur1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
</svg>

<header class="top">
  <div class="top-row">
    <img src="produccion-icon-192.png" alt="" onerror="this.style.display='none'">
    <h1>Guía de producción<small id="sub-head">Easy Lunch · cocina</small></h1>
    <button class="icon-btn" id="btn-refresh" title="Actualizar recetas">⟳</button>
  </div>
  <div class="search">
    <span class="lupa">🔍</span>
    <input id="q" type="search" placeholder="Buscar plato… (ej: wrap cesar)" autocomplete="off">
    <button class="clear hidden" id="q-clear" aria-label="Borrar">✕</button>
  </div>
</header>

<div class="chips" id="chips"></div>
<div class="filtros">
  <span id="contador"></span>
  <label class="toggle"><input type="checkbox" id="solo-rot" checked> Solo en rotación</label>
</div>
<div id="estado"></div>
<div class="lista" id="lista"><div class="loading"><div class="spin"></div>Cargando recetas…</div></div>

<input type="file" id="cam" accept="image/*" capture="environment" class="hidden">
<div id="detalle" class="hidden">
  <div class="det-head">
    <div class="det-row">
      <button class="back" id="btn-back" aria-label="Volver">←</button>
      <div class="det-title">
        <h2 id="d-nombre"></h2>
        <div class="badges" id="d-badges"></div>
      </div>
    </div>
    <div class="porc">
      <label style="min-width:66px">Regulares</label>
      <div class="stepper">
        <button id="p-menos" aria-label="Menos">−</button>
        <input id="p-n" type="number" inputmode="numeric" min="0" value="1">
        <button id="p-mas" aria-label="Más">+</button>
      </div>
      <div class="quick" id="quick"></div>
    </div>
    <div class="porc" style="margin-top:4px">
      <label style="min-width:66px">XL <small style="font-weight:600;color:var(--ambar)">+30%</small></label>
      <div class="stepper">
        <button id="px-menos" aria-label="Menos XL">−</button>
        <input id="px-n" type="number" inputmode="numeric" min="0" value="0">
        <button id="px-mas" aria-label="Más XL">+</button>
      </div>
      <div class="quick" id="quickxl"></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-t="armado" class="on">🧩 Armado</button>
      <button data-t="ingredientes">⚖️ Ingredientes</button>
      <button data-t="total">🧾 Producción</button>
    </div>
  </div>
  <div class="det-body" id="d-body"></div>
</div>

<script>
/* =====================================================================
   Easy Lunch · Guía de producción (produccion.html)
   Lee el recetario en vivo desde la misma base Supabase que recetario.html.
   La URL y la clave pública se toman automáticamente de recetario.html.
   Si alguna vez querés fijarlas acá, completá estas dos constantes:
   ===================================================================== */
const SB_MANUAL  = ''   // ej: 'https://xxxx.supabase.co/rest/v1'
const KEY_MANUAL = ''   // clave anon pública

const CACHE_KEY = 'el_produccion_cache_v1'
const FOTOS_URL = 'https://app.easylunch.com.ar/server/traer-tabla-por-id.php?tabla=platos&id=0&order=DESC&by=id'  // fotos del sistema de pedidos
const FOTOS_KEY = 'el_produccion_fotos_v1'
let fotosSis = []
const EMP_VARS = [ { v:'reg', l:'Regular', suf:'' }, { v:'xl', l:'XL', suf:'::xl' }, { v:'hit', l:'HIT', suf:'::hit' } ]
const empKey = (id, v) => id + ((EMP_VARS.find(x => x.v === v) || EMP_VARS[0]).suf)
const tieneEmp = id => EMP_VARS.some(x => empIds[id + x.suf])
let empVar = 'reg'
let empIds = {}, empCache = {}, empPrevia = null, empGuardando = false   // fotos del emplatado real (tabla fotos_emplatado)
const PESO = new Set(['g','kg','ml','lt'])
const TIPOS = [
  { v:'clasico',     l:'Clásico',     e:'🍽', c:'#dbeafe' },
  { v:'vegetariano', l:'Vegetariano', e:'🌿', c:'#dcfce7' },
  { v:'ensalada',    l:'Ensalada',    e:'🥗', c:'#ecfccb' },
  { v:'sandwich',    l:'Sándwich',    e:'🥪', c:'#fef9c3' },
  { v:'wrap',        l:'Wrap',        e:'🌯', c:'#fef3c7' },
  { v:'tarta',       l:'Tarta',       e:'🥧', c:'#ffedd5' },
  { v:'postre',      l:'Postre',      e:'🍮', c:'#fce7f3' },
  { v:'sin-tacc',    l:'Sin TACC',    e:'🌾', c:'#f3e8ff' },
]
const TIPO_MAP = Object.fromEntries(TIPOS.map(t => [t.v, t]))
const PROT = { vegetariano:'🌿 Vegetariano', vacuna:'🥩 Vacuna', cerdo:'🐷 Cerdo', pollo:'🍗 Pollo', pescado:'🐟 Pescado', cordero:'🐑 Cordero', otra:'📋 Otra' }

let platos = [], insMap = {}, srMap = {}
let filtroTipo = 'todos', N = 1, NXL = 0, tabActual = 'armado', platoActual = null, wakeLock = null

const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
const toG = (c, u) => (u === 'kg' || u === 'lt') ? c * 1000 : c
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))

function fmtG(g, liq){
  if(!isFinite(g)) return '–'
  const a = Math.abs(g)
  if(a >= 1000){ const k = g / 1000; return (a >= 10000 ? k.toFixed(1) : k.toFixed(2)).replace('.', ',').replace(/,?0+$/, '') + (liq ? ' l' : ' kg') }
  if(a > 0 && a < 10) return (Math.round(g * 10) / 10).toString().replace('.', ',') + (liq ? ' ml' : ' g')
  return Math.round(g) + (liq ? ' ml' : ' g')
}
const fmtU = n => (Math.round(n * 100) / 100).toString().replace('.', ',')

/* ---------- Conexión ---------- */
let SB = SB_MANUAL, KEY = KEY_MANUAL
async function config(){
  if(SB && KEY) return
  const html = await fetch('recetario.html', { cache:'no-store' }).then(r => r.text())
  const a = html.match(/const\s+SB\s*=\s*['"`]([^'"`]+)['"`]/)
  const b = html.match(/const\s+KEY\s*=\s*['"`]([^'"`]+)['"`]/)
  if(!a || !b) throw new Error('No encontré la conexión a Supabase en recetario.html. Completá SB_MANUAL y KEY_MANUAL en produccion.html.')
  SB = a[1]; KEY = b[1]
}
async function sbGet(q){
  const r = await fetch(`${SB}/${q}`, { headers:{ apikey:KEY, Authorization:'Bearer ' + KEY } })
  if(!r.ok) throw new Error(await r.text())
  return r.json()
}
/* ---------- Fotos del sistema de pedidos (app.easylunch.com.ar) ---------- */
const STOP = new Set('con de del la las el los y al a en e o un una por sin para mini salad dia super'.split(' '))
const FORMAS = ['milanesa','mila','wok','guiso','tarta','burger','hamburguesa','sandwich','wrap','ensalada','canelon','cubo','medallon','albondiga','pastel','mechada','carbonada','carbonara','noqui','crepe','creppe','burrito','taco','brochette','nugget','stick','pan','bowl','lasagna','sorrentino','raviol','flan','gelatina','torta','alfajor','brownie','budin','bondiola','suprema','pechuga','envoltini','parmig','strogonoff','bourguignon','pollo']
const CLAVES = ['pollo','cerdo','ternera','pescado','cordero','veggie']
const SINON = { pechuga:'pollo', suprema:'pollo', carne:'ternera', vacuna:'ternera', bondiola:'cerdo', merluza:'pescado', brotola:'pescado', salmon:'pescado', atun:'pescado', abadejo:'pescado', vegetariano:'veggie', vegetariana:'veggie', qiunoa:'quinoa', milas:'milanesa', parmiggiana:'parmigiana' }
const tokens = s => norm(s).replace(/[^a-z0-9ñ ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !STOP.has(w)).map(w => SINON[w] || w).map(w => w.replace(/(es|s)$/, ''))
const presentes = (t, lista) => new Set(lista.filter(k => [...t].some(w => w.startsWith(k.replace(/(es|s)$/, '')))))
const igualSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x))
function prepararFotos(lista){
  fotosSis = (lista || []).filter(x => x && x.img && !/^\s*xl\b/i.test(x.nombre || '')).map(x => { const t = new Set(tokens(x.nombre)); return { nombre: String(x.nombre).trim(), img: x.img, t, cl: presentes(t, CLAVES), fo: presentes(t, FORMAS) } })
}
function fotoDe(p){
  if(!fotosSis.length) return null
  if(p._foto !== undefined) return p._foto
  const t = new Set(tokens(p.nombre)), cl = presentes(t, CLAVES), fo = presentes(t, FORMAS)
  let best = null, bs = 0
  for(const f of fotosSis){
    let inter = 0; t.forEach(w => { if(f.t.has(w)) inter++ })
    const sc = inter / ((t.size + f.t.size - inter) || 1)
    if(sc <= bs) continue
    if(sc < .99 && (!igualSet(cl, f.cl) || (fo.size && f.fo.size && ![...fo].some(x => f.fo.has(x))))) continue
    bs = sc; best = f
  }
  return p._foto = (best && bs >= .5) ? { img: best.img, nombre: best.nombre, exacta: bs >= .99 } : null
}

function comprimir(file){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image()
    img.onload = () => {
      const max = 1100, k = Math.min(1, max / Math.max(img.width, img.height))
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k)

function visDe(nombre, cat, fam){
  const n = norm(nombre)
  if(/^(salsa|aderezo|mayonesa|mayo\b|alioli|dip|pesto|chimichurri|vinagreta|hummus|babaganush)/.test(n)){
    for(const [re, k] of REGLAS) if(VIS[k].rol === 'salsa' && re.test(n)) return { k, ...VIS[k] }
    return { k:'salsa', ...VIS.salsa }
  }
  for(const [re, k] of REGLAS) if(re.test(n)) return { k, ...VIS[k] }
  const k = CAT_VIS[norm(cat)] || FAM_VIS[norm(fam)] || 'otro'
  return { k, ...VIS[k] }

const esPackNombre = (n, cat) => /packaging|film|bandeja|descartable|servilleta|cubiert|tenedor|etiqueta|bolsa|tapa plastica|^\s*10[2-5]\s*$|^\s*445\s*$|ensaladera|potecito/.test(norm(n)) || /descartables/.test(norm(cat))
const esCupNombre = n => /\bdip\b|pote|vasito|ramekin/.test(norm(n))
const esCondimento = (n, cat) => /condimento/.test(norm(cat)) || /^(sal|pimienta|oregano|aceite|ajo en polvo|pimenton|comino|nuez moscada|aji molido|provenzal|vinagre)\b/.test(norm(n))

/* =====================================================================
   Cálculo: se usan SIEMPRE los gramajes tal como figuran en la receta
   ===================================================================== */
function lineaIns(ins, cant, unidad){
  const nombre = String(ins.nombre || '').trim()
  const base = { ins, id: ins.id, nombre, cat: ins.categoria,
    pack: esPackNombre(nombre, ins.categoria) || esCupNombre(nombre), cup: esCupNombre(nombre), cond: esCondimento(nombre, ins.categoria) }
  if(PESO.has(unidad)) return { ...base, peso:true, liq: unidad === 'ml' || unidad === 'lt', g: toG(cant, unidad) }
  return { ...base, peso:false, unidades:cant, g: cant * (+ins.gramaje || 0) }
}
function factorSub(sr, cant, unidad){
  const ru = sr.unidad_rendimiento || 'unidad', rend = +sr.rendimiento || 1
  const lote = () => sr.ingredientes.reduce((s, si) => { const ins = insMap[si.insumo_id]; if(!ins) return s; const l = lineaIns(ins, si.cantidad, si.unidad); return s + (l.pack ? 0 : l.g) }, 0)
  if(PESO.has(unidad)){
    const need = toG(cant, unidad)
    if(PESO.has(ru)) return need / toG(rend, ru)
    if(+sr.gramaje_unidad) return need / (+sr.gramaje_unidad * rend)
    const b = lote(); return b > 0 ? need / b : 1
  }
  if(!PESO.has(ru)) return cant / rend
  if(+sr.gramaje_unidad) return (cant * sr.gramaje_unidad) / toG(rend, ru)
  return cant / rend
}
function analizar(p){
  const porc = +p.porciones || 1, comps = []
  for(const ing of p.ingredientes){
    const cant = (+ing.cantidad || 0) / porc
    if(ing.tipo === 'insumo'){
      const ins = insMap[ing.ref_id]
      if(!ins){ comps.push({ tipo:'falta', nombre:'(insumo borrado)' }); continue }
      const l = lineaIns(ins, cant, ing.unidad)
      comps.push({ tipo:'ins', rowId: ing.id, nombre:l.nombre, line:l, g:l.g, pack:l.pack, cup:l.cup, cond:l.cond, vis: visDe(l.nombre, ins.categoria) })
    } else {
      const sr = srMap[ing.ref_id]
      if(!sr){ comps.push({ tipo:'falta', nombre:'(sub-receta borrada)' }); continue }
      const f = factorSub(sr, cant, ing.unidad)
      const lines = sr.ingredientes.map(si => { const ins = insMap[si.insumo_id]; if(!ins) return null
        const l = lineaIns(ins, (+si.cantidad || 0) * f, si.unidad)
        if(l.cup && !l.peso) l.unidades = Math.max(1, Math.ceil(l.unidades - 1e-6))
        return l }).filter(Boolean)
      const food = lines.filter(l => !l.pack)
      const nombre = String(sr.nombre || '').trim()
      const pack = /packaging|descartable/.test(norm(nombre)) || (lines.length > 0 && food.length === 0)
      let g
      if(PESO.has(ing.unidad)) g = toG(cant, ing.unidad)
      else if(+sr.gramaje_unidad) g = cant * sr.gramaje_unidad
      else g = food.reduce((s, l) => s + l.g, 0)
      const expand = !pack && !PESO.has(ing.unidad) && norm(sr.familia) === 'base'
      comps.push({ tipo:'sub', rowId: ing.id, nombre, sr, f, lines, g, pack, cup: lines.some(l => l.cup), expand,
        cantTxt: PESO.has(ing.unidad) ? fmtG(toG(cant, ing.unidad)) : fmtU(cant) + ' u.', vis: visDe(nombre, '', sr.familia) })
    }
  }
  const packs = comps.filter(c => c.pack)
  let bandeja = null
  for(const c of packs){
    const n = norm(c.nombre), m = n.match(/(\d{3})/)
    if(/ensaladera/.test(n)){ bandeja = { txt:'Ensaladera', tipo:'bowl' }; break }
    if(m){ bandeja = { txt:'Bandeja ' + m[1], num:m[1], negra: m[1] === '445' }; break }
    const m2 = (c.lines || []).map(l => norm(l.nombre)).join(' ').match(/\b(10[2-5]|445)\b/)
    if(m2){ bandeja = { txt:'Bandeja ' + m2[1], num:m2[1], negra: m2[1] === '445' }; break }
  }
  const film = packs.some(c => /film/.test(norm(c.nombre)) || (c.lines || []).some(l => /film/.test(norm(l.nombre))))
  const pesoVianda = comps.filter(c => !c.pack && c.tipo !== 'falta').reduce((s, c) => s + (c.g || 0), 0)
  const n = norm(p.nombre)
  const envasado = p.tipo === 'sin-tacc' && !bandeja
  const guarnicion = !bandeja && !envasado && /guarnicion/.test(n)
  let layout = 'tray'
  if(envasado) layout = 'envasado'
  else if(p.tipo === 'wrap' || /\bwrap\b/.test(n)) layout = 'wrap'
  else if(p.tipo === 'sandwich' || /sandwich|tostado|focaccia|baguet|ciabatta/.test(n)) layout = 'sandwich'
  else if(p.tipo === 'ensalada' || /^ensalada|bowl/.test(n) || (bandeja && bandeja.tipo === 'bowl')) layout = 'bowl'
  else if(p.tipo === 'postre') layout = 'postre'
  return { comps, bandeja, film, pesoVianda, layout, envasado, guarnicion }
}

/* Lo que se ve en el plato: ingredientes de la base expandidos */
function piezas(a){
  const out = []
  for(const c of a.comps){
    if(c.pack || c.tipo === 'falta') continue
    if(c.tipo === 'sub' && c.expand){
      for(const l of c.lines){ if(l.pack || l.cond) continue
        out.push({ nombre:l.nombre, g:l.g, u: l.peso ? null : l.unidades, liq:l.liq, vis: visDe(l.nombre, l.cat), sub:false, cup:false }) }
    } else if(c.tipo === 'sub'){
      out.push({ nombre:c.nombre, g:c.g, vis:c.vis, sub:true, cup:c.cup, fam: norm(c.sr.familia), lines:c.lines })
    } else {
      if(c.cond) continue
      out.push({ nombre:c.nombre, g:c.g, u: c.line.peso ? null : c.line.unidades, liq:c.line.liq, vis:c.vis, sub:false, cup:c.cup })
    }
  }
  out.forEach(x => x.txt = x.u != null ? (fmtU(x.u) + ' u.') : fmtG(x.g, x.liq))
  return out
}

/* =====================================================================
   MOTOR DE ILUSTRACIÓN (estilo realista, perspectiva 3/4)
   ===================================================================== */
function rng(seedStr){
  let h = 1779033703 ^ seedStr.length
  for(let i = 0; i < seedStr.length; i++){ h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19 }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296 }
}
let uidN = 0
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16)
  const f = v => clamp(v + amt, 0, 255)
  return '#' + ((1 << 24) + (f(n >> 16) << 16) + (f(n >> 8 & 255) << 8) + f(n & 255)).toString(16).slice(1)
}
const F = v => (+v).toFixed(1)
function Ctx(seed){
  const c = { defs:'', cache:{}, r: rng(seed) }
  c.R = (a, b) => a + c.r() * (b - a)
  c.pick = arr => arr[Math.floor(c.r() * arr.length) % arr.length]
  c.lg = (c1, c2, vert = true) => { const k = 'l' + c1 + c2 + vert; if(c.cache[k]) return c.cache[k]; const id = 'g' + (++uidN)
    c.defs += `<linearGradient id="${id}" x1="0" y1="0" x2="${vert ? 0 : 1}" y2="${vert ? 1 : 0}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`; return c.cache[k] = `url(#${id})` }

/* ---- tipos de comida → cómo se dibuja cada uno ---- */
const VEG_MIX = ['#7fb04a', '#d8392b', '#8e3b7f', '#f0a03c', '#e9d38f', '#4c7f2e']
function tipoDibujo(nombre, vis){
  const n = norm(nombre)
  if(/albondiga/.test(n)) return 'bolas'
  if(/hamburguesa|burger|medallon|falafel|croqueta|bocadito|patty/.test(n)) return 'medallon'
  if(/desmechad|pulled|deshilachad|ropa vieja/.test(n)) return 'desmechado'
  if(/canelon|lasagn|crepe|creppe|panqueque|envoltini|enrollado|arrollado|burrito|taco/.test(n)) return 'rollos'
  if(/guiso|estofad|cazuela|curry|goulash|bourguignon|ragu|osobuco/.test(n)) return 'guiso'
  if(/pan de carne|matambre|pastel|tortilla de papa|frittata|budin|souffle|parmig|gratin|lasa|moussaka|musaka|en capas/.test(n)) return 'horno'
  if(/cubo|dado|brochette|salteado|wok/.test(n) && vis.rol === 'prot') return 'cubos'
  if(/pure/.test(n)) return 'pure'
  if(vis.k === 'queso' && /cremoso|tybo|danbo|mozzarella|muzza|cheddar|gouda|fontina|pategras|maquina/.test(n)) return 'quesoFeta'
  if(vis.k === 'verdura' && !/vegetal|verdura|wok|salteado|asad|guarnic|ratatouille|caponata|mix/.test(n)) return /brocoli|coliflor/.test(n) ? 'brocoli' : 'cubos'
  return ({ tortilla:'tortilla', pan:'pan', masa:'tarta', tarta:'tarta', hoja:'hojas', rucula:'hojas', tomate:'tomate', zanahoria:'palitos', verdeo:'palitos',
    cebolla:'aros', palta:'cubos', choclo:'granos', morron:'palitos', verdura:'mixVeg', hongo:'cubos', remolacha:'cubos', huevo:'huevo',
    pollo:'fetas', cerdo:'fetas', carne:'fetas', cordero:'fetas', jamon:'jamon', pescado:'milanesa', milanesa:'milanesa', queso:'virutas', quesoB:'pure',
    salsa:'salsa', bbq:'salsa', roja:'salsa', verdeS:'salsa', mostaza:'salsa', blanca:'salsa', arroz:'arroz', legumbre:'legumbres', papa:'cubos', batata:'cubos',
    calabaza:'cubos', pure:'pure', pasta:'penne', aceituna:'legumbres', limon:'limon', postre:'pure', otro:'monticulo' })[vis.k] || 'monticulo'
}
const INTERIOR = { pollo:'#f7ead6', cerdo:'#f0d9c6', carne:'#b8654a', cordero:'#c47a5e' }

/* Dibuja un tipo de comida dentro de un área. Devuelve { bed, items[] } */
function dibujarTipo(c, t, a, v, share, principal){
  const A = superficie(a) * share, col = v.f, items = []
  let bed = ''
  const P = () => punto(c, a)
  switch(t){
    case 'arroz': {
      if(principal) bed = cama(c, a, '#ece4cf', 1)
      const n = clamp(A / 6, 20, 700)
      for(let i = 0; i < n; i++){ const [x, y] = P(); items.push(It(y - 50, grano(c, x, y, i % 9 ? '#fdfaf2' : '#efe6cf'))) }
      break }
    case 'legumbres': {
      if(principal) bed = cama(c, a, shade(col, -20), .8)
      const n = clamp(A / 55, 6, 160)
      for(let i = 0; i < n; i++){ const [x, y] = P(); items.push(It(y, esfera(c, x, y, c.R(3.4, 4.6), v.k === 'aceituna' ? '#3f4a2c' : col))) }
      break }
    case 'granos': {
      const n = clamp(A / 28, 6, 160)
      for(let i = 0; i < n; i++){ const [x, y] = P(); items.push(It(y, `<rect x="${F(x - 2.2)}" y="${F(y - 1.8)}" width="4.4" height="3.6" rx="1.4" fill="${c.rg('#fde68a', '#d99e0b')}"/>`)) }
      break }
    case 'cubos': case 'mixVeg': {
      const paleta = t === 'mixVeg' ? VEG_MIX : (v.rol === 'prot' ? [shade(col, -30), shade(col, -15), col] : [col, shade(col, 8), shade(col, -8)])
      if(principal) bed = cama(c, a, t === 'mixVeg' ? '#8a6a3a' : shade(paleta[0], -30), .35)

/* Qué mezcla de tipos lleva un componente (ej. mini salad = hojas + tomate + zanahoria) */
function mezcla(pz){
  const base = { t: pz.forz || tipoDibujo(pz.nombre, pz.vis), v: { ...pz.vis, _n: pz.forz ? (pz._pn || pz.nombre) : pz.nombre }, share: 1 }
  if(pz.lines && ['mixVeg', 'hojas', 'monticulo'].includes(base.t)){
    const grupos = {}
    pz.lines.filter(l => !l.pack && !l.cond && l.g > 0).forEach(l => {
      const v = visDe(l.nombre, l.cat), t = tipoDibujo(l.nombre, v)
      if(t === 'salsa') return
      const k = t + v.k; (grupos[k] ||= { t, v, g:0 }).g += l.g
    })
    const arr = Object.values(grupos), tot = arr.reduce((s, x) => s + x.g, 0)
    if(arr.length >= 2 && tot > 0) return arr.sort((x, y) => y.g - x.g).slice(0, 4).map(x => ({ t:x.t, v:x.v, share: Math.max(.2, x.g / tot) }))
  }
  return [base]
}
function dibujarZona(c, mix, a){
  let bed = ''; const items = []
  mix.forEach((m, i) => { const r = dibujarTipo(c, m.t, a, m.v, m.share, i === 0); if(i === 0) bed += r.bed; items.push(...r.items) })
  items.sort((x, y) => x.y - y.y)
  return bed + items.map(i => i.s).join('')
}

function wrapMitad(c, cx, cy, L, r, ang, rellenos){
  const T = '#e7c78c'
  let o = `<g transform="rotate(${F(ang)} ${F(cx)} ${F(cy)})">`
  o += `<ellipse cx="${F(cx + 3)}" cy="${F(cy + r * .95)}" rx="${F(L * .55)}" ry="${F(r * .35)}" fill="#000" opacity=".25" filter="url(#fx-blur)"/>`

  for(let i = 0; i < 10; i++) o += `<ellipse cx="${F(cx - L / 2 + r + c.r() * (L - r * 2))}" cy="${F(cy - r * .6 + c.r() * r * 1.1)}" rx="${F(c.R(2, 4.5))}" ry="${F(c.R(1.2, 2.4))}" fill="#8a5a22" opacity=".45"/>`
  o += `<path d="M${F(cx - L / 2 + r * .6)} ${F(cy - r * .5)} Q${F(cx)} ${F(cy - r * .9)} ${F(cx + L / 2 - r * .3)} ${F(cy - r * .6)}" stroke="#fff" stroke-width="2.2" opacity=".35" fill="none"/>`
  const ex = cx + L / 2 - r * .35, rx = r * .62
  o += `<ellipse cx="${F(ex)}" cy="${F(cy)}" rx="${F(rx)}" ry="${F(r * .98)}" fill="${shade(T, -10)}" stroke="${shade(T, -50)}" stroke-width="1"/>`
  const cols = rellenos.length ? rellenos : ['#5aa845', '#d9a066']
  cols.slice(0, 4).forEach((col, j) => { const k = .82 - j * .18; o += `<path d="${blob(c, ex, cy, rx * k, r * .95 * k, .2)}" fill="${c.rg(shade(col, 25), shade(col, -20))}"/>` })
  o += `<path d="M${F(ex)} ${F(cy)} q${F(rx * .3)} ${F(-r * .25)} ${F(rx * .45)} 0 t${F(-rx * .8)} ${F(r * .2)} t${F(rx * 1.2)} ${F(-r * .5)}" stroke="${shade(T, 10)}" stroke-width="2" fill="none" opacity=".9"/>`
  return o + `</g>`
}
function sandwichMitad(c, cx, cy, s, ang, rellenos){
  const P = '#d99a4e', M = '#f6e2b8'
  let o = `<g transform="rotate(${F(ang)} ${F(cx)} ${F(cy)})"><ellipse cx="${F(cx + 3)}" cy="${F(cy + s * .5)}" rx="${F(s)}" ry="${F(s * .25)}" fill="#000" opacity=".25" filter="url(#fx-blur)"/>`

  let y = cy + s * .35
  const capas = [M].concat(rellenos.slice(0, 3)).concat([M])
  capas.forEach((col, i) => { const hh = (i === 0 || i === capas.length - 1) ? 5 : 4; o += `<rect x="${F(cx - s)}" y="${F(y)}" width="${F(s * 2)}" height="${hh}" fill="${col}"/>`; y += hh })
  o += `<rect x="${F(cx - s)}" y="${F(y)}" width="${F(s * 2)}" height="3" fill="${shade(P, -20)}"/>`
  return o + `</g>`
}

  extras.forEach((e, i) => {
    const x = fx + fw - 34 - i * 62, y = fy + fh - 26
    s += e.tipo === 'cup' ? pote(c, x, y, 21, e.vis.f) : limonGajo(c, x, y + 6, 16)
    pins.push([x, y - 18])
  })
  pins.forEach(([x, y], i) => s += pinSvg(x, y, i + 1))
  return `<svg viewBox="0 0 ${W} ${TY + TH + 26}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bandeja armada"><defs>${c.defs}</defs>${s}</svg>`
}

/* ---- Vista explotada (wrap / sándwich / postre) ---- */
function svgCapas(capas){
  const c = Ctx('s' + capas.map(x => x.nombre).join('|'))
  const esp = 56, W = 360, cx = 116, H = capas.length * esp + 60
  let s = ''
  capas.forEach((cp, i) => {
    const cy = H - 34 - i * esp, v = cp.vis, t = cp.top ? 'panTapa' : tipoDibujo(cp.nombre, v)
    const molde = /molde|lactal/.test(norm(cp.nombre))
    const rx = t === 'tortilla' ? 104 : (t === 'pan' || t === 'panTapa' ? 92 : 88), ry = rx * .3
    s += `<ellipse cx="${cx + 4}" cy="${F(cy + ry * .9)}" rx="${F(rx * .92)}" ry="${F(ry * .45)}" fill="#000" opacity=".16" filter="url(#fx-blur)"/>`
    if((t === 'pan' || t === 'panTapa') && molde){
      const w = 84, hh = 30, q = `M${cx - w} ${cy - hh * .2} Q${cx - w} ${cy - hh} ${cx - w + 14} ${cy - hh} L${cx + w - 6} ${cy - hh} Q${cx + w + 6} ${cy - hh} ${cx + w} ${cy} L${cx + w - 10} ${cy + hh * .7} Q${cx + w - 12} ${cy + hh} ${cx + w - 26} ${cy + hh} L${cx - w + 14} ${cy + hh} Q${cx - w - 4} ${cy + hh} ${cx - w} ${cy + hh * .4}Z`
      s += `<path d="${q}" fill="#b07a3c" transform="translate(0 5)"/><path d="${q}" fill="#c88a45"/><path d="${q}" fill="${c.rg('#fbf3df', '#efdcb4')}" transform="translate(${cx * .06} ${cy * .08}) scale(.94 .92)" filter="url(#fx-crumb)"/>`
    } else if(t === 'tortilla'){
      const d = blob(c, cx, cy, rx, ry, .03, 40)
      s += `<path d="${d}" fill="#b98f4f" transform="translate(0 4)"/><path d="${d}" fill="${c.rg('#f6e2b5', '#d7b06d', .45, .4)}" filter="url(#fx-fine)"/>`
      for(let k = 0; k < 26; k++){ const [x, y] = punto(c, areaEll(cx, cy, rx, ry), .9); s += `<ellipse cx="${F(x)}" cy="${F(y)}" rx="${F(c.R(2.5, 6))}" ry="${F(c.R(1.2, 2.6))}" fill="#9a6526" opacity="${F(c.R(.25, .5))}"/>` }
    } else if(t === 'pan'){
      const d = blob(c, cx, cy, rx, ry, .03, 40)
      s += `<path d="M${cx - rx} ${cy} Q${cx - rx} ${F(cy + ry * 1.9)} ${cx} ${F(cy + ry * 2)} Q${cx + rx} ${F(cy + ry * 1.9)} ${cx + rx} ${cy}Z" fill="${c.lg('#d99a4e', '#8f5a22')}"/><path d="${d}" fill="${c.rg('#f8e9c8', '#e2c48f')}" filter="url(#fx-crumb)"/>`
    } else if(t === 'panTapa'){
      s += `<path d="M${cx - rx} ${cy + 6} Q${cx - rx} ${F(cy - ry * 2.6)} ${cx} ${F(cy - ry * 2.8)} Q${cx + rx} ${F(cy - ry * 2.6)} ${cx + rx} ${cy + 6} Q${cx} ${F(cy + ry * .9)} ${cx - rx} ${cy + 6}Z" fill="${c.rg('#e9a85c', '#a8642a', .4, .25)}" filter="url(#fx-fine)"/>`
      for(let k = 0; k < 14; k++){ const x = cx + c.R(-.7, .7) * rx, y = cy - ry * c.R(.6, 2.2); s += `<ellipse cx="${F(x)}" cy="${F(y)}" rx="2.6" ry="1.3" transform="rotate(${F(c.R(-40, 40))} ${F(x)} ${F(y)})" fill="#fbf0d2"/>` }
    } else if(t === 'salsa'){
      s += chorroSalsa(c, areaRect(cx - rx, cy - ry, rx * 2, ry * 2), v.f)
    } else {
      s += dibujarZona(c, mezcla(cp), areaEll(cx, cy, rx, ry))
    }
    if(!cp.top){
      const lx = 236
      s += `<line x1="${cx + rx + 4}" y1="${F(cy)}" x2="${lx - 6}" y2="${F(cy)}" stroke="#8b7a66" stroke-width="1" stroke-dasharray="3 3"/><circle cx="${cx + rx + 3}" cy="${F(cy)}" r="2.6" fill="#5b4a3a"/>`
      s += `<text x="${lx}" y="${F(cy - 3)}" font-size="12.5" fill="#1e293b" font-weight="600" font-family="system-ui,sans-serif">${esc(cp.nombre.length > 17 ? cp.nombre.slice(0, 16) + '…' : cp.nombre)}</text>`
      s += `<text x="${lx}" y="${F(cy + 12)}" font-size="12.5" fill="#047857" font-weight="700" font-family="system-ui,sans-serif">${esc(cp.txt || '')}</text>`
    }
  })
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Armado por capas"><defs>${c.defs}</defs>${s}</svg>`
}

/* ---- Ensaladera ---- */
function svgEnsaladera(items, potes){
  const c = Ctx('e' + items.map(x => x.nombre).join('|'))
  const W = 360, H = 250, cx = 160, cy = 112, rx = 132, ry = 74
  let s = `<ellipse cx="${cx + 4}" cy="${cy + ry + 42}" rx="${rx * .95}" ry="20" fill="#000" opacity=".22" filter="url(#fx-blur)"/>`
  s += `<path d="M${cx - rx} ${cy} Q${cx - rx + 8} ${cy + ry + 50} ${cx} ${cy + ry + 52} Q${cx + rx - 8} ${cy + ry + 50} ${cx + rx} ${cy}Z" fill="${c.lg('#e8f1f5', '#b9cdd8')}" stroke="#9fb7c6"/>`
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#eef5f8" stroke="#9fb7c6" stroke-width="2"/>`
  const ai = areaEll(cx, cy + 4, rx - 10, ry - 8)
  const hojasIt = items.filter(x => x.vis.rol === 'hoja'), tops = items.filter(x => x.vis.rol !== 'hoja')
  if(hojasIt.length) s += dibujarZona(c, mezcla(hojasIt[0]), ai)
  const pins = [], tot = tops.reduce((q, t) => q + Math.max(t.g || 0, 15), 0)
  let ang = -Math.PI * .85
  tops.forEach(t => {
    const da = Math.max(t.g || 0, 15) / tot * Math.PI * 2, am = ang + da / 2
    const px = cx + Math.cos(am) * ai.rx * .5, py = cy + 4 + Math.sin(am) * ai.ry * .5
    const sz = clamp(Math.sqrt(da) * 46, 36, 90)
    s += dibujarZona(c, mezcla(t), areaEll(px, py, sz * .62, sz * .36))
    pins.push([px, py - sz * .2]); ang += da
  })
  s += `<path d="M${cx - rx + 6} ${cy - 10} Q${F(cx - rx * .4)} ${cy - ry - 2} ${cx + 10} ${cy - ry + 1}" stroke="#fff" stroke-width="3" fill="none" opacity=".8" stroke-linecap="round"/>`
  potes.forEach((p, i) => { const x = 318, y = 52 + i * 70; s += pote(c, x, y, 22, p.vis.f); pins.push([x, y - 20]) })
  pins.forEach(([x, y], i) => s += pinSvg(x, y, i + 1))
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ensalada armada"><defs>${c.defs}</defs>${s}</svg>`
}

/* Platos que se arman como una sola preparación (canelones, parmigiana, pastel…) */
function agrupar(p, pz){
  const tPlato = tipoDibujo(p.nombre, visDe(p.nombre, '', ''))
  if(!['rollos', 'horno', 'tarta', 'guiso', 'bolas'].includes(tPlato)) return pz
  if(pz.some(x => tipoDibujo(x.nombre, x.vis) === tPlato || x.unido)) return pz
  const propios = pz.filter(x => !(x.sub && ['guarnicion', 'salsa', 'aderezo'].includes(x.fam)) && !x.cup && x.vis.k !== 'limon' && !(x.vis.rol === 'salsa' && x.sub))
  if(!propios.some(x => !x.sub)) return pz
  const otros = pz.filter(x => !propios.includes(x))
  const gP = propios.reduce((q, x) => q + (x.g || 0), 0)
  const unido = { nombre: p.nombre.split(/ con | y |,/)[0].trim(), g: gP, txt: fmtG(gP), vis: visDe(p.nombre, '', ''), sub: true, fam: 'principal', unido: propios, forz: tPlato, _pn: p.nombre }
  pz.length = 0; pz.push(unido, ...otros)
  return pz
}

/* ---- Qué ilustración mostrar ---- */
function ilustracion(p){
  const a = p._a, pz = piezas(a)
  const esCup = x => x.cup, esLimon = x => x.vis.k === 'limon'
  const bTxt = a.bandeja ? a.bandeja.txt.toLowerCase() : 'bandeja'
  if(a.layout === 'wrap' || a.layout === 'sandwich' || a.layout === 'postre'){
    const dentro = pz.filter(x => !esCup(x) && !esLimon(x) && !(x.sub && (x.fam === 'guarnicion' || x.fam === 'otro')))
    const afuera = pz.filter(x => !dentro.includes(x))
    const orden = { base:0, hoja:1, verdura:2, guarn:2.5, prot:3, otro:3.5, queso:4, salsa:5, extra:6 }
    const capas = dentro.slice().sort((x, y) => (orden[x.vis.rol] ?? 3.5) - (orden[y.vis.rol] ?? 3.5))
    if(a.layout === 'sandwich'){ const pan = capas.find(q => q.vis.rol === 'base'); if(pan) capas.push({ ...pan, top:true }) }
    let h = `<div class="box ilus"><h3>🧩 Armado por capas <span class="sub">de abajo hacia arriba<br>gramos por vianda</span></h3><div class="escena">${svgCapas(capas)}</div></div>`
    if(a.layout !== 'postre'){
      const rellenos = capas.filter(q => q.vis.rol !== 'base' && !q.top).map(q => q.vis.f)
      const zonas = [{ nombre: p.nombre.split(/[,+]/)[0].trim(), txt: fmtG(capas.filter(q => !q.top).reduce((t, q) => t + (q.g || 0), 0)), dibujo: a.layout, rellenos, g: 999 }]
      afuera.filter(x => !esCup(x) && !esLimon(x)).slice(0, 2).forEach(x => zonas.push({ nombre:x.nombre, txt:x.txt, g:x.g, mix: mezcla(x) }))
      const extras = afuera.filter(x => esCup(x) || esLimon(x)).slice(0, 3).map(x => ({ ...x, tipo: esCup(x) ? 'cup' : 'limon' }))
      const refs = zonas.concat(extras).map((z, i) => ({ n:i + 1, nombre:z.nombre, txt:z.txt, nota: z.tipo === 'cup' ? '(en dip)' : '' }))
      h += `<div class="box ilus"><h3>📦 Así va en la ${esc(bTxt)}</h3><div class="escena">${svgBandeja(zonas, extras, a.bandeja)}</div>${refHtml(refs)}</div>`
    }
    return h
  }
  if(a.layout === 'bowl'){
    const items = pz.filter(x => !esCup(x) && x.vis.rol !== 'salsa'), potes = pz.filter(x => esCup(x) || x.vis.rol === 'salsa').slice(0, 3)
    const hojasIt = items.filter(x => x.vis.rol === 'hoja'), tops = items.filter(x => x.vis.rol !== 'hoja')
    const refs = tops.concat(potes).map((x, i) => ({ n:i + 1, nombre:x.nombre, txt:x.txt, nota: potes.includes(x) ? '(aparte, en dip)' : '' }))
    return `<div class="box ilus"><h3>🥗 ${a.guarnicion ? 'Guarnición <span class="sub">va en la bandeja del plato principal</span>' : 'Armado de la ensalada <span class="sub">gramos por vianda</span>'}</h3><div class="escena">${svgEnsaladera(items, potes)}</div>${hojasIt.length ? `<div class="nota" style="margin-bottom:-2px">Base: ${hojasIt.map(x => esc(x.nombre) + ' <b>' + esc(x.txt) + '</b>').join(' + ')}</div>` : ''}${refHtml(refs)}</div>`
  }
  agrupar(p, pz)
  const cubitos = /\bcubos?\b|dados?\b|bocados?\b/.test(norm(p.nombre))
  const extras = pz.filter(x => esCup(x) || esLimon(x)).slice(0, 3).map(x => ({ ...x, tipo: esLimon(x) ? 'limon' : 'cup' }))
  const salsas = pz.filter(x => !esCup(x) && x.vis.rol === 'salsa' && !x.unido).slice(0, 2)
  const resto = pz.filter(x => !extras.find(e => e.nombre === x.nombre) && !salsas.includes(x))
  const rolOrd = { prot:0, otro:1, guarn:2, verdura:3, hoja:4, queso:5, salsa:6, base:7 }
  resto.sort((x, y) => (x.unido ? -1 : y.unido ? 1 : 0) || (rolOrd[x.vis.rol] ?? 1) - (rolOrd[y.vis.rol] ?? 1) || (x.sub === y.sub ? 0 : x.sub ? -1 : 1) || (y.g || 0) - (x.g || 0))
  let zonas = resto.slice(0, 3).map(x => ({ nombre:x.nombre, txt:x.txt, g:x.g, mix: mezcla(x).map(m => cubitos && m.t === 'fetas' ? { ...m, t:'cubos' } : m) }))
  if(resto.length > 3){
    const otros = resto.slice(2), gg = otros.reduce((q, o) => q + (o.g || 0), 0)
    zonas = zonas.slice(0, 2); zonas.push({ nombre: otros.map(o => o.nombre).join(' + '), txt: fmtG(gg), g: gg, mix: otros.slice(0, 4).map(o => ({ t: tipoDibujo(o.nombre, o.vis), v: o.vis, share: Math.max(.25, (o.g || 1) / (gg || 1)) })) })
  }
  if(!zonas.length) zonas = [{ nombre:p.nombre, txt:fmtG(a.pesoVianda), mix:[{ t:'monticulo', v:VIS.otro, share:1 }] }]
  if(salsas.length && zonas.length) zonas[0].salsas = salsas.map(x => x.vis.f)
  let refs = zonas.concat(salsas.map(x => ({ ...x, napa:true })), extras).map((z, i) => ({ n:i + 1, nombre:z.nombre, txt:z.txt, nota: z.tipo === 'cup' ? '(en dip)' : (z.napa ? '(por encima)' : '') }))
  const un = pz.find(x => x.unido)
  if(un && refs[0] && refs[0].nombre === un.nombre) refs[0].nota = '(' + un.unido.map(x => x.nombre + ' ' + x.txt).join(' · ') + ')'
  const titulo = a.guarnicion ? '🥗 Guarnición <span class="sub">va en la bandeja del plato principal</span>' : `📦 Así va en la ${esc(bTxt)} <span class="sub">gramos por vianda</span>`
  return `<div class="box ilus"><h3>${titulo}</h3><div class="escena">${svgBandeja(zonas, extras, a.bandeja)}</div>${refHtml(refs)}</div>`
}

/* Pasos de armado sugeridos (si la receta no tiene paso a paso cargado) */
function pasosSugeridos(p){
  const a = p._a, pz = piezas(a)
  const B = s => `<b>${esc(s)}</b>`
  const bandeja = a.bandeja ? a.bandeja.txt.toLowerCase() : (a.layout === 'bowl' ? 'la ensaladera' : 'la bandeja')
  const pasos = []
  const cierre = () => pasos.push('Termosellá, etiquetá y llevá a heladera.')
  if(a.guarnicion){
    pz.forEach(x => pasos.push(`Prepará ${B(x.nombre)}: ${B(x.txt)} por vianda.`))
    pasos.push('Se ubica en la bandeja del plato principal, al lado del principal.')
    return pasos
  }
  if(a.layout === 'wrap' || a.layout === 'sandwich'){
    const base = pz.find(x => x.vis.rol === 'base')
    const dentro = pz.filter(x => x !== base && !x.cup && x.vis.k !== 'limon' && !(x.sub && (x.fam === 'guarnicion' || x.fam === 'otro')))
    const afuera = pz.filter(x => x !== base && !dentro.includes(x))
    const orden = { hoja:1, verdura:2, guarn:2.5, prot:3, otro:3.5, queso:4, salsa:5 }
    dentro.sort((x, y) => (orden[x.vis.rol] ?? 3.5) - (orden[y.vis.rol] ?? 3.5))
    if(base) pasos.push(a.layout === 'wrap' ? `Apoyá ${B(base.nombre.toLowerCase())} (${base.txt}) abierta sobre la tabla.` : `Abrí el ${B(base.nombre.toLowerCase())} (${base.txt}) y apoyá la base.`)
    dentro.forEach(x => {
      if(x.vis.rol === 'hoja') pasos.push(`Hacé una cama pareja de ${B(x.nombre)}: ${B(x.txt)}.`)
      else if(x.vis.rol === 'salsa') pasos.push(`Agregá ${B(x.nombre)}: ${B(x.txt)} distribuida en todo el largo.`)
      else if(x.vis.rol === 'prot') pasos.push(`Sumá ${B(x.nombre)}: ${B(x.txt)}${a.layout === 'wrap' ? ' en una línea en el centro' : ''}.`)
      else pasos.push(`Agregá ${B(x.nombre)}: ${B(x.txt)}.`)
    })
    pasos.push(a.layout === 'wrap' ? 'Doblá los laterales hacia adentro y enrollá bien firme.' : 'Tapá con la otra mitad del pan y presioná suave.')
    const extras = afuera.map(x => `${B(x.nombre)} (${x.txt}${x.cup ? ', en dip' : ''})`)
    pasos.push(`Ubicá en ${B(bandeja)}${extras.length ? ' y completá con ' + extras.join(', ') : ''}.`)
    cierre()
  } else if(a.layout === 'bowl'){
    const hojasIt = pz.filter(x => x.vis.rol === 'hoja'), salsas = pz.filter(x => x.cup || x.vis.rol === 'salsa'), tops = pz.filter(x => !hojasIt.includes(x) && !salsas.includes(x))
    if(hojasIt.length) pasos.push(`Base de hojas en ${B(bandeja)}: ${hojasIt.map(h => B(h.nombre) + ' ' + B(h.txt)).join(' + ')}.`)
    tops.forEach(t => pasos.push(`Ubicá ${B(t.nombre)}: ${B(t.txt)} en su sector (sin mezclar).`))
    salsas.forEach(q => pasos.push(`${B(q.nombre)}: ${B(q.txt)} aparte, en dip.`))
    cierre()
  } else {
    agrupar(p, pz)
    const un = pz.find(x => x.unido)
    if(un) pasos.push(`Armá ${B(un.nombre.toLowerCase())} con, por porción: ${un.unido.map(x => B(x.nombre) + ' ' + B(x.txt)).join(', ')}.`)
    const extras = pz.filter(x => x.cup || x.vis.k === 'limon')
    const salsas = pz.filter(x => !x.cup && x.vis.rol === 'salsa')
    const resto = pz.filter(x => !extras.includes(x) && !salsas.includes(x))
    const rolOrd = { prot:0, otro:1, guarn:2, verdura:3, hoja:4, queso:5, base:7 }
    resto.sort((x, y) => (rolOrd[x.vis.rol] ?? 1) - (rolOrd[y.vis.rol] ?? 1) || (y.g || 0) - (x.g || 0))
    salsas.forEach(x => resto.splice(1, 0, { ...x, napa:true }))
    let j = -1
    resto.forEach(x => { if(!x.napa) j++; const i = j; x.napa ? pasos.push(`Napá el principal con ${B(x.txt)} de ${B(x.nombre)} por encima.`) : pasos.push(i === 0 ? `${x.unido ? 'Porcioná' : 'Pesá'} ${B(x.txt)} de ${B(x.nombre)} y ubicalo del lado izquierdo de ${B(bandeja)}.` : `Sumá ${B(x.txt)} de ${B(x.nombre)}${i === 1 ? ' del lado derecho' : ''}.`) })
    extras.forEach(x => pasos.push(x.vis.k === 'limon' ? `Terminá con ${B(x.nombre)} (${x.txt}).` : `${B(x.nombre)}: ${B(x.txt)}${x.cup ? ' en dip' : ''}.`))
    pasos.push(`Controlá el peso total: ${B(fmtG(a.pesoVianda))} por vianda.`)
    cierre()
  }
  return pasos
}

/* =====================================================================
   Lista principal
   ===================================================================== */
function render(){
  const soloRot = $('solo-rot').checked
  const q = norm($('q').value).trim().split(/\s+/).filter(Boolean)
  const base = platos.filter(p => !soloRot || p.en_rotacion !== false)
  const cuenta = {}; base.forEach(p => cuenta[p.tipo] = (cuenta[p.tipo] || 0) + 1)
  $('chips').innerHTML = `<button class="chip ${filtroTipo === 'todos' ? 'on' : ''}" data-t="todos">Todos<span class="n">${base.length}</span></button>` +
    TIPOS.filter(t => cuenta[t.v]).map(t => `<button class="chip ${filtroTipo === t.v ? 'on' : ''}" data-t="${t.v}">${t.e} ${t.l}<span class="n">${cuenta[t.v]}</span></button>`).join('')
  const lista = base.filter(p => (filtroTipo === 'todos' || p.tipo === filtroTipo) && q.every(w => norm(p.nombre).includes(w)))
  $('contador').textContent = lista.length + (lista.length === 1 ? ' plato' : ' platos')
  if(!lista.length){ $('lista').innerHTML = `<div class="vacio">No encontré platos${q.length ? ' para “' + esc($('q').value) + '”' : ''}.${soloRot ? '<br><small>Probá destildar “Solo en rotación”.</small>' : ''}</div>`; return }
  $('lista').innerHTML = lista.map(p => {
    const t = TIPO_MAP[p.tipo] || { e:'🍽', c:'#f1f5f9', l:p.tipo || 'Plato' }, a = p._a
    const meta = a.envasado ? [t.l, 'Viene envasado'] : [t.l, a.bandeja ? a.bandeja.txt : (a.guarnicion ? 'Guarnición' : null), a.pesoVianda ? fmtG(a.pesoVianda) + ' por vianda' : null]
    if(tieneEmp(p.id)) meta.push('📷 con foto')
    return `<button class="card" data-id="${p.id}"><div class="em" style="background:${t.c}">${t.e}</div><div class="tx"><div class="nm">${esc(p.nombre.trim())}</div><div class="meta">${esc(meta.filter(Boolean).join(' · '))}</div></div><div class="go">›</div></button>`
  }).join('')
}

/* =====================================================================
   Detalle
   ===================================================================== */
function abrir(id, push){
  const p = platos.find(x => x.id === id); if(!p) return
  platoActual = p; tabActual = 'armado'; empVar = 'reg'; empPrevia = null; alertaEmp = ''; editBandeja = false; editArmado = false; msgEd = ''; borrador = null
  if(push) history.pushState({ id }, '', '#/p/' + id)
  $('detalle').classList.remove('hidden'); $('detalle').scrollTop = 0
  document.body.style.overflow = 'hidden'
  renderDetalle()
  try{ if('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w => wakeLock = w).catch(() => {}) }catch(e){}
}
function cerrar(){
  platoActual = null
  $('detalle').classList.add('hidden'); document.body.style.overflow = ''
  try{ wakeLock && wakeLock.release(); wakeLock = null }catch(e){}
}
function renderDetalle(){
  const p = platoActual; if(!p) return
  const a = p._a, t = TIPO_MAP[p.tipo] || { e:'🍽', l:p.tipo || 'Plato' }
  $('d-nombre').textContent = p.nombre.trim()
  const b = [`<span class="badge">${t.e} ${esc(t.l)}</span>`]
  if(p.proteina && PROT[p.proteina]) b.push(`<span class="badge">${PROT[p.proteina]}</span>`)
  if(a.envasado) b.push(`<span class="badge env">📦 Viene envasado</span>`)
  else if(a.bandeja) b.push(`<span class="badge tray ${a.bandeja.negra ? '' : 'cl'}">📦 ${esc(a.bandeja.txt)}${a.bandeja.negra ? ' negra' : ''}</span>`)
  else if(a.guarnicion) b.push(`<span class="badge">📦 va en la bandeja del principal</span>`)
  if(a.pesoVianda) b.push(`<span class="badge">⚖️ ${fmtG(a.pesoVianda)} por vianda</span>`)
  $('d-badges').innerHTML = b.join('')
  $('p-n').value = N
  $('px-n').value = NXL
  $('quick').innerHTML = [10, 20, 50].map(q => `<button data-q="${q}" class="${N === q ? 'on' : ''}">${q}</button>`).join('')
  $('quickxl').innerHTML = [0, 5, 10].map(q => `<button data-q="${q}" class="${NXL === q ? 'on' : ''}">${q}</button>`).join('')
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === tabActual))
  const body = $('d-body')
  if(tabActual === 'armado') body.innerHTML = vistaArmado(p)
  else if(tabActual === 'ingredientes') body.innerHTML = vistaIngredientes(p)
  else body.innerHTML = vistaTotal(p)
}

/* ---------- Edición: bandeja y pasos de armado ---------- */
let editBandeja = false, editArmado = false, guardandoEd = false, msgEd = '', borrador = null
const packsDisponibles = () => Object.values(srMap).filter(s => /packaging/.test(norm(s.nombre))).sort((x, y) => norm(x.nombre).localeCompare(norm(y.nombre)))
const nombreBandeja = sr => { const n = norm(sr.nombre), m = n.match(/(\d{3})/); return /ensaladera/.test(n) ? 'Ensaladera' : (m ? 'Bandeja ' + m[1] : sr.nombre) }
async function sbEscribir(metodo, ruta, body){
  await config()
  const r = await fetch(`${SB}/${ruta}`, { method: metodo, headers:{ apikey:KEY, Authorization:'Bearer ' + KEY, 'Content-Type':'application/json', Prefer:'return=minimal' }, body: body ? JSON.stringify(body) : undefined })
  if(!r.ok) throw new Error(await r.text())
}
function boxBandeja(p){
  const a = p._a
  const actual = a.comps.find(c => c.tipo === 'sub' && c.pack && /packaging/.test(norm(c.nombre)))
  let h = `<div class="box"><h3>📦 Bandeja <span class="sub">${a.bandeja ? esc(a.bandeja.txt) + (a.bandeja.negra ? ' negra' : '') : 'sin bandeja cargada'}</span></h3>`
  if(!editBandeja){
    h += `<div class="nota" style="margin-top:0">Si ves que el plato va mejor en otra bandeja, cambiala acá: se actualiza también en el recetario (packaging del plato).</div><div class="btn-row"><button class="btn sec" data-ed="bandeja">✏️ Cambiar bandeja</button></div>`
  } else {
    const ops = packsDisponibles()
    h += `<div style="display:grid;gap:8px">${ops.map(sr => `<label class="toggle" style="padding:10px 12px;border:1px solid var(--borde);border-radius:12px;font-size:15px;color:var(--tinta)"><input type="radio" name="bj" value="${sr.id}" ${actual && actual.sr.id === sr.id ? 'checked' : ''}> ${esc(nombreBandeja(sr))} <small style="color:var(--gris);margin-left:auto">${esc(sr.nombre)}</small></label>`).join('')}
      <label class="toggle" style="padding:10px 12px;border:1px solid var(--borde);border-radius:12px;font-size:15px;color:var(--tinta)"><input type="radio" name="bj" value="" ${actual ? '' : 'checked'}> Sin bandeja propia</label></div>
      <div class="nota">¿Falta una bandeja (por ej. la 445)? Creá la sub-receta “packaging 445” en el recetario y aparece acá.</div>
      <div class="btn-row"><button class="btn sec" data-ed="cancelar">Cancelar</button><button class="btn pri" data-ed="guardar-bandeja">${guardandoEd ? 'Guardando…' : '✓ Guardar bandeja'}</button></div>`
  }
  if(msgEd) h += `<div class="estado" style="margin:10px 0 0">${esc(msgEd)}</div>`
  return h + `</div>`
}
function pasosTexto(p){
  if(p.descripcion && p.descripcion.trim()) return p.descripcion.trim()
  const tmp = document.createElement('div')
  return pasosSugeridos(p).map(x => { tmp.innerHTML = x; return tmp.textContent }).join('\n')
}
function boxArmado(p){
  const propio = !!(p.descripcion && p.descripcion.trim())
  if(editArmado){
    return `<div class="box"><h3>✏️ Editar armado <span class="sub">un paso por renglón</span></h3>
      <textarea id="ed-pasos" style="width:100%;min-height:220px;border:1px solid var(--borde);border-radius:12px;padding:10px;font:inherit;font-size:15px;line-height:1.45">${esc(borrador ?? pasosTexto(p))}</textarea>
      <div class="nota">Se guarda en el recetario como “Paso a paso / Descripción” del plato, así lo ve todo el equipo.</div>
      <div class="btn-row"><button class="btn sec" data-ed="cancelar">Cancelar</button><button class="btn pri" data-ed="guardar-armado">${guardandoEd ? 'Guardando…' : '✓ Guardar armado'}</button></div></div>`
  }
  const pasos = propio ? p.descripcion.trim().split(/\n+/).map(x => x.replace(/^\s*(\d+[\.\)-]|[-•*])\s*/, '').trim()).filter(Boolean).map(esc) : pasosSugeridos(p)
  return `<div class="box"><h3>👩‍🍳 Armado <span class="sub">por vianda</span></h3><ol class="pasos">${pasos.map(x => `<li>${x}</li>`).join('')}</ol>
    ${propio ? '' : '<div class="nota">Pasos generados automáticamente a partir de la receta. Editalos para dejarlos como los hacen ustedes.</div>'}
    <div class="btn-row"><button class="btn sec" data-ed="armado">✏️ Editar armado</button></div></div>`
}
async function guardarBandeja(){
  const p = platoActual; if(!p || guardandoEd) return
  const sel = document.querySelector('input[name="bj"]:checked'); const nuevo = sel ? sel.value : ''
  const actuales = p._a.comps.filter(c => c.tipo === 'sub' && c.pack && /packaging/.test(norm(c.nombre)))
  guardandoEd = true; msgEd = ''; renderDetalle()
  try{
    if(nuevo){
      if(actuales.length) await sbEscribir('PATCH', 'plato_ingredientes?id=eq.' + encodeURIComponent(actuales[0].rowId), { ref_id: nuevo })
      else await sbEscribir('POST', 'plato_ingredientes', [{ id: crypto.randomUUID(), plato_id: p.id, tipo:'subreceta', ref_id: nuevo, cantidad: 1, unidad:'unidad', crudo: null }])
      for(const c of actuales.slice(1)) await sbEscribir('DELETE', 'plato_ingredientes?id=eq.' + encodeURIComponent(c.rowId))
    } else {
      for(const c of actuales) await sbEscribir('DELETE', 'plato_ingredientes?id=eq.' + encodeURIComponent(c.rowId))
    }
    editBandeja = false
    await cargar(true)
  }catch(e){ console.error(e); msgEd = 'No se pudo cambiar la bandeja. Probá de nuevo.' }
  guardandoEd = false; renderDetalle()
}
async function guardarArmado(){
  const p = platoActual; if(!p || guardandoEd) return
  const txt = borrador ?? (($('ed-pasos') || {}).value)
  if(txt == null) return
  const limpio = txt.split('\n').map(x => x.trim()).filter(Boolean).join('\n')
  guardandoEd = true; msgEd = ''; renderDetalle()
  try{
    await sbEscribir('PATCH', 'platos?id=eq.' + encodeURIComponent(p.id), { descripcion: limpio || null })
    p.descripcion = limpio || null
    editArmado = false; borrador = null
  }catch(e){ console.error(e); msgEd = 'No se pudo guardar el armado. Probá de nuevo.'; editArmado = false }
  guardandoEd = false; renderDetalle()
}

function vistaArmado(p){
  const a = p._a
  if(a.envasado){
    const it = a.comps.filter(c => !c.pack && c.tipo !== 'falta')
    const fe = fotoDe(p)
    return `<div class="box envasado">${fe ? `<div class="foto"><img src="${esc(fe.img)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>` : '<div class="ic">📦</div>'}<div class="big">Producto envasado</div><div class="nota" style="font-size:14px">No requiere armado. Retirá del stock:</div>
      <table class="tabla" style="margin-top:10px">${it.map(c => `<tr><td>${esc(c.nombre)}</td><td class="num">${c.tipo === 'ins' && !c.line.peso ? fmtU(c.line.unidades * (N + NXL)) + ' u.' : fmtG(c.g * (N + NXL))}</td></tr>`).join('')}</table>
      <div class="nota">Controlá vencimiento y que la etiqueta diga <b>Sin TACC</b>. Guardalo separado del resto para evitar contaminación cruzada.</div></div>`
  }
  const foto = fotoDe(p)
  let h = ''
  h += foto ? `<div class="box"><div class="foto"><img src="${esc(foto.img)}" alt="${esc(p.nombre)}" loading="lazy" onerror="this.closest('.box').remove()"><div class="cap">📸 ${foto.exacta ? 'Foto del plato en la app de pedidos' : 'Foto de referencia: ' + esc(foto.nombre)}</div></div><div class="nota" style="margin-top:0">Así se ve en la app de pedidos (emplatado).</div></div>` : ''
  h += boxEmplatado(p)
  h += boxBandeja(p)
  h += boxArmado(p)
  const notas = a.comps.filter(c => c.tipo === 'sub' && !c.pack && c.sr.descripcion && c.sr.descripcion.trim())
  if(notas.length) h += `<div class="box"><h3>💡 Notas de las preparaciones</h3>${notas.map(c => `<p class="texto-receta" style="margin:0 0 10px"><b>${esc(c.nombre)}:</b> ${esc(c.sr.descripcion.trim())}</p>`).join('')}</div>`
  if(N + NXL > 1) h += `<div class="nota" style="text-align:center">Las cantidades para ${porcTxt()} están en ⚖️ Ingredientes y 🧾 Producción.</div>`
  return h
}

/* Factores de producción: XL lleva 30% más de lo que dice la receta.
   - gramos y todo lo de una preparación (sub-receta)  → regulares + XL × 1,3
   - unidades por vianda (tortillas, panes, bandejas, dips) → regulares + XL */
const XL_EXTRA = 1.3
const factores = () => ({ g: N + NXL * XL_EXTRA, u: N + NXL, total: N + NXL })
const kDe = (l, K, enPrep) => l.pack ? K.u : ((enPrep || l.peso) ? K.g : K.u)
const cantTxt = (l, K, enPrep) => l.peso ? fmtG(l.g * kDe(l, K, enPrep), l.liq) : fmtU(l.unidades * kDe(l, K, enPrep)) + ' u.'
const filaIns = (l, K, enPrep) => `<tr><td>${esc(l.nombre)}</td><td class="num">${cantTxt(l, K, enPrep)}</td></tr>`
const porcTxt = () => NXL ? `${N} reg. + ${NXL} XL` : `${N} porc.`
const kpiPorc = () => `<div class="kpi"><div class="v">${N + NXL}</div><div class="l">${NXL ? `porciones (${NXL} XL)` : 'porciones'}</div></div>`
const notaXL = () => NXL ? `<div class="nota">Las ${NXL} XL llevan <b>30% más</b> de cada ingrediente (las unidades por vianda y el packaging no cambian).</div>` : ''
const thead = `<tr><th>Insumo</th><th>Cantidad</th></tr>`

function vistaIngredientes(p){
  const a = p._a, K = factores()
  if(a.envasado) return vistaArmado(p)
  let h = `<div class="box"><div class="kpis">
    ${kpiPorc()}
    <div class="kpi"><div class="v">${fmtG(a.pesoVianda)}</div><div class="l">por vianda${NXL ? ` · XL ${fmtG(a.pesoVianda * XL_EXTRA)}` : ''}</div></div>
    <div class="kpi"><div class="v">${fmtG(a.pesoVianda * K.g)}</div><div class="l">total</div></div></div>
    <div class="nota">Cantidades tal como figuran en la receta.</div>${notaXL()}</div>`
  const directos = []
  a.comps.forEach(c => {
    if(c.pack || c.tipo === 'falta') return
    if(c.tipo === 'ins') directos.push(c.line)
    if(c.tipo === 'sub' && c.expand) c.lines.filter(l => !l.pack).forEach(l => directos.push(l))
  })
  const preps = a.comps.filter(c => c.tipo === 'sub' && !c.pack && !c.expand)
  if(preps.length){
    h += `<div class="box"><h3>🍳 Preparaciones <span class="sub">tocá para ver la receta</span></h3>`
    preps.forEach((c, i) => {
      const sr = c.sr, ru = sr.unidad_rendimiento || 'unidad'
      const rendTxt = PESO.has(ru) ? fmtG(toG(+sr.rendimiento || 0, ru)) : `${fmtU(+sr.rendimiento || 1)} ${ru}`
      h += `<details class="prep" ${i === 0 && preps.length < 3 ? 'open' : ''}><summary><span class="ar">›</span><span class="pn">${esc(c.nombre)}<small>${esc(c.cantTxt)} por vianda · la receta base rinde ${esc(rendTxt)}</small></span><span class="pt">${fmtG(c.g * K.g)}</span></summary>
        <div class="pb"><div class="nota" style="margin:2px 0 6px">Hacer <b>×${fmtU(c.f * K.g)}</b> la receta base.</div><table class="tabla">${thead}${c.lines.map(l => filaIns(l, K, true)).join('')}</table>
        ${sr.descripcion ? `<div class="nota">💡 ${esc(sr.descripcion)}</div>` : ''}</div></details>`
    })
    h += `</div>`
  }
  if(directos.length) h += `<div class="box"><h3>🧩 Insumos para el armado <span class="sub">${porcTxt()}</span></h3><table class="tabla">${thead}${directos.map(l => filaIns(l, K, false)).join('')}</table></div>`
  const packs = a.comps.filter(c => c.pack)
  if(packs.length){
    const filas = []; packs.forEach(c => { if(c.tipo === 'ins') filas.push(c.line); else c.lines.forEach(l => filas.push(l)) })
    h += `<div class="box"><h3>📦 Packaging</h3><table class="tabla"><tr><th>Ítem</th><th>Cantidad</th></tr>${filas.map(l => filaIns(l, { g: K.u, u: K.u }, false)).join('')}</table></div>`
  }
  const faltan = a.comps.filter(c => c.tipo === 'falta')
  if(faltan.length) h += `<div class="estado" style="margin:0">⚠️ Esta receta tiene ${faltan.length} ingrediente(s) que ya no existen en el recetario. Avisale a quien carga las recetas.</div>`
  return h
}

function vistaTotal(p){
  const a = p._a, K = factores(), tot = {}
  if(a.envasado) return vistaArmado(p)
  const sumar = (l, enPrep) => {
    const key = l.id + (l.peso ? '' : '_u')
    const t = tot[key] || (tot[key] = { nombre:l.nombre, cat:l.cat || '', peso:l.peso, liq:l.liq, pack:l.pack, g:0, u:0 })
    const k = l.pack ? K.u : kDe(l, K, enPrep)
    t.g += l.g * k; t.u += (l.unidades || 0) * k
  }
  a.comps.forEach(c => { if(c.tipo === 'ins') sumar(c.line, false); if(c.tipo === 'sub') c.lines.forEach(l => sumar(l, !c.expand && !c.pack)) })
  const arr = Object.values(tot)
  const comida = arr.filter(t => !t.pack).sort((x, y) => (x.cat || '').localeCompare(y.cat || '') || x.nombre.localeCompare(y.nombre))
  const pack = arr.filter(t => t.pack)
  const fila = t => `<tr><td>${esc(t.nombre)}</td><td class="num">${t.peso ? fmtG(t.g, t.liq) : fmtU(t.u) + ' u.'}</td></tr>`
  let h = `<div class="box"><div class="kpis">
    ${kpiPorc()}
    <div class="kpi"><div class="v">${fmtG(a.pesoVianda)}</div><div class="l">por vianda${NXL ? ` · XL ${fmtG(a.pesoVianda * XL_EXTRA)}` : ''}</div></div>
    <div class="kpi"><div class="v" style="color:var(--verde-osc)">${fmtG(a.pesoVianda * K.g)}</div><div class="l">total</div></div></div>
    <div class="nota">Lista consolidada: suma cada insumo de todas las preparaciones del plato. Sirve para sacar de cámara o pedir mercadería.</div>${notaXL()}</div>`
  let cat = null, filas = ''
  comida.forEach(t => { if(t.cat !== cat){ cat = t.cat; filas += `<tr class="cat"><td colspan="2">${esc(cap((cat || 'otros').replace(/_/g, ' ')))}</td></tr>` } filas += fila(t) })
  h += `<div class="box"><h3>🧾 Total de insumos <span class="sub">${porcTxt()}</span></h3><table class="tabla">${thead}${filas}</table></div>`
  if(pack.length) h += `<div class="box"><h3>📦 Packaging</h3><table class="tabla"><tr><th>Ítem</th><th>Cantidad</th></tr>${pack.map(fila).join('')}</table></div>`
  return h
}

/* =====================================================================
   Eventos
   ===================================================================== */
$('q').addEventListener('input', () => { $('q-clear').classList.toggle('hidden', !$('q').value); render() })
$('q-clear').onclick = () => { $('q').value = ''; $('q-clear').classList.add('hidden'); render(); $('q').focus() }
$('solo-rot').onchange = render
$('chips').onclick = e => { const b = e.target.closest('.chip'); if(!b) return; filtroTipo = b.dataset.t; render() }
$('lista').onclick = e => { const c = e.target.closest('.card'); if(c) abrir(c.dataset.id, true) }
$('btn-back').onclick = () => { if(location.hash.startsWith('#/p/')) history.back(); else cerrar() }
$('btn-refresh').onclick = () => { $('btn-refresh').textContent = '…'; cargar(true).finally(() => $('btn-refresh').textContent = '⟳') }
$('tabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; tabActual = b.dataset.t; renderDetalle(); $('detalle').scrollTop = 0 }
const setN = v => { N = clamp(Math.round(+v || 0), 0, 9999); if(!N && !NXL) N = 1; renderDetalle() }
const setNXL = v => { NXL = clamp(Math.round(+v || 0), 0, 9999); if(!N && !NXL) N = 1; renderDetalle() }
$('px-menos').onclick = () => setNXL(NXL - 1)
$('px-mas').onclick = () => setNXL(NXL + 1)
$('px-n').addEventListener('change', e => setNXL(e.target.value))
$('px-n').addEventListener('focus', e => e.target.select())
$('quickxl').onclick = e => { const b = e.target.closest('button'); if(b) setNXL(b.dataset.q) }
$('p-menos').onclick = () => setN(N - 1)
$('p-mas').onclick = () => setN(N + 1)
$('p-n').addEventListener('change', e => setN(e.target.value))
$('p-n').addEventListener('focus', e => e.target.select())
$('d-body').addEventListener('click', e => {
  const bv = e.target.closest('[data-empvar]')
  if(bv){ empVar = bv.dataset.empvar; empPrevia = null; alertaEmp = ''; renderDetalle(); return }
  const b = e.target.closest('[data-emp]'); if(!b) return
  const acc = b.dataset.emp
  if(acc === 'sacar'){ alertaEmp = ''; $('cam').value = ''; $('cam').click() }
  if(acc === 'cancelar'){ empPrevia = null; renderDetalle() }
  if(acc === 'guardar') guardarEmp()
})
$('d-body').addEventListener('input', e => { if(e.target.id === 'ed-pasos') borrador = e.target.value })
$('d-body').addEventListener('click', e => {
  const b = e.target.closest('[data-ed]'); if(!b) return
  const acc = b.dataset.ed
  if(acc === 'guardar-armado'){ const v = ($('ed-pasos') || {}).value; guardarArmado(v); return }
  msgEd = ''
  if(acc === 'bandeja'){ editBandeja = true; editArmado = false }
  if(acc === 'armado'){ editArmado = true; editBandeja = false }
  if(acc === 'cancelar'){ editBandeja = false; editArmado = false; borrador = null }
  if(acc === 'guardar-bandeja'){ guardarBandeja(); return }
  renderDetalle()
})
$('cam').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if(!f) return
  try{ empPrevia = await comprimir(f); alertaEmp = '' }catch(err){ alertaEmp = err.message }
  tabActual = 'armado'; renderDetalle(); $('detalle').scrollTop = 0
})
$('quick').onclick = e => { const b = e.target.closest('button'); if(b) setN(b.dataset.q) }
window.addEventListener('popstate', () => { const m = location.hash.match(/^#\/p\/(.+)$/); if(m) abrir(m[1], false); else cerrar() })
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && platoActual && 'wakeLock' in navigator) navigator.wakeLock.request('screen').then(w => wakeLock = w).catch(() => {})
})
cargarFotos()
cargar().then(() => {
  cargarEmpIds(); const m = location.hash.match(/^#\/p\/(.+)$/); if(m) abrir(m[1], false) })
</script>
