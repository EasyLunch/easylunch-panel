<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambios de último momento · Easy Lunch</title>
<style>
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f3f6fb;color:#1b2433}
  .c{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#173f7e;font-weight:600}
  .s{width:26px;height:26px;border:3px solid #e8eff9;border-top-color:#173f7e;border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .e{color:#c0362c;font-weight:500;max-width:420px;text-align:center;padding:0 16px}
</style>
</head>
<body>
<div class="c" id="c"><div class="s"></div><span>Cargando…</span></div>
<script>
// Página de cambios para los clientes, servida desde el panel (sin el cartel azul de Google Apps Script).
// El contenido es el mismo de Cliente.html del proyecto "Cambios clientes API": se pide a la app web y se dibuja acá,
// así cualquier cambio que se publique allá aparece solo, sin tocar este archivo.
// (todo dentro de una función: la página que se dibuja declara sus propias variables globales)
(function () {
fetch('https://script.google.com/macros/s/AKfycbwvZb2Hf3oLJZksl2b_vKqD5dcefhfX82Ob4t_M2XBZ4ej5ObNQxH4E9l-N9bPk3mlX/exec', { method: 'POST', body: JSON.stringify({ accion: 'pagina' }) })
  .then(r => r.json())
  .then(j => {
    if (!j || !j.ok || !j.html) throw new Error((j && j.error) || 'sin página');
    document.open();
    document.write(j.html);
    document.close();
  })
  .catch(() => {
    document.getElementById('c').innerHTML = '<p class="e">No pudimos cargar la página. Probá de nuevo en un rato o escribinos por WhatsApp: ' +
      '<a href="https://wa.me/5491139042215">11 3904-2215</a></p>';
  });
})();
</script>
</body>
</html>
